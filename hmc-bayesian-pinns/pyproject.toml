[project]
name = "hmc-bayesian-pinns-study"
version = "0.2.0"
description = "Reproducible inverse-diffusion posterior-geometry study accompanying a Bayesian PINNs essay"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
test = ["arviz>=0.20"]

[tool.ruff]
line-length = 110
target-version = "py310"

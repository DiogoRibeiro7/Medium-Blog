# Top-level folders of Medium-Blog and the group each one is listed under in README.md.
#
# scripts/build_readme.py builds the "Projects" part of README.md from this file and from the
# first heading of each folder's README. On a pull request the readme-index workflow only checks
# this file; after the merge it rebuilds README.md on main and commits it.
#
# Adding a folder: add one line under `folders`, in alphabetical order:
#   my-new-study: operations-and-decisions
# Optional keys, written as {group: ..., part: ..., title: ...}:
#   part   position inside a series (the first part the folder belongs to); folders without it
#          follow, by name. Follow-up series count from 101.
#   title  replaces the README heading in the list.
# A folder that is not listed still appears in README.md, under "Not yet sorted".
#
# Section kinds: series and themes list each folder with its title; tooling likewise;
# archive lists its folders on one line.

sections:
  - id: series-methods
    kind: series
    title: "Series: statistics, machine learning and data engineering"
  - id: series-economics
    kind: series
    title: "Series: economics and economic history"
  - id: themes
    kind: themes
    title: "Standalone studies, by theme"
  - id: tooling
    kind: tooling
    title: "Repository tooling"
  - id: archive
    kind: archive
    title: "Historical archive"

groups:
  - id: causal-inference-in-statistics
    section: series-methods
    title: "Causal Inference in Statistics"
    about: "Twenty simulation experiments with a known causal effect, one estimator or design per part."
  - id: survival-analysis-for-data-scientists
    section: series-methods
    title: "Survival Analysis for Data Scientists"
    about: "A six-part introduction to time-to-event analysis."
  - id: monty-hall
    section: series-methods
    title: "The Monty Hall Problem"
    about: "Four parts on the host protocol and selection."
  - id: simpsons-paradox
    section: series-methods
    title: "Simpson's Paradox"
    about: "Four parts on which table answers the question."
  - id: regression-to-the-mean
    section: series-methods
    title: "Regression to the Mean"
    about: "Four parts on selecting on a noisy measurement."
  - id: statistical-process-control
    section: series-methods
    title: "Statistical Process Control"
    about: "Estimated control limits on production lines and the in-control ARL."
  - id: backward-evaluation
    section: series-methods
    title: "Backward Evaluation of Forecasting Models"
    about: "Training on the present and testing on the past, with pre-registered tests."
  - id: overcoming-data-challenges
    section: series-methods
    title: "Overcoming Data Challenges"
    about: "One method per data problem, each with a real-data experiment."
  - id: contact-centre-synthetic-data
    section: series-methods
    title: "Synthetic Data for a Contact Centre"
    about: "Mechanistic, data-driven and hybrid generators, tested on a real call centre."
  - id: actuarial-tariff-calibration
    section: series-methods
    title: "Actuarial Data Science: Discrimination, Calibration and the Tariff"
    about: "Why a good Gini is not a good tariff."
  - id: code-quality-for-data-work
    section: series-methods
    title: "Code Quality for Data Work"
    about: "SQL quality, pipeline tests and data tests."
  - id: correctness-over-time
    section: series-methods
    title: "Correctness Over Time in Data Pipelines"
    about: "Where time makes correct pipelines give wrong numbers."
  - id: midterm-2026-forecast
    section: series-methods
    title: "The 2026 Midterm Forecast"
    about: "Fit against prediction in an election model."
  - id: us-political-economy
    section: series-economics
    title: "U.S. Political Economy, 1870–2025"
    about: "Nine periods of U.S. economic history measured with public data."
  - id: euro-crisis
    section: series-economics
    title: "The Euro-Area Debt Crisis and Its Aftermath"
    about: "The 2010–2025 ledger, France in 2026, Germany, the ECB and Portugal."
  - id: eu-import-dependence
    section: series-economics
    title: "EU Dependence on Suppliers Outside the Bloc"
    about: "Dependence product by product, a redesigned screen and its lead time."
  - id: capacity-and-recovery
    section: series-economics
    title: "Capacity Lock-In, Shocks and Recovery"
    about: "When a market can rebuild lost capacity."
  - id: eu-crops-and-weather
    section: series-economics
    title: "Heat, Drought and Europe's Crops"
    about: "Weather and yields across EU regions."
  - id: portugal-wages-and-living-costs
    section: series-economics
    title: "Portuguese Wages and the Cost of Living since 1975"
    about: "Counterfactual wages and household spending on basic needs."
  - id: eu-wages
    section: series-economics
    title: "Wage Setting in the EU, with Portugal as a Special Case"
    about: "Labour law as auction and bargaining, and scenario forecasts."
  - id: europe-low-wage-path
    section: series-economics
    title: "Europe's Low-Wage Path, Measured"
    about: "Four measurements behind the low-wage argument, and their follow-ups."
  - id: billionaires-poverty
    section: series-economics
    title: "Billionaire Density and Poverty"
    about: "The 54-country reanalysis and its follow-ups."
  - id: wealth-concentration
    section: series-economics
    title: "Wealth Concentration and Growth"
    about: "Wealth against productivity across countries, then inherited and self-made billionaire wealth."
  - id: taxation-efficiency-drug-prices
    section: series-economics
    title: "Taxes, Efficiency and the Price of Medicines"
    about: "What a single public buyer obtains for medicines, compared with the United States, and the follow-ups."
  - id: statistics-for-data-scientists
    section: themes
    title: "Statistics for Data Scientists"
    about: "Standalone 'X is not Y' guides, each with a simulation study."
  - id: ml-and-statistical-methods
    section: themes
    title: "Machine Learning and Statistical Methods"
    about: "Method studies on public and simulated data."
  - id: operations-and-decisions
    section: themes
    title: "Operations and Decisions"
    about: "Decision problems with data: orders, rosters, routing, prices and storms."
  - id: housing
    section: themes
    title: Housing
    about: "Housing supply, prices and affordability."
  - id: economics-and-society
    section: themes
    title: "Economics and Society"
    about: "Prices, labour, taxes, growth and elections."
  - id: history-measured
    section: themes
    title: "History, Measured"
    about: "Questions about the past, tested on historical records."
  - id: science-and-mathematics
    section: themes
    title: "Science and Mathematics"
    about: "Questions from science and everyday life, checked with code."
  - id: tooling
    section: tooling
    title: "Shared tooling"
    about: "Repository checks, shared assets and data-source records."
  - id: archive
    section: archive
    title: "Older article material"
    about: "Notebooks, scripts and data behind older articles, kept at their original paths. Not guaranteed to run unchanged today."


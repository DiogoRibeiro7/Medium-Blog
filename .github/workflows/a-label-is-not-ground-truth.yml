name: Label quality article reproducibility

on:
  pull_request:
    paths:
      - 'a-label-is-not-ground-truth/**'
      - '.github/workflows/a-label-is-not-ground-truth.yml'
  push:
    branches:
      - main
    paths:
      - 'a-label-is-not-ground-truth/**'
      - '.github/workflows/a-label-is-not-ground-truth.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: a-label-is-not-ground-truth
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/mpl-label-ci
      RUN_NOTEBOOK_EXECUTION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: a-label-is-not-ground-truth/requirements.txt
      - name: Install scientific and notebook dependencies
        run: python -m pip install -r requirements.txt
      - name: Test numerical identities, evidence and fresh notebook execution
        run: python -m unittest discover -s tests -v
      - name: Regenerate isolated quick evidence
        run: python analysis.py --quick

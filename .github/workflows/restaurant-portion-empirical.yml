name: Restaurant real-data validation (R)
on:
  pull_request:
    paths:
      - "restaurant-portion-economics/**"
      - ".github/workflows/restaurant-portion-empirical.yml"
  workflow_dispatch:
jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Install project-local R dependencies
        run: Rscript -e 'install.packages(c("jsonlite", "readxl"), repos="https://cloud.r-project.org")'
      - name: Verify published files and execute analyses
        working-directory: restaurant-portion-economics
        run: |
          Rscript scripts/download-data.R
          Rscript scripts/validate-sources.R
          Rscript scripts/analyse-finland.R
          Rscript scripts/audit-empirical-results.R
          Rscript scripts/analyse-commercial.R
          Rscript scripts/analyse-commercial-selection.R
          Rscript scripts/analyse-commercial-heterogeneity.R
          test -s outputs/zenodo_source_manifest.csv
          test -s outputs/finland_daily.csv
          test -s outputs/finland_period.csv
          test -s outputs/finland_menu_matched.csv
          test -s outputs/finland_mass_diagnostics.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restaurant-waste-source-audit
          path: |
            restaurant-portion-economics/outputs/finland_*.csv
            restaurant-portion-economics/outputs/zenodo_source_manifest.csv
            restaurant-portion-economics/outputs/commercial_*.csv
          if-no-files-found: warn
          retention-days: 30

name: Reproduce dependency-screen-design

on:
  pull_request:
    paths:
      - 'dependency-screen-design/**'
      - 'europe-deindustrialisation/data/hs6_*.csv'
      - 'europe-deindustrialisation/data/gas_*.csv'
      - '.github/workflows/dependency-screen-design.yml'
  push:
    branches:
      - main
    paths:
      - 'dependency-screen-design/**'
      - '.github/workflows/dependency-screen-design.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dependency-screen-design
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: dependency-screen-design/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q tests

      - name: Diagnosis on the HS 6-digit panel
        run: python panel.py > /dev/null

      - name: Natural gas as a known case
        run: python energy.py > /dev/null

      - name: Supply-based screen, 2025
        run: python supply.py > /dev/null

      - name: Figures
        run: python figures.py

      - name: Summaries unchanged within tolerance
        run: |
          S="results/panel_summary.txt results/energy_summary.txt results/supply_summary.txt"
          git diff --stat -- $S || true
          python check_results.py $S

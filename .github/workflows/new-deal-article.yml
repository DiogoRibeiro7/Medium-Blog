name: New Deal article reproducibility

on:
  pull_request:
    paths:
      - "new-deal-social-contract/**"
      - ".github/workflows/new-deal-article.yml"
  push:
    paths:
      - "new-deal-social-contract/**"
      - ".github/workflows/new-deal-article.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-deal-social-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: new-deal-social-contract/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run source integrity and mathematical contract tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild publication figures and result tables
        run: python analysis.py
      - name: Count publication artifacts
        run: python -c "from pathlib import Path; assert len(list(Path('figures').glob('figure_*.png'))) == 8; assert len(list(Path('results').glob('*.csv'))) == 3"

name: Reproduce dependency-early-warning

on:
  pull_request:
    paths:
      - 'dependency-early-warning/**'
      - '.github/workflows/dependency-early-warning.yml'
  push:
    branches:
      - main
    paths:
      - 'dependency-early-warning/**'
      - '.github/workflows/dependency-early-warning.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dependency-early-warning
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: dependency-early-warning/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q tests

      - name: Panel and run-up to entry
        run: python panel.py > /dev/null

      - name: Out-of-time forecasts
        run: python warning.py > /dev/null

      - name: Figures
        run: python figures.py

      - name: Summaries unchanged within tolerance
        run: |
          S="results/panel_summary.txt results/warning_summary.txt"
          git diff --stat -- $S || true
          python check_results.py $S

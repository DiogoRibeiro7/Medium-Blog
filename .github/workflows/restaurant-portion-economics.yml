name: Restaurant portion economics (R)
on:
  pull_request:
    paths:
      - "restaurant-portion-economics/**"
      - ".github/workflows/restaurant-portion-economics.yml"
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Offline base-R economic and data tests
        working-directory: restaurant-portion-economics
        run: |
          Rscript tests/test-economics.R
          Rscript tests/test-finland.R
          Rscript tests/test-empirical-audit.R
          Rscript tests/test-commercial.R
          Rscript tests/test-commercial-selection.R
          Rscript tests/test-commercial-heterogeneity.R
          Rscript tests/test-profit-bounds.R
          Rscript tests/test-public-cost-anchors.R
          Rscript tests/test-menu-designs.R
          Rscript scripts/analyse-menu-designs.R
          Rscript scripts/analyse-public-cost-anchors.R
          Rscript scripts/analyse-profit-frontier.R
          Rscript scripts/run-analysis.R
      - name: Verify generated scenario files
        working-directory: restaurant-portion-economics
        run: |
          test -s outputs/scenario.csv
          test -s outputs/sensitivity.csv
          test -s outputs/threshold.csv
          test -s outputs/profit_bounds.csv
          test -s outputs/profit_frontier.csv
          test -s outputs/profit_assumptions.csv
          test -s outputs/public_cost_proxy_scenarios.csv
          test -s outputs/public_cost_source_register.csv
          test -s outputs/menu_design_comparison.csv
          test -s outputs/menu_design_sensitivity.csv

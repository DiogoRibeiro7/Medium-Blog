name: Hansard classifier drift CI

on:
  pull_request:
    paths:
      - "hansard-classifier-drift/**"
      - ".github/workflows/hansard-classifier-drift-ci.yml"
      - ".github/workflows/hansard-classifier-drift-run.yml"
  push:
    branches:
      - main
    paths:
      - "hansard-classifier-drift/**"
      - ".github/workflows/hansard-classifier-drift-ci.yml"
      - ".github/workflows/hansard-classifier-drift-run.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hansard-classifier-drift

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Unit and end-to-end tests on synthetic data
        run: python -m pytest

      - name: Check committed results
        run: |
          if [ -f results/stage1/manifest.json ]; then
            hansard-drift check
          else
            echo "No committed results yet."
          fi

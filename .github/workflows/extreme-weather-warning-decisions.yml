name: Reproduce extreme-weather-warning-decisions

on:
  pull_request:
    paths:
      - 'extreme-weather-warning-decisions/**'
      - '.github/workflows/extreme-weather-warning-decisions.yml'
  push:
    branches:
      - main
    paths:
      - 'extreme-weather-warning-decisions/**'
      - '.github/workflows/extreme-weather-warning-decisions.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extreme-weather-warning-decisions
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: extreme-weather-warning-decisions/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Rerun the model
        run: python warning_decisions.py > results/output.txt

      - name: Check the numbers match the committed run
        run: git diff --exit-code -- results/output.txt

      - name: Check every figure was drawn
        run: |
          for f in 01_chronology 02_cost_loss 03_value_of_waiting 04_accuracy_and_delay 05_reversibility; do
            test -s "figures/$f.png"
          done

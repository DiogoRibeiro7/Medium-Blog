name: GDP resilience publication figures

on:
  pull_request:
    paths:
      - 'research/gdp-economic-resilience/**'
      - 'data_sources/world-bank-wdi-gdp-resilience-2026-11-26.json'
      - 'data_sources/world-bank-cwon-2024-gdp-resilience-2026-11-26.json'
      - 'data_sources/eurostat-services-energy-time.json'
      - 'data_sources/eurostat-services-relative-prices.json'
      - '.github/workflows/gdp-resilience-figures.yml'
  push:
    branches: [main]
    paths:
      - 'research/gdp-economic-resilience/**'
      - 'data_sources/world-bank-wdi-gdp-resilience-2026-11-26.json'
      - 'data_sources/world-bank-cwon-2024-gdp-resilience-2026-11-26.json'
      - 'data_sources/eurostat-services-energy-time.json'
      - 'data_sources/eurostat-services-relative-prices.json'
      - '.github/workflows/gdp-resilience-figures.yml'
  workflow_dispatch:
    inputs:
      stage_publication:
        description: Stage validated assets on a new branch (main only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  figures:
    outputs:
      artifact_id: ${{ steps.publication.outputs.artifact-id }}
      artifact_digest: ${{ steps.publication.outputs.artifact-digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      TZ: UTC
      PYTHONHASHSEED: '0'
    defaults:
      run:
        working-directory: research/gdp-economic-resilience
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: research/gdp-economic-resilience/requirements-figures.txt
      - name: Install pinned plotting dependencies
        run: python -m pip install -r requirements-figures.txt
      - name: Test data and figure helpers
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s figure_tests -v
      - name: Reproduce all analytical inputs from pinned snapshots
        run: |
          python pipeline.py --fetch
          python eurostat_sectors.py --fetch
          python historical_shocks.py
          python technology_substitution.py
          python robustness.py
      - name: Generate publication assets and evidence
        run: |
          python figures.py
          python figures.py --output "$RUNNER_TEMP/figure-repeat"
          diff -r results/publication "$RUNNER_TEMP/figure-repeat"
      - name: Validate assets and provenance
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path
          from xml.etree import ElementTree
          from PIL import Image

          results = Path("results")
          output = results / "publication"
          manifest = json.loads((output / "figure_manifest.json").read_text())
          expected = {
              "fig01_nominal_ppp", "fig02_sector_composition", "fig03_volume_deflator",
              "fig04_gdp_wealth", "fig05_shock_benchmarks", "fig06_substitution",
              "fig07_structure_robustness", "fig08_classification_robustness",
          }
          assert {entry["id"] for entry in manifest["figures"]} == expected
          assert len(manifest["figures"]) == 8
          assert len(list(output.iterdir())) == 25
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          for entry in manifest["figures"]:
              name = entry["id"]
              source = results / entry["input_table"]
              assert sha(source) == entry["input_sha256"]
              assert set(entry["assets"]) == {f"{name}.{ext}" for ext in ("png", "svg", "csv")}
              for file, expected_sha in entry["assets"].items():
                  assert sha(output / file) == expected_sha
              with Image.open(output / f"{name}.png") as image:
                  assert image.format == "PNG"
                  assert image.width >= 1600 and image.height >= 1000
                  image.verify()
              assert ElementTree.parse(output / f"{name}.svg").getroot().tag.endswith("}svg")
              with (output / f"{name}.csv").open() as stream:
                  evidence = list(csv.DictReader(stream))
              with source.open() as stream:
                  original = {tuple(row.items()) for row in csv.DictReader(stream)}
              assert len(evidence) == entry["selected_rows"] > 0
              assert all(tuple(row.items()) in original for row in evidence)
          PY
      - name: Upload figures with evidence
        id: publication
        uses: actions/upload-artifact@v4
        with:
          name: gdp-resilience-publication-figures
          path: research/gdp-economic-resilience/results/publication/
          if-no-files-found: error
      - name: Upload complete analytical tables for manuscript audit
        uses: actions/upload-artifact@v4
        with:
          name: gdp-resilience-manuscript-evidence
          path: |
            research/gdp-economic-resilience/results/**/*.csv
            research/gdp-economic-resilience/results/**/summary.json
            !research/gdp-economic-resilience/results/publication/**
          if-no-files-found: error

  stage-publication:
    # Never publish from PR code or a non-main dispatch.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.stage_publication))
    needs: figures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Select a new review branch
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "stage=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "push" ]; then
            if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              echo "No previous commit; dispatch from main with stage_publication enabled."
              exit 0
            fi
            if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- \
              research/gdp-economic-resilience/figures.py \
              research/gdp-economic-resilience/requirements-figures.txt \
              .github/workflows/gdp-resilience-figures.yml; then
              echo "No figure renderer or staging workflow change; no new publication branch."
              exit 0
            fi
          fi
          branch="publication/gdp-resilience-figures-${GITHUB_SHA:0:12}"
          existing="$(git ls-remote --heads origin "refs/heads/$branch")"
          if [ -n "$existing" ]; then
            echo "Review branch already exists: $branch"
            exit 0
          fi
          echo "stage=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Retrieve validated figures from this exact successful run
        if: steps.gate.outputs.stage == 'true'
        uses: actions/download-artifact@v4
        with:
          name: gdp-resilience-publication-figures
          path: ${{ runner.temp }}/gdp-publication-artifact

      - name: Verify the publication package and preserve provenance
        if: steps.gate.outputs.stage == 'true'
        env:
          ARTIFACT_ID: ${{ needs.figures.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.figures.outputs.artifact_digest }}
          ARTIFACT_DIR: ${{ runner.temp }}/gdp-publication-artifact
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          source = Path(os.environ["ARTIFACT_DIR"])
          destination = Path("research/gdp-economic-resilience/publication")
          manifest_path = source / "figure_manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          ids = {
              "fig01_nominal_ppp", "fig02_sector_composition", "fig03_volume_deflator",
              "fig04_gdp_wealth", "fig05_shock_benchmarks", "fig06_substitution",
              "fig07_structure_robustness", "fig08_classification_robustness",
          }
          entries = manifest["figures"]
          assert len(entries) == 8 and {item["id"] for item in entries} == ids
          expected = {"figure_manifest.json"}
          for entry in entries:
              name = entry["id"]
              assets = {f"{name}.{ext}" for ext in ("png", "svg", "csv")}
              assert set(entry["assets"]) == assets
              expected.update(assets)
              for filename, digest in entry["assets"].items():
                  path = source / filename
                  assert path.is_file() and not path.is_symlink() and sha(path) == digest
          assert {path.name for path in source.iterdir()} == expected
          assert len(expected) == 25
          artifact_id = os.environ["ARTIFACT_ID"]
          artifact_digest = os.environ["ARTIFACT_DIGEST"]
          assert artifact_id.isdigit()
          assert re.fullmatch(r"(sha256:)?[0-9a-f]{64}", artifact_digest)
          destination.mkdir(parents=True, exist_ok=True)
          # Never remove an existing unrecognised tracked publication file.
          allowed = expected | {"publication_provenance.json"}
          assert {path.name for path in destination.iterdir()} <= allowed
          assert all(path.is_file() and not path.is_symlink() for path in destination.iterdir())
          for filename in sorted(expected):
              shutil.copyfile(source / filename, destination / filename)
          provenance = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "artifact_id": int(artifact_id),
              "artifact_digest": artifact_digest,
              "figure_manifest_sha256": sha(manifest_path),
              "registry_commits": manifest["registry_commits"],
              "review_status": "candidate_for_pull_request_review",
          }
          (destination / "publication_provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"Verified and staged {len(expected)} assets and provenance record")
          PY

      - name: Commit only publication files to the review branch
        if: steps.gate.outputs.stage == 'true'
        env:
          BRANCH: ${{ steps.gate.outputs.branch }}
        run: |
          set -euo pipefail
          git switch -c "$BRANCH"
          git add -- research/gdp-economic-resilience/publication/
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(["git", "diff", "--cached", "--name-only", "-z"]).decode().split("\0")
          paths = [path for path in paths if path]
          assert paths and all(path.startswith("research/gdp-economic-resilience/publication/") for path in paths)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve GDP resilience publication figures from ${GITHUB_SHA:0:12}"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Open a review pull request from $BRANCH; main was not modified." >> "$GITHUB_STEP_SUMMARY"

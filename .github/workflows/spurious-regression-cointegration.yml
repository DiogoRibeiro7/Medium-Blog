name: Spurious regression and cointegration article evidence

on:
  pull_request:
    paths:
      - "spurious-regression-cointegration/**"
      - ".github/workflows/spurious-regression-cointegration.yml"
  push:
    branches: [main]
    paths:
      - "spurious-regression-cointegration/**"
      - ".github/workflows/spurious-regression-cointegration.yml"

jobs:
  verify-article:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: spurious-regression-cointegration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spurious-regression-cointegration/requirements.txt
      - name: Install scientific and notebook dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify analytical invariants and execute notebook
        run: python -m unittest discover -s tests -v
      - name: Independently regenerate quick evidence
        run: python analysis.py --quick

name: Refresh wealth-origin-sectors data

on:
  push:
    branches:
      - wealth-origin-sectors
    paths:
      - 'wealth-origin-sectors/fetch.py'
      - '.github/workflows/wealth-origin-sectors-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: wealth-origin-sectors
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: wealth-origin-sectors/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Download Forbes 2011-2026 by industry (aggregated), Penn World Table 11.0 and WDI
        id: fetch
        continue-on-error: true
        run: python fetch.py --out data

      - name: Commit the snapshot and its log if they changed
        if: always()
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add data
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "Refresh data snapshot for wealth-origin-sectors ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Fail if a required request failed
        if: steps.fetch.outcome == 'failure'
        run: |
          cat data/fetch_log.txt
          exit 1

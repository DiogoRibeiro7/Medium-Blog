name: Reproduce portugal-2010-contagion

on:
  pull_request:
    paths:
      - 'portugal-2010-contagion/**'
      - '.github/workflows/portugal-2010-contagion.yml'
  push:
    branches:
      - main
    paths:
      - 'portugal-2010-contagion/**'
      - '.github/workflows/portugal-2010-contagion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: portugal-2010-contagion
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: portugal-2010-contagion/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q tests

      - name: Warranted spreads
        run: python warranted.py > /dev/null

      - name: Contagion from Greece and Ireland
        run: python contagion.py > /dev/null

      - name: Event months
        run: python events.py > /dev/null

      - name: Programme terms and the 2011 hikes
        run: python programme.py > /dev/null

      - name: Figures
        run: python figures.py

      - name: Summaries unchanged within tolerance
        run: |
          S="results/warranted_summary.txt results/contagion_summary.txt results/events_summary.txt results/programme_summary.txt"
          git diff --stat -- $S || true
          python check_results.py $S

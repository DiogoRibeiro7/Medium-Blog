name: Reproduce Monty Hall series

on:
  pull_request:
    paths:
      - 'monty-hall/**'
      - '.github/workflows/monty-hall.yml'
  push:
    branches:
      - main
    paths:
      - 'monty-hall/**'
      - '.github/workflows/monty-hall.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      # One BLAS thread, so floating-point reductions run in a fixed order.
      OPENBLAS_NUM_THREADS: '1'
    defaults:
      run:
        working-directory: monty-hall
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: monty-hall/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rerun each part and compare with the committed output
        run: |
          status=0
          for part in part*/; do
            main=$(ls "$part"*.py | grep -v figures.py)
            echo "== $main"
            (cd "$part" && python "$(basename "$main")" > "$RUNNER_TEMP/output.txt")
            if ! diff -u "$part/output.txt" "$RUNNER_TEMP/output.txt" > "$RUNNER_TEMP/diff.txt"; then
              cat "$RUNNER_TEMP/diff.txt"
              # Put the diff in the annotation too, so it can be read without the raw log.
              detail=$(head -c 30000 "$RUNNER_TEMP/diff.txt" | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
              echo "::error file=${part}output.txt::output of $main differs from the committed output.txt%0A$detail"
              status=1
            fi
          done
          exit $status

      - name: Check that the figures script runs
        run: |
          for part in part*/; do
            (cd "$part" && python figures.py)
          done

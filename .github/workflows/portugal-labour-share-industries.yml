name: Reproduce portugal-labour-share-industries

on:
  pull_request:
    paths:
      - 'portugal-labour-share-industries/**'
      - 'portugal-labour-share/data/**'
      - '.github/workflows/portugal-labour-share-industries.yml'
  push:
    branches:
      - main
    paths:
      - 'portugal-labour-share-industries/**'
      - 'portugal-labour-share/data/**'
      - '.github/workflows/portugal-labour-share-industries.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portugal-labour-share-industries
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: portugal-labour-share-industries/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest -q tests

      - name: Rerun the analysis on the committed snapshot
        run: python industries.py > /dev/null

      - name: Check the numbers match the committed run
        run: git diff --exit-code -- results/summary.txt

      - name: Draw the figures
        run: |
          python figures.py
          for f in fig1_imputation_level fig2_within_between_by_detail fig3_sections_2016_2024 fig4_pay_and_share; do
            test -s "figures/$f.png"
          done

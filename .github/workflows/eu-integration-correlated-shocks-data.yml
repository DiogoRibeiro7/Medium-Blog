name: Refresh eu-integration-correlated-shocks data

on:
  push:
    branches:
      - eu-integration-correlated-shocks
    paths:
      - 'eu-integration-correlated-shocks/fetch.py'
      - '.github/workflows/eu-integration-correlated-shocks-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: eu-integration-correlated-shocks
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: eu-integration-correlated-shocks/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Download the Eurostat series
        id: fetch
        continue-on-error: true
        run: python fetch.py --out data

      - name: Commit the snapshot and its log if they changed
        if: always()
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add data
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "Refresh Eurostat snapshot for eu-integration-correlated-shocks ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Fail if any request failed
        if: steps.fetch.outcome == 'failure'
        run: |
          cat data/fetch_log.txt
          exit 1

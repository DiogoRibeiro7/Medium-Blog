name: Test iberian-electricity-lp

on:
  pull_request:
    paths:
      - 'iberian-electricity-lp/**'
      - '.github/workflows/iberian-electricity-lp.yml'
  push:
    branches:
      - main
    paths:
      - 'iberian-electricity-lp/**'
      - '.github/workflows/iberian-electricity-lp.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iberian-electricity-lp
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: iberian-electricity-lp/pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint and type-check
        run: |
          ruff check src tests
          mypy src

      # The OMIE files are not in the repository; the tests run offline from the
      # committed derived tables (data/derived) and check their provenance and invariants.
      - name: Run tests
        run: python -m pytest -q

name: Reproduce coupon-campaign-questions

on:
  pull_request:
    paths:
      - 'coupon-campaign-questions/**'
      - '.github/workflows/coupon-campaign-questions.yml'
  push:
    branches:
      - main
    paths:
      - 'coupon-campaign-questions/**'
      - '.github/workflows/coupon-campaign-questions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      # One BLAS thread, so floating-point reductions run in a fixed order.
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: coupon-campaign-questions
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: coupon-campaign-questions/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Test the estimators on synthetic panels
        run: python -m unittest discover -s tests -v

      - name: Download the pinned Complete Journey tables
        run: python fetch_data.py

      - name: Rerun the analysis and compare with the committed output
        run: |
          python coupon_numbers.py > "$RUNNER_TEMP/output.txt"
          if ! diff -u output.txt "$RUNNER_TEMP/output.txt" > "$RUNNER_TEMP/diff.txt"; then
            cat "$RUNNER_TEMP/diff.txt"
            echo "::error file=coupon-campaign-questions/output.txt::output of coupon_numbers.py differs from the committed output.txt"
            exit 1
          fi

      - name: Check every figure is drawn
        run: |
          python figures.py
          for f in fig1_redeemers_before fig2_where_the_jump_is fig3_designs_and_placebos fig4_winners_by_design fig5_break_even; do
            test -s "figures/$f.png"
          done

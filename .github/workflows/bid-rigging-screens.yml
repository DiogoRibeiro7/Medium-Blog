name: Reproduce bid-rigging-screens

on:
  pull_request:
    paths:
      - 'bid-rigging-screens/**'
      - '.github/workflows/bid-rigging-screens.yml'
  push:
    branches:
      - main
    paths:
      - 'bid-rigging-screens/**'
      - '.github/workflows/bid-rigging-screens.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: bid-rigging-screens
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: bid-rigging-screens/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Download the pinned source files and check their SHA-256
        run: python fetch.py

      - name: Run the tests
        run: python -m pytest -q tests

      - name: Rerun the analysis (about 15 minutes on two cores)
        run: python screens.py > /dev/null

      - name: Check the numbers match the committed run
        run: git diff --exit-code -- results/summary.txt

      - name: Draw the figures
        run: |
          python figures.py
          for f in fig1_median_cv_by_period fig2_unseen_firms fig3_transfer_between_countries fig4_investigation_lists fig5_tender_counts; do
            test -s "figures/$f.png"
          done

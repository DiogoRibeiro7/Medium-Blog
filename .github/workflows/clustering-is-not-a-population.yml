name: Article 28 - Clusters and Populations

on:
  pull_request:
    paths:
      - 'clustering-is-not-a-population/**'
      - '.github/workflows/clustering-is-not-a-population.yml'
  push:
    branches: [main]
    paths:
      - 'clustering-is-not-a-population/**'
      - '.github/workflows/clustering-is-not-a-population.yml'

jobs:
  reproducible-study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clustering-is-not-a-population
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: clustering-is-not-a-population/requirements.txt
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Test numeric methods, evidence, and fresh notebook kernel
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MPLBACKEND: Agg
          RUN_NOTEBOOK_EXECUTION: '1'
        run: python -m unittest discover -s tests -v
      - name: Isolated quick regeneration
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MPLBACKEND: Agg
        run: python analysis.py --quick

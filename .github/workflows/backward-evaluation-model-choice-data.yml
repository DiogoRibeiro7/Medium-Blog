name: Refresh backward-evaluation-model-choice data

on:
  push:
    branches:
      - backward-evaluation-model-choice
    paths:
      - 'backward-evaluation-model-choice/fetch.py'
      - '.github/workflows/backward-evaluation-model-choice-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backward-evaluation-model-choice
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backward-evaluation-model-choice/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Download the pre-registered test series
        id: fetch
        continue-on-error: true
        run: python fetch.py --out data

      - name: Commit the snapshot and its log if they changed
        if: always()
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add data
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "Download test data for backward-evaluation-model-choice ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Fail if the download failed
        if: steps.fetch.outcome == 'failure'
        run: |
          cat data/fetch_log.txt || true
          exit 1

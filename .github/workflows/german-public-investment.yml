name: Reproduce german-public-investment

on:
  pull_request:
    paths:
      - 'german-public-investment/**'
      - '.github/workflows/german-public-investment.yml'
  push:
    branches:
      - main
    paths:
      - 'german-public-investment/**'
      - '.github/workflows/german-public-investment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: german-public-investment
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: german-public-investment/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q tests

      - name: Investment and capital stock
        run: python investment.py > /dev/null

      - name: Fiscal room
        run: python space.py > /dev/null

      - name: Reform, quarterly
        run: python reform.py > /dev/null

      - name: Figures
        run: python figures.py

      - name: Summaries unchanged within tolerance
        run: |
          S="results/investment_summary.txt results/space_summary.txt results/reform_summary.txt"
          git diff --stat -- $S || true
          python check_results.py $S

name: Reproduce eu-capital-exports

on:
  pull_request:
    paths:
      - 'eu-capital-exports/**'
      - '.github/workflows/eu-capital-exports.yml'
  push:
    branches:
      - main
    paths:
      - 'eu-capital-exports/**'
      - '.github/workflows/eu-capital-exports.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: eu-capital-exports
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: eu-capital-exports/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest -q tests

      - name: Rerun the analysis
        run: python analysis.py > /dev/null

      - name: Check the numbers match the committed run
        run: git diff --exit-code -- results/analysis_summary.txt

      - name: Draw the figures
        run: |
          python figures.py
          for f in fig1_saving_investment_and_sectors fig2_ten_measures_of_savings_abroad \
                   fig3_positions_and_household_portfolios; do
            test -s "figures/$f.png"
          done

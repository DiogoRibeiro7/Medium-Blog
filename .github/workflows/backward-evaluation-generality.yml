name: Compute backward-evaluation-generality

on:
  push:
    branches:
      - backward-evaluation-generality
    paths:
      - 'backward-evaluation-generality/common.py'
      - 'backward-evaluation-generality/models.py'
      - 'backward-evaluation-generality/run.py'
      - 'backward-evaluation-generality/aggregate.py'
      - '.github/workflows/backward-evaluation-generality.yml'
  pull_request:
    paths:
      - 'backward-evaluation-generality/**'
      - 'backward-evaluation/backward_eval.py'
      - 'backward-evaluation-episode-end/episode.py'
      - '.github/workflows/backward-evaluation-generality.yml'

concurrency:
  group: generality-compute-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - {domain: elec, shard: 0, of: 1}
          - {domain: web, shard: 0, of: 16}
          - {domain: web, shard: 1, of: 16}
          - {domain: web, shard: 2, of: 16}
          - {domain: web, shard: 3, of: 16}
          - {domain: web, shard: 4, of: 16}
          - {domain: web, shard: 5, of: 16}
          - {domain: web, shard: 6, of: 16}
          - {domain: web, shard: 7, of: 16}
          - {domain: web, shard: 8, of: 16}
          - {domain: web, shard: 9, of: 16}
          - {domain: web, shard: 10, of: 16}
          - {domain: web, shard: 11, of: 16}
          - {domain: web, shard: 12, of: 16}
          - {domain: web, shard: 13, of: 16}
          - {domain: web, shard: 14, of: 16}
          - {domain: web, shard: 15, of: 16}
    defaults:
      run:
        working-directory: backward-evaluation-generality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backward-evaluation-generality/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Tests
        if: matrix.domain == 'elec'
        run: python -m pytest -q tests
      - name: Run the shard
        run: python run.py --domain ${{ matrix.domain }} --shard ${{ matrix.shard }} --of ${{ matrix.of }} --workers 4
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.domain }}-${{ matrix.shard }}
          path: backward-evaluation-generality/results/shards/
          retention-days: 7

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backward-evaluation-generality
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backward-evaluation-generality/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: backward-evaluation-generality/results/shards
          merge-multiple: true
      - name: Aggregate
        run: python aggregate.py
      - name: Figures
        run: if [ -f figures.py ]; then python figures.py; fi
      - name: Compare with the committed summary (pull requests)
        if: github.event_name == 'pull_request'
        run: python ../backward-evaluation-pooling/check_results.py results/summary.txt
      - name: Commit the results (pushes to the branch)
        if: github.event_name == 'push'
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add results figures 2>/dev/null || git add results
          if git diff --cached --quiet; then
            echo "Results unchanged."
          else
            git commit -m "backward-evaluation-generality: results from the compute workflow ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi

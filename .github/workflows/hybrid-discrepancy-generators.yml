name: Test hybrid-discrepancy-generators

on:
  pull_request:
    paths:
      - 'hybrid-discrepancy-generators/**'
      - 'mechanistic-vs-data-driven-generators/src/**'
      - '.github/workflows/hybrid-discrepancy-generators.yml'
  push:
    branches:
      - main
    paths:
      - 'hybrid-discrepancy-generators/**'
      - 'mechanistic-vs-data-driven-generators/src/**'
      - '.github/workflows/hybrid-discrepancy-generators.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hybrid-discrepancy-generators
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: hybrid-discrepancy-generators/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest -q tests

      - name: Smoke-run every experiment (quick mode)
        working-directory: hybrid-discrepancy-generators/experiments
        run: |
          python run_all.py --quick
          python make_figures.py
          for f in fig1_fit fig2_surge fig3_confounding fig4_redials fig5_intervention; do
            test -s "../figures/$f.png"
          done

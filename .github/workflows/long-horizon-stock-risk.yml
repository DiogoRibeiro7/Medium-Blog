name: Reproduce long-horizon-stock-risk

on:
  pull_request:
    paths:
      - 'long-horizon-stock-risk/**'
      - 'data_sources/oecd-share-prices-bond-yields-cpi.json'
      - 'data_sources/shiller-sp-composite-monthly.json'
      - '.github/workflows/long-horizon-stock-risk.yml'
  push:
    branches:
      - main
    paths:
      - 'long-horizon-stock-risk/**'
      - 'data_sources/oecd-share-prices-bond-yields-cpi.json'
      - 'data_sources/shiller-sp-composite-monthly.json'
      - '.github/workflows/long-horizon-stock-risk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: long-horizon-stock-risk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: long-horizon-stock-risk/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test the readers, the return rules and the window statistics
        run: python -m unittest discover -s tests -v

      - name: Fetch every input and check it against the registry contracts
        run: python fetch.py

      - name: Rerun the analysis and compare with the committed output
        run: |
          python horizon_numbers.py > "$RUNNER_TEMP/output.txt"
          if ! diff -u output.txt "$RUNNER_TEMP/output.txt" > "$RUNNER_TEMP/diff.txt"; then
            cat "$RUNNER_TEMP/diff.txt"
            echo "::error file=long-horizon-stock-risk/output.txt::output of horizon_numbers.py differs from the committed output.txt"
            exit 1
          fi

      - name: Check every figure is drawn
        run: |
          python figures.py
          for f in fig1_how_often_how_much fig2_rate_and_wealth fig3_shuffle_test fig4_markets_20y fig5_where_losses_were; do
            test -s "figures/$f.png"
          done

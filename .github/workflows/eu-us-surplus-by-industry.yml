name: Reproduce eu-us-surplus-by-industry

on:
  pull_request:
    paths:
      - 'eu-us-surplus-by-industry/**'
      - '.github/workflows/eu-us-surplus-by-industry.yml'
  push:
    branches:
      - main
    paths:
      - 'eu-us-surplus-by-industry/**'
      - '.github/workflows/eu-us-surplus-by-industry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: eu-us-surplus-by-industry
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: eu-us-surplus-by-industry/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest -q tests

      - name: Rerun the analysis
        run: python analysis.py > /dev/null

      - name: Check the numbers match the committed run
        run: git diff --exit-code -- results/analysis_summary.txt

      - name: Draw the figures
        run: |
          python figures.py
          for f in fig1_gap_by_industry_2021 fig2_profit_share_by_industry_2021 \
                   fig3_countries_by_industry_2021 fig4_inside_the_industries_2021; do
            test -s "figures/$f.png"
          done

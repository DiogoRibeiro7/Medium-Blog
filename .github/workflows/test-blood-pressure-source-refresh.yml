name: Test blood-pressure analysis

on:
  pull_request:
    paths:
      - 'Blood_Pressure_Missingness/refresh_from_google_sheets.py'
      - 'Blood_Pressure_Missingness/observation_process_sensitivity.py'
      - 'Blood_Pressure_Missingness/tests/**'
      - 'Blood_Pressure_Missingness/requirements.txt'
      - '.github/workflows/refresh-blood-pressure-analysis.yml'
      - '.github/workflows/test-blood-pressure-source-refresh.yml'
  push:
    branches:
      - main
    paths:
      - 'Blood_Pressure_Missingness/refresh_from_google_sheets.py'
      - 'Blood_Pressure_Missingness/observation_process_sensitivity.py'
      - 'Blood_Pressure_Missingness/tests/**'
      - 'Blood_Pressure_Missingness/requirements.txt'
      - '.github/workflows/refresh-blood-pressure-analysis.yml'
      - '.github/workflows/test-blood-pressure-source-refresh.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install analysis dependencies
        run: python -m pip install -r Blood_Pressure_Missingness/requirements.txt

      - name: Run blood-pressure regression tests
        run: >-
          python -m unittest discover
          -s Blood_Pressure_Missingness/tests
          -p 'test_*.py'
          -v

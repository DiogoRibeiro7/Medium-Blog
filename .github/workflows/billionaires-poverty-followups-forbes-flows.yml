name: Billionaire-poverty follow-ups — linked Forbes lists

on:
  push:
    branches: [billionaires-poverty-threshold-churn]
    paths:
      - ".github/workflows/billionaires-poverty-followups-forbes-flows.yml"
      - "billionaires-poverty-followups/fetch_forbes_flows.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-forbes-flows:
    name: Entries, exits and net-worth bands, 2010-2026
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r billionaires-poverty-followups/requirements.txt
      - name: Fetch and link the lists (no person-level records kept)
        working-directory: billionaires-poverty-followups
        run: |
          python fetch_forbes_flows.py --first 2010 --last 2026 --output-dir data | tee forbes_flows_log.txt
          echo "::notice title=Forbes years::$(python -c "import json;m=json.load(open('data/forbes_flows_manifest.json'));print({y:(e.get('n_persons'),e.get('missing_age'),e.get('below_1000'),(e.get('error') or '')[:60]) for y,e in sorted(m['years'].items())})")"
          echo "::notice title=Forbes pairs::$(python -c "import json;m=json.load(open('data/forbes_flows_manifest.json'));print({p:(e['links_by_rule'],e['flows']) for p,e in sorted(m['pairs'].items())})" | cut -c1-3500)"
      - name: Commit the aggregates to the branch
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add billionaires-poverty-followups/data/forbes_bands.csv.gz \
                  billionaires-poverty-followups/data/forbes_flows.csv.gz \
                  billionaires-poverty-followups/data/forbes_global.csv.gz \
                  billionaires-poverty-followups/data/forbes_flows_manifest.json
          git commit -m "Billionaire-poverty follow-ups: linked Forbes lists, aggregates only" || echo "no changes"
          git push origin HEAD:${GITHUB_REF_NAME}

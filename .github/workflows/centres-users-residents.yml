name: Reproduce centres-users-residents

on:
  pull_request:
    paths:
      - 'centres-users-residents/**'
      - 'data_sources/eurostat-urban-audit-cities-fuas.json'
      - 'data_sources/ine-portugal-centre-users-homes.json'
      - 'data_sources/ine-portugal-municipal-infrastructure.json'
      - '.github/workflows/centres-users-residents.yml'
  push:
    branches:
      - main
    paths:
      - 'centres-users-residents/**'
      - 'data_sources/eurostat-urban-audit-cities-fuas.json'
      - 'data_sources/ine-portugal-centre-users-homes.json'
      - 'data_sources/ine-portugal-municipal-infrastructure.json'
      - '.github/workflows/centres-users-residents.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      # One BLAS thread, so floating-point reductions run in a fixed order.
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: centres-users-residents
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: centres-users-residents/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test the core functions
        run: python -m unittest discover -s tests -v

      # A verified copy from an earlier run skips the download; fetch.py still checks every hash.
      - name: Restore responses downloaded by an earlier run
        uses: actions/cache@v4
        with:
          path: centres-users-residents/data/raw
          key: centres-users-residents-raw-${{ hashFiles('centres-users-residents/sources.py', 'data_sources/eurostat-urban-audit-cities-fuas.json', 'data_sources/ine-portugal-centre-users-homes.json', 'data_sources/ine-portugal-municipal-infrastructure.json') }}

      # INE's API sometimes stops answering runners for several minutes. fetch.py keeps the files it
      # has already verified, so each new attempt only asks for the ones still missing.
      - name: Download the Eurostat and INE responses and check their hashes
        run: |
          for attempt in 1 2 3; do
            python -u fetch.py && exit 0
            echo "::warning::fetch.py attempt $attempt failed; trying again for the responses still missing"
            sleep 60
          done
          exit 1

      - name: Build the European and metro panels
        run: python panel.py

      - name: Rerun the analysis and compare with the committed output
        run: |
          python run_analysis.py > "$RUNNER_TEMP/output.txt"
          if ! diff -u output.txt "$RUNNER_TEMP/output.txt" > "$RUNNER_TEMP/diff.txt"; then
            cat "$RUNNER_TEMP/diff.txt"
            echo "::error file=centres-users-residents/output.txt::output of run_analysis.py differs from the committed output.txt"
            exit 1
          fi

      - name: Check every figure is drawn
        run: |
          python figures.py
          for f in fig1_core_shares fig2_homes_and_residents fig3_country_benchmark; do
            test -s "figures/$f.png"
          done

name: Reproduce portugal-iva-zero

on:
  pull_request:
    paths:
      - 'portugal-iva-zero/**'
      - '.github/workflows/portugal-iva-zero.yml'
  push:
    branches:
      - main
    paths:
      - 'portugal-iva-zero/**'
      - '.github/workflows/portugal-iva-zero.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portugal-iva-zero
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: portugal-iva-zero/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest -q tests

      - name: Rerun the analysis
        run: |
          cp results/summary.txt "$RUNNER_TEMP/summary_committed.txt"
          python ivazero.py > /dev/null

      - name: Check the numbers match the committed run
        run: python check_summary.py "$RUNNER_TEMP/summary_committed.txt" results/summary.txt

      - name: Draw the figures
        run: |
          python figures.py
          test "$(ls figures/fig*.png | wc -l)" -eq 12

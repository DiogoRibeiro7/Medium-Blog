name: Reproduce heat-pump-price-ratio

on:
  pull_request:
    paths:
      - 'heat-pump-price-ratio/**'
      - '.github/workflows/heat-pump-price-ratio.yml'
  push:
    branches:
      - main
    paths:
      - 'heat-pump-price-ratio/**'
      - '.github/workflows/heat-pump-price-ratio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: heat-pump-price-ratio
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: heat-pump-price-ratio/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test the methods on cases with a known answer
        run: python -m unittest discover -s tests -v

      - name: Download from Eurostat and compare with the snapshot
        run: python fetch_data.py

      - name: Rerun the analysis and compare with the committed output
        run: |
          python heat_numbers.py > "$RUNNER_TEMP/output.txt"
          if ! diff -u output.txt "$RUNNER_TEMP/output.txt" > "$RUNNER_TEMP/diff.txt"; then
            cat "$RUNNER_TEMP/diff.txt"
            echo "::error file=heat-pump-price-ratio/output.txt::output of heat_numbers.py differs from the committed output.txt"
            exit 1
          fi

      - name: Check every figure is drawn
        run: |
          python figures.py
          for f in fig1_ratio fig2_heatmap fig3_share fig4_taxes fig5_savings; do
            test -s "figures/$f.png"
          done

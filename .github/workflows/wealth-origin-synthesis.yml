name: Reproduce wealth-origin-synthesis

# The synthesis reads the committed results of the five companion projects, so it reruns
# whenever any of those results change as well as when its own code does.
on:
  pull_request:
    paths:
      - 'wealth-origin-synthesis/**'
      - 'wealth-concentration-misallocation/results/**'
      - 'wealth-origin-growth/results/**'
      - 'wealth-origin-sectors/results/**'
      - 'wealth-origin-pandemic/results/**'
      - 'wealth-origin-successions/results/**'
      - '.github/workflows/wealth-origin-synthesis.yml'
  push:
    branches:
      - main
    paths:
      - 'wealth-origin-synthesis/**'
      - 'wealth-concentration-misallocation/results/**'
      - 'wealth-origin-growth/results/**'
      - 'wealth-origin-sectors/results/**'
      - 'wealth-origin-pandemic/results/**'
      - 'wealth-origin-successions/results/**'
      - '.github/workflows/wealth-origin-synthesis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wealth-origin-synthesis
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: wealth-origin-synthesis/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest -q tests

      - name: Rerun the synthesis
        run: python synthesis.py > /dev/null

      - name: Check the numbers match the committed run
        run: git diff --exit-code -- results/summary.txt results/ledger.csv

      - name: Draw the figures
        run: |
          python figures.py
          for f in fig1_estimates fig2_ledger; do
            test -s "figures/$f.png"
          done

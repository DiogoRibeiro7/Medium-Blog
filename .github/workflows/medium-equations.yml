name: Render medium-equations

on:
  pull_request:
    paths:
      - 'medium-equations/**'
      - '.github/workflows/medium-equations.yml'
  push:
    branches:
      - main
    paths:
      - 'medium-equations/**'
      - '.github/workflows/medium-equations.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medium-equations
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LaTeX and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended poppler-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Pillow
        run: python -m pip install 'pillow>=10,<13'

      - name: Render every equation
        run: python render_equations.py

      - name: Check every manifest entry has an image
        run: |
          python - <<'EOF'
          import json, pathlib, sys
          manifest = json.loads(pathlib.Path("manifest.json").read_text(encoding="utf-8"))
          missing = [f"{slug}/{eq['name']}.png" for slug, eqs in manifest.items() for eq in eqs
                     if not pathlib.Path(slug, f"{eq['name']}.png").is_file()]
          print(f"{sum(len(v) for v in manifest.values())} equations, {len(missing)} missing")
          sys.exit(1 if missing else 0)
          EOF

name: Billionaire-poverty follow-ups — WDI series

on:
  push:
    branches: [billionaires-poverty-within-country]
    paths:
      - ".github/workflows/billionaires-poverty-followups-wdi.yml"
      - "billionaires-poverty-followups/fetch_wdi.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-wdi:
    name: GDP, GNI, household consumption, population, price levels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r billionaires-poverty-followups/requirements.txt
      - name: Fetch WDI series
        working-directory: billionaires-poverty-followups
        run: |
          python fetch_wdi.py --output-dir data
          echo "::notice title=WDI::$(python -c "import json;m=json.load(open('data/wdi_manifest.json'));print(m['n_rows'],m['by_indicator'])")"
      - name: Commit the series to the branch
        if: github.event_name == 'push'
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add billionaires-poverty-followups/data/wdi_series.csv.gz billionaires-poverty-followups/data/wdi_manifest.json
          git commit -m "Billionaire-poverty follow-ups: WDI snapshot" || echo "no changes"
          git push origin HEAD:${GITHUB_REF_NAME}

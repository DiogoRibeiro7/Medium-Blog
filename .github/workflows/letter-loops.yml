name: Reproduce letter-loops

on:
  pull_request:
    paths:
      - 'letter-loops/**'
      - '.github/workflows/letter-loops.yml'
  push:
    branches:
      - main
    paths:
      - 'letter-loops/**'
      - '.github/workflows/letter-loops.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: letter-loops
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: letter-loops/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Check the wordfreq lists and download the CLDR alphabets at pinned versions
        run: python fetch_data.py

      - name: Test the methods on cases with a known answer
        run: python -m unittest discover -s tests -v

      - name: Rerun the analysis and compare with the committed output
        run: |
          python letters_numbers.py > "$RUNNER_TEMP/output.txt"
          if ! diff -u output.txt "$RUNNER_TEMP/output.txt" > "$RUNNER_TEMP/diff.txt"; then
            cat "$RUNNER_TEMP/diff.txt"
            echo "::error file=letter-loops/output.txt::output of letters_numbers.py differs from the committed output.txt"
            exit 1
          fi

      - name: Install fonts with Hebrew and Arabic letters
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core

      - name: Check every figure is drawn
        run: |
          python figures.py
          for f in fig1_english_maps fig2_atlas_inside_words fig3_atlas_word_boundary fig4_baselines fig5_temperature; do
            test -s "figures/$f.png"
          done

name: Reproduce model-collapse-genesis

on:
  pull_request:
    paths:
      - 'model-collapse-genesis/**'
      - '.github/workflows/model-collapse-genesis.yml'
  push:
    branches:
      - main
    paths:
      - 'model-collapse-genesis/**'
      - '.github/workflows/model-collapse-genesis.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: model-collapse-genesis
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: model-collapse-genesis/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Rerun the checks, the experiment and the figures
        run: python run_all.py

      - name: Check the numbers match the committed run
        run: git diff --exit-code -- results/summary.txt results/samples.txt

      - name: Check every figure was drawn
        run: |
          for f in fig1_vocabulary_by_language fig2_metrics_replace fig3_policies_missing_mass fig4_languages_tau08 fig5_bias_by_policy; do
            test -s "figures/$f.png"
          done

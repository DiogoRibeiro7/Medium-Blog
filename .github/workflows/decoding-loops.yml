name: Reproduce decoding-loops

# Every push and pull request: lint, tests and a smoke run with a tiny random model (minutes).
# The full run downloads eight open models from the Hugging Face Hub and decodes 144 prompts under
# six rules with each (hours); it runs on manual dispatch, or on a push whose commit message
# contains [full-run]. Its outputs (generations, output.txt, figures) are uploaded as artifacts.

on:
  pull_request:
    paths:
      - 'decoding-loops/**'
      - '.github/workflows/decoding-loops.yml'
  push:
    paths:
      - 'decoding-loops/**'
      - '.github/workflows/decoding-loops.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: decoding-loops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: decoding-loops/requirements.txt
      - name: Install CPU PyTorch and the pinned dependencies
        run: |
          python -m pip install "torch==2.15.0" --index-url "$TORCH_INDEX"
          python -m pip install -r requirements.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Download the Gutenberg books at the pinned commit and check the digest
        run: python fetch_data.py
      - name: Test the methods on cases with a known answer
        run: python -m unittest discover -s tests -v
      - name: Smoke run (tiny random model, no download)
        run: python generate_runs.py --smoke && python loops_numbers.py --smoke

  models:
    needs: test
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        model: [pythia-70m, pythia-160m, pythia-410m, pythia-1b, pythia-1.4b, smollm2-135m, smollm2-360m, smollm2-1.7b]
    defaults:
      run:
        working-directory: decoding-loops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: decoding-loops/requirements.txt
      - name: Install CPU PyTorch and the pinned dependencies
        run: |
          python -m pip install "torch==2.15.0" --index-url "$TORCH_INDEX"
          python -m pip install -r requirements.txt
      - name: Download the Gutenberg books
        run: python fetch_data.py
      - name: Decode 144 prompts under six rules and score the human continuations
        timeout-minutes: 330
        run: python generate_runs.py --model ${{ matrix.model }}
      - name: Upload generations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen-${{ matrix.model }}
          path: decoding-loops/results/gen_${{ matrix.model }}.json.gz
          if-no-files-found: warn
          retention-days: 90

  analyse:
    needs: models
    if: always() && needs.models.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: decoding-loops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: decoding-loops/requirements.txt
      - name: Install the pinned dependencies (no PyTorch needed)
        run: python -m pip install -r requirements.txt
      - name: Download the Gutenberg books
        run: python fetch_data.py
      - uses: actions/download-artifact@v4
        with:
          pattern: gen-*
          path: decoding-loops/results
          merge-multiple: true
      - name: Every number and figure from the generations
        run: |
          python loops_numbers.py > output.txt
          python figures.py
      - uses: actions/upload-artifact@v4
        with:
          name: analysis
          path: |
            decoding-loops/output.txt
            decoding-loops/figures/*.png
          retention-days: 90

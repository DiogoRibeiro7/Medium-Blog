name: Compute backward-evaluation-guide

on:
  push:
    branches:
      - backward-evaluation-guide
    paths:
      - 'backward-evaluation-guide/bwdiag.py'
      - 'backward-evaluation-guide/daily.py'
      - 'backward-evaluation-guide/aggregate.py'
      - 'backward-evaluation-guide/sims.py'
      - 'backward-evaluation-guide/macro.py'
      - '.github/workflows/backward-evaluation-guide.yml'
  pull_request:
    paths:
      - 'backward-evaluation-guide/**'
      - 'backward-evaluation-generality/models.py'
      - 'backward-evaluation-model-choice/data/**'
      - '.github/workflows/backward-evaluation-guide.yml'

concurrency:
  group: guide-compute-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - {domain: elec, shard: 0, of: 1}
          - {domain: dev_web, shard: 0, of: 12}
          - {domain: dev_web, shard: 1, of: 12}
          - {domain: dev_web, shard: 2, of: 12}
          - {domain: dev_web, shard: 3, of: 12}
          - {domain: dev_web, shard: 4, of: 12}
          - {domain: dev_web, shard: 5, of: 12}
          - {domain: dev_web, shard: 6, of: 12}
          - {domain: dev_web, shard: 7, of: 12}
          - {domain: dev_web, shard: 8, of: 12}
          - {domain: dev_web, shard: 9, of: 12}
          - {domain: dev_web, shard: 10, of: 12}
          - {domain: dev_web, shard: 11, of: 12}
          - {domain: test_web, shard: 0, of: 10}
          - {domain: test_web, shard: 1, of: 10}
          - {domain: test_web, shard: 2, of: 10}
          - {domain: test_web, shard: 3, of: 10}
          - {domain: test_web, shard: 4, of: 10}
          - {domain: test_web, shard: 5, of: 10}
          - {domain: test_web, shard: 6, of: 10}
          - {domain: test_web, shard: 7, of: 10}
          - {domain: test_web, shard: 8, of: 10}
          - {domain: test_web, shard: 9, of: 10}
    defaults:
      run:
        working-directory: backward-evaluation-guide
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backward-evaluation-guide/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Tests
        if: matrix.domain == 'elec'
        run: python -m pytest -q tests
      - name: Run the shard
        run: python daily.py --domain ${{ matrix.domain }} --shard ${{ matrix.shard }} --of ${{ matrix.of }} --workers 4
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.domain }}-${{ matrix.shard }}
          path: backward-evaluation-guide/results/shards/
          retention-days: 7

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backward-evaluation-guide
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backward-evaluation-guide/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: backward-evaluation-guide/results/shards
          merge-multiple: true
      - name: Aggregate
        run: python aggregate.py
      - name: Simulated checks and the monthly example
        run: |
          python sims.py --reps 100
          python macro.py
      - name: Figures
        run: if [ -f figures.py ]; then python figures.py || echo "figures failed"; fi
      - name: Compare with the committed summary (pull requests)
        if: github.event_name == 'pull_request'
        run: python ../backward-evaluation-pooling/check_results.py results/daily_summary.txt results/sims_summary.txt results/macro_summary.txt
      - name: Commit the results (pushes to the branch)
        if: github.event_name == 'push'
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add results/*.txt results/*.csv results/*.csv.gz
          if [ -d figures ]; then git add figures; fi
          if git diff --cached --quiet; then
            echo "Results unchanged."
          else
            git commit -m "backward-evaluation-guide: results from the compute workflow ($(date -u +%Y-%m-%d))"
            git push || (git pull --rebase --autostash && git push)
          fi

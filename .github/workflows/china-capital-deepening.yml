name: Reproduce china-capital-deepening

on:
  pull_request:
    paths:
      - 'china-capital-deepening/**'
      - '.github/workflows/china-capital-deepening.yml'
  push:
    branches:
      - main
    paths:
      - 'china-capital-deepening/**'
      - '.github/workflows/china-capital-deepening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: china-capital-deepening
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: china-capital-deepening/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Download the CIP workbooks and check their checksums
        run: python fetch.py --out data --only cip --verify

      - name: Run the tests
        run: python -m pytest -q tests

      - name: Rerun the analysis
        run: python analysis.py > /dev/null

      - name: Check the numbers match the committed run
        run: git diff --exit-code -- results/analysis_summary.txt

      - name: Draw the figures
        run: |
          python figures.py
          for f in fig1_output_per_capital_and_where_investment_went fig2_break_even_investment_share \
                   fig3_manufacturing_capital_and_output_per_worker; do
            test -s "figures/$f.png"
          done

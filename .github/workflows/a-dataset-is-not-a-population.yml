name: Population sampling article studies

on:
  pull_request:
    paths:
      - 'a-dataset-is-not-a-population/**'
      - '.github/workflows/a-dataset-is-not-a-population.yml'
  push:
    branches: [main]
    paths:
      - 'a-dataset-is-not-a-population/**'
      - '.github/workflows/a-dataset-is-not-a-population.yml'

permissions:
  contents: read

jobs:
  numerical-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: a-dataset-is-not-a-population
    env:
      RUN_NOTEBOOK_EXECUTION: '1'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/mpl-population-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: a-dataset-is-not-a-population/requirements.txt
      - name: Install pinned numerical and notebook dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate notebook source is deterministic
        run: python notebook_builder.py
      - name: Validate sampling and fresh-kernel notebook
        run: python -m unittest discover -s tests -v
      - name: Generate isolated quick evidence
        run: python analysis.py --quick
      - name: Render quick synthetic figures
        run: python figures.py --data data --output figures --quick

name: portugal-housing-generations

on:
  pull_request:
    paths:
      - 'portugal-housing-generations/**'
      - '.github/workflows/portugal-housing-generations.yml'
  push:
    branches:
      - main
    paths:
      - 'portugal-housing-generations/**'
      - '.github/workflows/portugal-housing-generations.yml'
  workflow_dispatch:
    inputs:
      task:
        description: Which source to download, or release-archive to build the archive for a Zenodo upload
        type: choice
        options:
          - mortgage-rates
          - regional
          - affordability
          - rental
          - release-archive
        default: mortgage-rates

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    defaults:
      run:
        working-directory: portugal-housing-generations
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check the pinned data against their checksums
        working-directory: portugal-housing-generations/data
        run: sha256sum --check --strict --quiet SHA256SUMS

      - name: Run the tests
        run: python -m unittest discover -p 'test_*.py' -v

      - name: Rebuild the results from the pinned snapshots and compare
        run: |
          python analysis.py > /dev/null
          python regional.py > /dev/null
          python affordability.py > /dev/null
          python rental.py > /dev/null
          python integrated.py > /dev/null
          python data_sources.py > /dev/null
          git diff --exit-code -- results.json results_regional.json regional_panel.csv \
            results_affordability.json affordability_panel.csv results_rental.json rental_panel.csv \
            results_integrated.json integrated_panel.csv data_audit.csv DATA_SOURCES.csv

      # Redraws every figure and reports, as a warning, any PNG whose bytes or pixels
      # differ from the committed one; it fails only if a script fails.
      - name: Reproduce the release, including the figures
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install matplotlib==3.11.2
          python reproduce.py

  # Builds the folder archive for a manual Zenodo upload. It reproduces every result
  # first and uploads the zip and its SHA-256 as a workflow artifact; it creates no
  # GitHub release, tag or Zenodo record.
  release-archive:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'release-archive'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: portugal-housing-generations
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reproduce the release
        run: |
          python -m pip install matplotlib==3.11.2
          python reproduce.py

      # Stops here while any data file's redistribution has not been established
      # (see DATA_SOURCES.md), so no such file reaches a public archive.
      - name: Check that every data file may be redistributed
        run: python data_sources.py --check-redistribution

      - name: Build the archive from the committed folder
        id: archive
        run: |
          version=$(sed -n 's/^version: *//p' CITATION.cff)
          name="portugal-housing-generations-v${version}"
          mkdir -p ../dist
          git archive --format=zip --prefix="${name}/" -o "../dist/${name}.zip" HEAD:portugal-housing-generations
          (cd ../dist && sha256sum "${name}.zip" > "${name}.zip.sha256" && cat "${name}.zip.sha256")
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: dist/
          if-no-files-found: error

  # Refreshing the ECB series is a manual, reviewed step: dispatch this workflow
  # on a branch other than main; the job commits the dated raw response and its
  # retrieval record to that branch, and the change is reviewed in a pull request.
  # The defaults in analysis.py then have to be pointed at the new files.
  fetch-mortgage-rates:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.task == 'mortgage-rates'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: portugal-housing-generations
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download the ECB cost-of-borrowing series
        run: python fetch_mortgage_rates.py --out data

      - name: Commit the raw snapshot and its retrieval record
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add data/ecb_mir_PT_house_purchase_cost_of_borrowing_*
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "Pin ECB cost-of-borrowing snapshot ($(date -u +%Y-%m-%d))"
            git push
          fi

  fetch-regional:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && (inputs.task == 'regional' || inputs.task == 'affordability' || inputs.task == 'rental')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    defaults:
      run:
        working-directory: portugal-housing-generations
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download the INE series
        run: python fetch_regional.py --out data --set ${{ inputs.task }}

      - name: Commit the outputs
        if: always()
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Regional sources: runner output ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi

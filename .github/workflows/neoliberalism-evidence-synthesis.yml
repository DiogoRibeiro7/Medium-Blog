name: Neoliberalism evidence synthesis verification

on:
  pull_request:
    paths:
      - "neoliberalism-evidence-synthesis/**"
      - ".github/workflows/neoliberalism-evidence-synthesis.yml"
  push:
    branches: [main]
    paths:
      - "neoliberalism-evidence-synthesis/**"
      - ".github/workflows/neoliberalism-evidence-synthesis.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: neoliberalism-evidence-synthesis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: neoliberalism-evidence-synthesis/requirements.txt
      - name: Install pinned plotting library and linter
        run: python -m pip install -r requirements.txt ruff==0.17.5
      - name: Static checks
        run: |
          ruff check analysis.py figures.py tests
          ruff format --check analysis.py figures.py tests
          python -m compileall -q analysis.py figures.py tests
      - name: Validate official snapshots and frozen output reproduction
        run: python analysis.py --check
      - name: Run audit, data-quality and figure tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild publication figures independently
        run: python figures.py --output /tmp/neoliberalism-figures

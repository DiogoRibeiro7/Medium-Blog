name: Refresh recovery-after-busts data

on:
  push:
    branches:
      - recovery-after-busts
    paths:
      - 'recovery-after-busts/fetch.py'
      - 'recovery-after-busts/fetch_long.py'
      - '.github/workflows/recovery-after-busts-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: recovery-after-busts
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: recovery-after-busts/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Download the Eurostat series
        id: fetch
        continue-on-error: true
        run: python fetch.py --out data

      - name: Download the long AMECO series (DBnomics)
        id: fetch_long
        continue-on-error: true
        run: python fetch_long.py --out data

      - name: Commit the snapshot and its log if they changed
        if: always()
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add data
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "Refresh Eurostat snapshot for recovery-after-busts ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Fail if any request failed
        if: steps.fetch.outcome == 'failure' || steps.fetch_long.outcome == 'failure'
        run: |
          cat data/fetch_log.txt
          exit 1

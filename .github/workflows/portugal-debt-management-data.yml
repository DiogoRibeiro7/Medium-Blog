name: Refresh portugal-debt-management data

on:
  push:
    branches:
      - portugal-debt-management
    paths:
      - 'portugal-debt-management/fetch.py'
      - '.github/workflows/portugal-debt-management-data.yml'
  workflow_dispatch:
    inputs:
      only:
        description: 'Only these requests (space-separated names; empty for all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: portugal-debt-management
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: portugal-debt-management/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Download
        id: fetch
        continue-on-error: true
        env:
          ONLY: ${{ github.event.inputs.only || '' }}
        run: python fetch.py --out data ${ONLY:+--only $ONLY}

      - name: Commit the snapshot and its log if they changed
        if: always()
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add data
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "Refresh data snapshot for portugal-debt-management ($(date -u +%Y-%m-%d))"
            pushed=no
            for i in 1 2 3; do
              if git push; then pushed=yes; break; fi
              git pull --no-rebase --no-edit origin "${GITHUB_REF_NAME}" || true
              sleep 5
            done
            test "$pushed" = yes
          fi

      - name: Fail if a request failed
        if: steps.fetch.outcome == 'failure'
        run: |
          tail -40 data/fetch_log.txt
          exit 1

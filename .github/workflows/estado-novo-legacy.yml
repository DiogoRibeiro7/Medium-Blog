name: Reproduce estado-novo-legacy

on:
  pull_request:
    paths:
      - 'estado-novo-legacy/**'
      - 'data_sources/eurostat-eu-convergence-education.json'
      - 'data_sources/barro-lee-educational-attainment.json'
      - 'data_sources/penn-world-table-10-01.json'
      - 'data_sources/owid-co2-data.json'
      - '.github/workflows/estado-novo-legacy.yml'
  push:
    branches:
      - main
    paths:
      - 'estado-novo-legacy/**'
      - 'data_sources/eurostat-eu-convergence-education.json'
      - 'data_sources/barro-lee-educational-attainment.json'
      - 'data_sources/penn-world-table-10-01.json'
      - 'data_sources/owid-co2-data.json'
      - '.github/workflows/estado-novo-legacy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      # One BLAS thread, so floating-point reductions run in a fixed order.
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: estado-novo-legacy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: estado-novo-legacy/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test the core functions
        run: python -m unittest discover -s tests -v

      - name: Fetch the registry snapshot and the pinned external files
        run: python fetch.py

      - name: Rerun the analysis and compare with the committed output
        run: |
          python legacy_numbers.py > "$RUNNER_TEMP/output.txt"
          if ! diff -u output.txt "$RUNNER_TEMP/output.txt" > "$RUNNER_TEMP/diff.txt"; then
            cat "$RUNNER_TEMP/diff.txt"
            echo "::error file=estado-novo-legacy/output.txt::output of legacy_numbers.py differs from the committed output.txt"
            exit 1
          fi

      - name: Check every figure is drawn
        run: |
          python figures.py
          for f in fig1_relative_income fig2_schooling fig3_catch_up fig4_gdp_since_1995 fig5_education_by_age fig6_accounting; do
            test -s "figures/$f.png"
          done

name: Financialization before 2008 article reproducibility

on:
  pull_request:
    paths:
      - "financialization-before-2008/**"
      - ".github/workflows/financialization-before-2008.yml"
  push:
    paths:
      - "financialization-before-2008/**"
      - ".github/workflows/financialization-before-2008.yml"

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: financialization-before-2008
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: financialization-before-2008/requirements.txt
      - name: Install chart dependencies once
        run: python -m pip install -r requirements.txt
      - name: Audit source snapshots and derived annual panel
        run: python prepare_data.py --check
      - name: Run source, model and publication tests
        run: python -m unittest discover -s tests -v
      - name: Regenerate all figures and result tables
        run: python analysis.py
      - name: Check output counts
        run: python -c "from pathlib import Path; assert len(list(Path('figures').glob('figure_*.png'))) == 8; assert len(list(Path('results').glob('*.csv'))) == 3"

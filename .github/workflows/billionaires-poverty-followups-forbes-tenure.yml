name: Billionaire-poverty follow-ups — Forbes tenure and rounding

on:
  push:
    branches: [billionaires-poverty-volatility]
    paths:
      - ".github/workflows/billionaires-poverty-followups-forbes-tenure.yml"
      - "billionaires-poverty-followups/fetch_forbes_tenure.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-forbes-tenure:
    name: Tenure, previous change and rounding, 2010-2025
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r billionaires-poverty-followups/requirements.txt
      - name: Fetch and link the lists (no person-level records kept)
        working-directory: billionaires-poverty-followups
        run: |
          python fetch_forbes_tenure.py --first 2010 --last 2025 --output-dir data | tee forbes_tenure_log.txt
          echo "::notice title=Forbes tenure::$(python -c "import json;m=json.load(open('data/forbes_tenure_manifest.json'));print({y:(e.get('n_persons'),e.get('same_as_part4'),(e.get('error') or '')[:60]) for y,e in sorted(m['years'].items())})")"
      - name: Commit the aggregates to the branch
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add billionaires-poverty-followups/data/forbes_tenure.csv.gz \
                  billionaires-poverty-followups/data/forbes_tenure_manifest.json
          git commit -m "Billionaire-poverty follow-ups: Forbes tenure and rounding, aggregates only" || echo "no changes"
          git push origin HEAD:${GITHUB_REF_NAME}

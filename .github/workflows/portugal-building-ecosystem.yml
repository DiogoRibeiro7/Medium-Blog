name: Reproduce portugal-building-ecosystem

on:
  pull_request:
    paths:
      - 'portugal-building-ecosystem/**'
      - '.github/workflows/portugal-building-ecosystem.yml'
  push:
    branches:
      - main
    paths:
      - 'portugal-building-ecosystem/**'
      - '.github/workflows/portugal-building-ecosystem.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: portugal-building-ecosystem
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: portugal-building-ecosystem/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q tests

      - name: Analysis
        run: python analysis.py

      - name: Figures
        run: python figures.py

      - name: Results unchanged
        run: git diff --stat --exit-code -- results

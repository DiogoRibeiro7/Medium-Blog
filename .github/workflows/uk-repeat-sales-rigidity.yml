name: Reproduce uk-repeat-sales-rigidity

on:
  pull_request:
    paths:
      - 'uk-repeat-sales-rigidity/**'
      - '.github/workflows/uk-repeat-sales-rigidity.yml'
  push:
    branches:
      - main
    paths:
      - 'uk-repeat-sales-rigidity/**'
      - '.github/workflows/uk-repeat-sales-rigidity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: uk-repeat-sales-rigidity
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: uk-repeat-sales-rigidity/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest -q tests

      - name: Rerun the analysis
        run: python analysis.py > /dev/null

      - name: Check the numbers match the committed run
        run: git diff --exit-code -- results/summary.txt

      - name: Draw the figures
        run: |
          python figures.py
          for f in fig1_losses_by_year fig2_distribution_near_zero fig3_missing_share_vs_inflation fig4_floor_vs_market; do
            test -s "figures/$f.png"
          done

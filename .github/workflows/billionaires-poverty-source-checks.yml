name: Billionaire poverty source pipeline checks

on:
  pull_request:
    paths:
      - "billionaires-poverty-audit/**"
      - ".github/workflows/billionaires-poverty-source-checks.yml"
  push:
    branches: [main]
    paths:
      - "billionaires-poverty-audit/**"
      - ".github/workflows/billionaires-poverty-source-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: billionaires-poverty-audit/requirements.txt
      - name: Install isolated study dependencies
        run: python -m pip install -r billionaires-poverty-audit/requirements.txt
      - name: Check source modules compile
        run: |
          python -m py_compile \
            billionaires-poverty-audit/analysis.py \
            billionaires-poverty-audit/source_pipeline.py
      - name: Run offline contract and source tests
        working-directory: billionaires-poverty-audit
        run: python -m unittest discover -s tests -p "test_*.py" -v

name: Statistical evidence notebook

on:
  pull_request:
    paths:
      - "statistical-evidence-and-decisions/**"
      - ".github/workflows/statistical-evidence.yml"
  push:
    branches: [main]
    paths:
      - "statistical-evidence-and-decisions/**"
      - ".github/workflows/statistical-evidence.yml"

permissions:
  contents: read

jobs:
  notebook-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: statistical-evidence-and-decisions/requirements.txt
      - name: Install project dependencies
        working-directory: statistical-evidence-and-decisions
        run: python -m pip install -r requirements.txt
      - name: Test scientific invariants
        working-directory: statistical-evidence-and-decisions
        run: python -m pytest -q tests
      - name: Execute notebook with reduced Monte Carlo repetitions
        working-directory: statistical-evidence-and-decisions
        env:
          EVIDENCE_REPEATS: "1"
          EVIDENCE_BOOTSTRAPS: "20"
        run: >-
          jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=300
          --output evidence-review.executed.ipynb
          evidence-review.ipynb

      - name: Execute missingness and robustness notebook
        working-directory: statistical-evidence-and-decisions
        env:
          STRESS_REPEATS: "1"
          STRESS_SIZES: "80"
        run: >-
          jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=300
          --output robustness-review.executed.ipynb
          robustness-review.ipynb

      - name: Execute decision-cost selection notebook
        working-directory: statistical-evidence-and-decisions
        env:
          SELECTION_REPEATS: "1"
          SELECTION_SPLITS: "2"
          SELECTION_SIZES: "80"
          SELECTION_SMOKE: "1"
        run: >-
          jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=300
          --output model-selection-and-costs.executed.ipynb
          model-selection-and-costs.ipynb

      - name: Execute uncertainty and decisions notebook
        working-directory: statistical-evidence-and-decisions
        env:
          UNCERTAINTY_BOOTSTRAPS: "6"
          UNCERTAINTY_N_TRAIN: "80"
          UNCERTAINTY_N_TEST: "40"
        run: >-
          jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=300
          --output uncertainty-and-decisions.executed.ipynb
          uncertainty-and-decisions.ipynb

      - name: Execute calibration and decisions notebook
        working-directory: statistical-evidence-and-decisions
        env:
          CALIBRATION_SMOKE: "1"
          CALIBRATION_REPEATS: "1"
          CALIBRATION_N_FIT: "80"
          CALIBRATION_N_CAL: "30"
          CALIBRATION_N_TEST: "40"
        run: >-
          jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=300
          --output calibration-and-decisions.executed.ipynb
          calibration-and-decisions.ipynb

      - name: Execute temporal drift notebook
        working-directory: statistical-evidence-and-decisions
        env:
          DRIFT_SMOKE: "1"
          DRIFT_REPEATS: "1"
        run: >-
          jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=300
          --output temporal-drift-and-decisions.executed.ipynb
          temporal-drift-and-decisions.ipynb

      - name: Execute gradual drift and delayed feedback notebook
        working-directory: statistical-evidence-and-decisions
        env:
          GRADUAL_SMOKE: "1"
          GRADUAL_REPEATS: "1"
        run: >-
          jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=300
          --output gradual-drift-and-delayed-feedback.executed.ipynb
          gradual-drift-and-delayed-feedback.ipynb

      - name: Execute change-point detection notebook
        working-directory: statistical-evidence-and-decisions
        env:
          DETECTOR_SMOKE: "1"
          DETECTOR_REPEATS: "1"
        run: >-
          jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=300
          --output change-point-and-retraining.executed.ipynb
          change-point-and-retraining.ipynb

      - name: Execute detector economics notebook
        working-directory: statistical-evidence-and-decisions
        env:
          MAINTENANCE_SMOKE: "1"
          MAINTENANCE_REPEATS: "1"
        run: >-
          jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=300
          --output horizon-detector-economics.executed.ipynb
          horizon-detector-economics.ipynb

      - name: Execute comparative change-detection notebook
        working-directory: statistical-evidence-and-decisions
        env:
          COMPARATIVE_SMOKE: "1"
          COMPARATIVE_REPEATS: "1"
        run: >-
          jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=300
          --output comparative-change-detection.executed.ipynb
          comparative-change-detection.ipynb

      - name: Execute detector Monte Carlo validation notebook
        working-directory: statistical-evidence-and-decisions
        env:
          MC_VALIDATION_SMOKE: "1"
          MC_VALIDATION_REPEATS: "1"
        run: >-
          jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=300
          --output detector-monte-carlo-validation.executed.ipynb
          detector-monte-carlo-validation.ipynb

      - name: Smoke-test evidence synthesis notebook
        working-directory: statistical-evidence-and-decisions
        env:
          SYNTHESIS_SMOKE: "1"
          SYNTHESIS_REPEATS: "1"
        run: >-
          jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=300
          --output evidence-synthesis.executed.ipynb
          evidence-synthesis.ipynb

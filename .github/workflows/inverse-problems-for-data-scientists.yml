name: Inverse problems article evidence

on:
  pull_request:
    paths:
      - "inverse-problems-for-data-scientists/**"
      - ".github/workflows/inverse-problems-for-data-scientists.yml"
  push:
    branches: [main]
    paths:
      - "inverse-problems-for-data-scientists/**"
      - ".github/workflows/inverse-problems-for-data-scientists.yml"

jobs:
  reproduce-quick-study:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: inverse-problems-for-data-scientists
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: inverse-problems-for-data-scientists/requirements.txt
      - name: Install study dependencies
        run: python -m pip install -r requirements.txt
      - name: Mathematical tests and fresh-kernel notebook
        run: python -m unittest discover -s tests -v
      - name: Reproduce smoke-test figures and tables
        run: python analysis.py --quick

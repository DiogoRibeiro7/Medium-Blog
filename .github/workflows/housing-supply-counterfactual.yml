name: Housing supply counterfactual article verification

on:
  pull_request:
    paths:
      - "housing-supply-counterfactual/**"
      - ".github/workflows/housing-supply-counterfactual.yml"
  push:
    branches: [main]
    paths:
      - "housing-supply-counterfactual/**"
      - ".github/workflows/housing-supply-counterfactual.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: housing-supply-counterfactual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: housing-supply-counterfactual/requirements.txt
      - name: Install dependencies and one static-analysis environment
        run: python -m pip install -r requirements.txt ruff==0.17.4 mypy==2.4.1
      - name: Check formatting, lint and types once
        run: |
          ruff check analysis.py tests
          ruff format --check analysis.py tests
          mypy --ignore-missing-imports analysis.py tests
      - name: Run frozen-source and identification-boundary tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild all ten figures from frozen observations
        run: python analysis.py --output /tmp/housing-supply-counterfactual-figures

name: Reproduce ecb-france-backstop

on:
  pull_request:
    paths:
      - 'ecb-france-backstop/**'
      - '.github/workflows/ecb-france-backstop.yml'
  push:
    branches:
      - main
    paths:
      - 'ecb-france-backstop/**'
      - '.github/workflows/ecb-france-backstop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ecb-france-backstop
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ecb-france-backstop/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q tests

      - name: Warranted spreads
        run: python warranted.py > /dev/null

      - name: Interest bill
        run: python bill.py > /dev/null

      - name: Channels to the rest of the EU
        run: python channels.py > /dev/null

      - name: Past announcements
        run: python tools.py > /dev/null

      - name: Figures
        run: python figures.py

      - name: Summaries unchanged within tolerance
        run: |
          S="results/warranted_summary.txt results/bill_summary.txt results/channels_summary.txt results/tools_summary.txt"
          git diff --stat -- $S || true
          python check_results.py $S

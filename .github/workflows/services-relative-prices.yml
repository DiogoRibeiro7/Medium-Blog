name: Reproduce services-relative-prices

on:
  pull_request:
    paths:
      - 'services-relative-prices/**'
      - 'data_sources/eurostat-services-relative-prices.json'
      - '.github/workflows/services-relative-prices.yml'
  push:
    branches:
      - main
    paths:
      - 'services-relative-prices/**'
      - 'data_sources/eurostat-services-relative-prices.json'
      - '.github/workflows/services-relative-prices.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      # One BLAS thread, so floating-point reductions run in a fixed order.
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: services-relative-prices
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services-relative-prices/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test the core functions
        run: python -m unittest discover -s tests -v

      - name: Fetch the registry snapshot
        run: python fetch.py

      - name: Rerun the analysis and compare with the committed output
        run: |
          python prices_numbers.py > "$RUNNER_TEMP/output.txt"
          if ! diff -u output.txt "$RUNNER_TEMP/output.txt" > "$RUNNER_TEMP/diff.txt"; then
            cat "$RUNNER_TEMP/diff.txt"
            echo "::error file=services-relative-prices/output.txt::output of prices_numbers.py differs from the committed output.txt"
            exit 1
          fi

      - name: Check every figure is drawn
        run: |
          python figures.py
          for f in fig1_consumer_items fig2_services_vs_manufacturing fig3_industries fig4_panel fig5_price_levels fig6_persistence; do
            test -s "figures/$f.png"
          done

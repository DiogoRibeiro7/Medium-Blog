name: Airline operations optimization

# Companion of the article on aircraft routing, crew pairing and disruption recovery.
# Pull requests: lint, static types, unit tests and a smoke run of the whole pipeline.
# Pushes to the branch and manual runs: also the full experiment when its inputs changed (the digest in
# results/INPUTS covers the model code, the configuration, the data contract and the pinned versions), then
# the summary and the figures, committed back to the branch.

on:
  push:
    branches:
      - airline-operations-optimization
    paths:
      - 'airline-operations-optimization/**'
      - '!airline-operations-optimization/results/**'
      - '!airline-operations-optimization/figures/**'
      - 'data_sources/openflights-airports.json'
      - '.github/workflows/airline-operations-optimization.yml'
  pull_request:
    paths:
      - 'airline-operations-optimization/**'
      - 'data_sources/openflights-airports.json'
      - '.github/workflows/airline-operations-optimization.yml'
  workflow_dispatch:

concurrency:
  group: airline-operations-optimization-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  MPLBACKEND: Agg
  PYTHONPATH: src
  OPENBLAS_NUM_THREADS: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: airline-operations-optimization
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: airline-operations-optimization/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Static types
        run: mypy src
      - name: Unit tests
        run: python -m pytest -q
      - name: Smoke run of the whole pipeline
        run: |
          python -m airline_ops run --config configs/smoke.toml --out "$RUNNER_TEMP/smoke"
          python -m airline_ops summary --results "$RUNNER_TEMP/smoke"
          python -m airline_ops figures --results "$RUNNER_TEMP/smoke" --out "$RUNNER_TEMP/smoke-figures"

  experiment:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: airline-operations-optimization
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: airline-operations-optimization/requirements.txt
      - name: Install pinned dependencies and the figure font
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get install -y fonts-inter || echo "Inter not available; figures fall back to DejaVu Sans"
      - name: Full experiment (skipped when results/INPUTS matches the inputs)
        run: |
          if python -m airline_ops digest --check results/INPUTS; then
            echo "Inputs unchanged; keeping the committed results."
          else
            rm -rf results
            python -m airline_ops run --config configs/experiment.toml --out results
            python -m airline_ops details --config configs/experiment.toml --results results
            python -m airline_ops digest --write results/INPUTS
          fi
          if [ ! -f results/details.json ]; then
            python -m airline_ops details --config configs/experiment.toml --results results
          fi
      - name: Summary and figures
        run: |
          python -m airline_ops summary --results results
          python -m airline_ops figures --results results --out figures
      - name: Commit results and figures
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add results figures
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "airline-operations-optimization: results and figures from the workflow ($(date -u +%Y-%m-%d))"
            git push || (git pull --rebase --autostash && git push)
          fi

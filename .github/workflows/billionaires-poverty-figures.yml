name: Reproduce billionaire-poverty exploratory figures

on:
  pull_request:
    paths:
      - "billionaires-poverty-audit/observed_figures.py"
      - "billionaires-poverty-audit/tests/test_observed_figures.py"
      - "billionaires-poverty-audit/survey_vintage_audit.py"
      - "billionaires-poverty-audit/tests/test_survey_vintage_audit.py"
      - "billionaires-poverty-audit/data/observed_citizenship_54_2026.csv"
      - "billionaires-poverty-audit/publication_analysis.py"
      - "billionaires-poverty-audit/tests/test_publication_analysis.py"
      - "billionaires-poverty-audit/results/publication/**"
      - "billionaires-poverty-audit/publication_figures/**"
      - "billionaires-poverty-audit/requirements.txt"
      - ".github/workflows/billionaires-poverty-figures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: billionaires-poverty-audit/requirements.txt
      - name: Install isolated research dependencies
        run: python -m pip install -r billionaires-poverty-audit/requirements.txt
      - name: Check code compiles
        run: |
          python -m py_compile \
            billionaires-poverty-audit/observed_figures.py \
            billionaires-poverty-audit/tests/test_observed_figures.py \
            billionaires-poverty-audit/survey_vintage_audit.py \
            billionaires-poverty-audit/tests/test_survey_vintage_audit.py \
            billionaires-poverty-audit/publication_analysis.py \
            billionaires-poverty-audit/tests/test_publication_analysis.py
      - name: Validate original CI panel and statistical models
        working-directory: billionaires-poverty-audit
        run: python -m unittest discover -s tests -p "test_observed_figures.py" -v
      - name: Validate survey-vintage sensitivity contracts
        working-directory: billionaires-poverty-audit
        run: python -m unittest discover -s tests -p "test_survey_vintage_audit.py" -v
      - name: Validate revised-article analysis contracts
        working-directory: billionaires-poverty-audit
        run: python -m unittest discover -s tests -p "test_publication_analysis.py" -v
      - name: Reproduce every number in the revised article
        working-directory: billionaires-poverty-audit
        run: |
          python publication_analysis.py --check --figures figures/publication_check \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Reproduce poverty survey-vintage sensitivity
        working-directory: billionaires-poverty-audit
        run: python survey_vintage_audit.py --output results/survey_vintage_sensitivity
      - name: Summarize survey-vintage sample attrition
        working-directory: billionaires-poverty-audit
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("results/survey_vintage_sensitivity/audit.json")
          result = json.loads(output.read_text(encoding="utf-8"))
          records = result["maximum_lag_restrictions"]
          fitted = [row for row in records if row["fitted"]]
          if not fitted or records[-1]["n"] != 54:
              raise SystemExit("Survey-vintage output is incomplete")
          lines = [
              "## Exploratory poverty survey-vintage audit",
              "",
              "Secondary citizenship comparison only; not a historical residence replication.",
              f"- Countries: {result['n']}",
              f"- Poverty survey years: {result['min_poverty_year']}–{result['max_poverty_year']}",
              f"- Maximum GDP-to-poverty observation lag: {result['max_survey_lag']} years",
              f"- Fitted lag thresholds: {len(fitted)}",
              "",
              "| Maximum lag | Countries | GDP-adjusted billionaire coefficient (pp/log10) | HC3 p |",
              "| ---: | ---: | ---: | ---: |",
          ]
          for row in fitted:
              lines.append(
                  f"| {row['max_years_between_poverty_and_gdp']} | {row['n']} | "
                  f"{row['billionaire_coef_pp_per_log10']:.3f} | {row['hc3_p']:.3f} |"
              )
          lines.append("")
          lines.append("Threshold samples change composition; coefficients are descriptive, not causal.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
      - name: Render eight PNG/SVG pairs from frozen input
        working-directory: billionaires-poverty-audit
        run: |
          python observed_figures.py \
            --input data/observed_citizenship_54_2026.csv \
            --output figures/citizenship_exploratory
      - name: Print exploratory model summary
        working-directory: billionaires-poverty-audit
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              Path("figures/citizenship_exploratory/figure_results.json").read_text()
          )
          models = result["results"]["models"]
          lines = [
              "## Exploratory 54-country citizenship figures",
              "",
              "Secondary Forbes citizenship counts, **not** the residence chart; no causal claim.",
              f"- Figure pairs: {len(result['figures'])}",
              f"- Raw billionaire-density R²: {models['raw']['r_squared']:.4f}",
              f"- GDP-only R²: {models['gdp']['r_squared']:.4f}",
              f"- Joint R²: {models['joint']['r_squared']:.4f}",
              f"- GDP-adjusted billionaire HC3 p: {models['joint']['hc3_p']['log10_billionaires_per_10m']:.3f}",
              "",
              "Every figure is accompanied by a PNG/SVG SHA-256 and a pinned input hash.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
      - name: Upload observed figures, source panel, and model audit
        uses: actions/upload-artifact@v4
        with:
          name: billionaire-poverty-citizenship-figures-${{ github.run_id }}
          path: |
            billionaires-poverty-audit/figures/citizenship_exploratory/
            billionaires-poverty-audit/figures/publication_check/
            billionaires-poverty-audit/results/publication/
            billionaires-poverty-audit/data/observed_citizenship_54_2026.csv
            billionaires-poverty-audit/OBSERVED_FIGURES.md
            billionaires-poverty-audit/results/survey_vintage_sensitivity/
            billionaires-poverty-audit/SURVEY_VINTAGE_AUDIT.md
          retention-days: 30
          if-no-files-found: error

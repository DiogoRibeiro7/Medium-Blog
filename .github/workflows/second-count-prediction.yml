name: Second count prediction

# Companion of the follow-up to Part 4 of Code Quality for Data Work: does the agreement of two counts on clean
# months predict the smallest random loss they can catch?
#
# - tests: lint and unit tests;
# - sources: until PLAN.md exists, only names, sizes and HTTP status (bucket keys, report links); after it,
#   the operator reports and the NYC DOT table;
# - chicago: the Chicago portal counts (metadata only until PLAN.md exists), in parallel with the counting;
# - citibike: once PLAN.md exists, one job per year counts the trip files by month of trip start (at most four
#   at once; finished years are cached, so a rerun resumes);
# - evaluate: the prediction test and the figures; commits sources, counts, results and figures on pushes.

on:
  push:
    branches:
      - second-count-prediction
    paths:
      - 'second-count-prediction/feed/**'
      - 'second-count-prediction/evaluate.py'
      - 'second-count-prediction/figures.py'
      - 'second-count-prediction/PLAN.md'
      - 'second-count-prediction/requirements.txt'
      - '.github/workflows/second-count-prediction.yml'
  pull_request:
    paths:
      - 'second-count-prediction/**'
      - '.github/workflows/second-count-prediction.yml'
  workflow_dispatch:

concurrency:
  group: second-count-prediction-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: second-count-prediction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: second-count-prediction/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit tests
        run: python -m pytest -q

  sources:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: second-count-prediction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: second-count-prediction/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Snapshot the Citi Bike sources
        run: |
          if [ -f PLAN.md ]; then
            python -m feed.sources --out sources --only citibike
          else
            echo "No PLAN.md yet: names, sizes and HTTP status only."
            python -m feed.sources --out sources --only citibike --metadata-only
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sources
          path: second-count-prediction/sources
          retention-days: 7

  chicago:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: second-count-prediction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: second-count-prediction/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Snapshot the Chicago counts
        run: |
          mkdir -p chicago
          if [ -f PLAN.md ]; then
            python -m feed.sources --out chicago --only chicago
          else
            python -m feed.sources --out chicago --only chicago --metadata-only
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chicago
          path: second-count-prediction/chicago
          retention-days: 7

  citibike:
    needs: sources
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        year: [2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    defaults:
      run:
        working-directory: second-count-prediction
    steps:
      - uses: actions/checkout@v4
      - name: Make room for the archives
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: second-count-prediction/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: sources
          path: second-count-prediction/sources-new
      - name: Restore counts from earlier runs
        uses: actions/cache/restore@v4
        with:
          path: second-count-prediction/counts
          key: citibike-${{ matrix.year }}-${{ hashFiles('second-count-prediction/feed/citibike.py') }}-${{ github.run_id }}
          restore-keys: citibike-${{ matrix.year }}-${{ hashFiles('second-count-prediction/feed/citibike.py') }}-
      - name: Count ${{ matrix.year }}
        run: |
          if [ ! -f PLAN.md ]; then echo "No PLAN.md yet: nothing is counted."; mkdir -p counts/citibike; exit 0; fi
          python -m feed.citibike --year ${{ matrix.year }} --bucket sources-new/citibike_bucket.json --out counts --cache /tmp/cb
      - name: Keep what was counted, even if some keys failed
        if: always()
        uses: actions/cache/save@v4
        with:
          path: second-count-prediction/counts
          key: citibike-${{ matrix.year }}-${{ hashFiles('second-count-prediction/feed/citibike.py') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: counts-${{ matrix.year }}
          path: second-count-prediction/counts
          retention-days: 7
          if-no-files-found: ignore

  evaluate:
    needs: [sources, citibike, chicago]
    if: always() && needs.sources.result == 'success' && needs.citibike.result == 'success' && needs.chicago.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: second-count-prediction
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: second-count-prediction/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: sources
          path: second-count-prediction/sources
      - uses: actions/download-artifact@v4
        with:
          name: chicago
          path: second-count-prediction/sources
      - uses: actions/download-artifact@v4
        with:
          pattern: counts-*
          path: second-count-prediction/counts
          merge-multiple: true
      - name: Test the prediction
        run: |
          if [ -f PLAN.md ]; then
            python evaluate.py --counts counts --sources sources --part4 ../data-tests-limits --out results
            if [ -f figures.py ]; then python figures.py || echo "figures failed"; fi
          else
            echo "No PLAN.md yet: metadata only."
          fi
      - name: Commit sources, counts, results and figures
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add sources
          for d in counts results figures; do if [ -d "$d" ]; then git add "$d"; fi; done
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "second-count-prediction: sources, counts and results from the workflow ($(date -u +%Y-%m-%d))"
            git push || (git pull --rebase --autostash && git push)
          fi

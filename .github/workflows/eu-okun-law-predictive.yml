name: EU Okun predictive comparison

# Expanding-window refits of the Bayesian models, kept out of the ordinary pull-request
# checks. Two studies:
# - conditional (PREDICTIVE_PROTOCOL.md): by hand with study=conditional, or a pull
#   request labelled `predictive-sampling`;
# - forecast (BAYES_FORECAST_PROTOCOL.md, one quarter ahead, nothing dated t): by hand
#   with study=forecast, or a pull request labelled `forecast-sampling`.
on:
  workflow_dispatch:
    inputs:
      study:
        description: "conditional (PREDICTIVE_PROTOCOL.md) or forecast (BAYES_FORECAST_PROTOCOL.md)"
        type: choice
        options: [conditional, forecast]
        default: conditional
  pull_request:
    types: [labeled]
    paths:
      - "eu-okun-law/**"
      - ".github/workflows/eu-okun-law-predictive.yml"

permissions:
  contents: read

jobs:
  refit:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.study != 'forecast')
      || github.event.label.name == 'predictive-sampling'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        set: [E1, E2]
        model: [bayes_primary, bayes_no_common_factor, bayes_gaussian_iid]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Install locked study environment (project-local .venv)
        working-directory: eu-okun-law
        run: |
          poetry check --lock
          poetry install --no-interaction --extras "bayes report"
      - name: Refit at every origin of the evaluation set
        working-directory: eu-okun-law
        run: >-
          poetry run eu-okun predictive-fit --data-dir snapshots/eurostat-2026-10-15
          --output-dir results/predictive --sets ${{ matrix.set }} --models ${{ matrix.model }}
      - name: Archive predictions and refit diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: predictive-${{ matrix.set }}-${{ matrix.model }}
          path: eu-okun-law/results/predictive/
          retention-days: 30
          if-no-files-found: error

  report:
    needs: refit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Install locked study environment (project-local .venv)
        working-directory: eu-okun-law
        run: |
          poetry check --lock
          poetry install --no-interaction --extras "bayes report"
      - name: Collect the refits
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: predictive-*
          path: eu-okun-law/results/predictive
          merge-multiple: true
      - name: Score, test and report
        working-directory: eu-okun-law
        run: >-
          poetry run eu-okun predictive-report --data-dir snapshots/eurostat-2026-10-15
          --fits-dir results/predictive --output-dir results/predictive-report
      - name: Archive the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: eu-okun-predictive-report
          path: eu-okun-law/results/predictive-report/
          retention-days: 30
          if-no-files-found: error

  forecast-refit:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.study == 'forecast')
      || github.event.label.name == 'forecast-sampling'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        model: [bayes_ar1, bayes_gdp_ar1, bayes_gdp_ar1_factor]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Install locked study environment (project-local .venv)
        working-directory: eu-okun-law
        run: |
          poetry check --lock
          poetry install --no-interaction --extras "bayes report"
      - name: Refit at every origin of the forecasting framework
        working-directory: eu-okun-law
        run: >-
          poetry run eu-okun forecast-bayes-fit --data-dir snapshots/eurostat-2026-10-15
          --output-dir results/forecast-bayes --models ${{ matrix.model }}
      - name: Archive forecasts and refit diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: forecast-bayes-${{ matrix.model }}
          path: eu-okun-law/results/forecast-bayes/
          retention-days: 30
          if-no-files-found: error

  forecast-report:
    needs: forecast-refit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Install locked study environment (project-local .venv)
        working-directory: eu-okun-law
        run: |
          poetry check --lock
          poetry install --no-interaction --extras "bayes report"
      - name: Collect the refits
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: forecast-bayes-*
          path: eu-okun-law/results/forecast-bayes
          merge-multiple: true
      - name: Score, test and report
        working-directory: eu-okun-law
        run: >-
          poetry run eu-okun forecast-report --data-dir snapshots/eurostat-2026-10-15
          --fits-dir results/forecast-bayes --output-dir results/forecast-comparison
      - name: Archive the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: eu-okun-forecast-comparison
          path: eu-okun-law/results/forecast-comparison/
          retention-days: 30
          if-no-files-found: error

name: GDP and welfare empirical study

on:
  pull_request:
    paths:
      - "gdp-life-outcomes/**"
      - ".github/workflows/gdp-life-outcomes.yml"
  push:
    branches: [main]
    paths:
      - "gdp-life-outcomes/**"
      - ".github/workflows/gdp-life-outcomes.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gdp-life-outcomes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gdp-life-outcomes/requirements.txt
      - name: Install scoped dependencies
        run: python -m pip install -r requirements.txt
      - name: Test numerical routines and data contracts
        run: python -m unittest discover -s tests -v
      - name: Reproduce from pinned WDI snapshot
        run: python analysis.py --panel data/wdi_panel.csv --results-dir /tmp/gdp-results --figures-dir /tmp/gdp-figures
      - name: Check archived results, source fingerprint and figures
        run: python audit.py --reference results --candidate /tmp/gdp-results --panel data/wdi_panel.csv --figures /tmp/gdp-figures

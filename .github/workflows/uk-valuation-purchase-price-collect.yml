name: Collect uk-valuation-purchase-price aggregates from a finished run

on:
  push:
    branches:
      - uk-valuation-purchase-price
    paths:
      - '.github/workflows/uk-valuation-purchase-price-collect.yml'

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download the aggregates of run 43434153017
        uses: actions/download-artifact@v4
        with:
          name: uk-valuation-purchase-price-results
          run-id: 43434153017
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/artifact

      - name: Commit them
        run: |
          ls -R "$RUNNER_TEMP/artifact" | head -40
          mkdir -p uk-valuation-purchase-price/data uk-valuation-purchase-price/results
          cp -r "$RUNNER_TEMP/artifact/data/." uk-valuation-purchase-price/data/
          cp -r "$RUNNER_TEMP/artifact/results/." uk-valuation-purchase-price/results/
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add uk-valuation-purchase-price/data uk-valuation-purchase-price/results
          git commit -m "uk-valuation-purchase-price: results from the Price Paid Data ($(date -u +%Y-%m-%d))"
          git push

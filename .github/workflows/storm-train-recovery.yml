name: Reproduce storm-train-recovery

on:
  pull_request:
    paths:
      - 'storm-train-recovery/**'
      - '.github/workflows/storm-train-recovery.yml'
  push:
    branches:
      - main
    paths:
      - 'storm-train-recovery/**'
      - '.github/workflows/storm-train-recovery.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storm-train-recovery
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: storm-train-recovery/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Rerun the analysis and the simulations
        run: python storm_train.py > results/output.txt

      - name: Check the numbers match the committed run
        run: git diff --exit-code -- results/output.txt

      - name: Check every figure was drawn
        run: |
          for f in 01_storm_train 02_kristin_backlog 03_restoration_comparison 04_capacity 05_next_storm 06_backlog_tails 07_levers; do
            test -s "figures/$f.png"
          done
          test "$(ls figures/equations/*.png | wc -l)" -eq 9

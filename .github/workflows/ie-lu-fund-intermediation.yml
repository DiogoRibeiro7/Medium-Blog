name: Reproduce ie-lu-fund-intermediation

on:
  pull_request:
    paths:
      - 'ie-lu-fund-intermediation/**'
      - '.github/workflows/ie-lu-fund-intermediation.yml'
  push:
    branches:
      - main
    paths:
      - 'ie-lu-fund-intermediation/**'
      - '.github/workflows/ie-lu-fund-intermediation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ie-lu-fund-intermediation
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ie-lu-fund-intermediation/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest -q tests

      - name: Rerun the analysis
        run: python analysis.py > /dev/null

      - name: Check the numbers match the committed run
        run: git diff --exit-code -- results/analysis_summary.txt

      - name: Draw the figures
        run: |
          python figures.py
          for f in fig1_us_purchases_by_member fig2_who_holds_hub_securities fig3_gross_inflow_decomposition \
                   fig4_attribution_of_us_purchases fig5_quarterly_comovement fig6_sensitivity; do
            test -s "figures/$f.png"
          done

name: Run org-chart-blind-tester

# The experiment itself, on the free GitHub Models quota. Each run asks every model as many questions as
# its daily quota allows, resumes where the last run stopped, and commits the responses to the
# org-chart-blind-tester-runs branch (outputs never land on main). Runs daily until every model is done;
# disable the schedule afterwards.

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      models:
        description: "Model keys from config.json, space-separated; empty for all"
        type: string
        default: ""

permissions:
  contents: write
  models: read

concurrency:
  group: org-chart-blind-tester-run
  cancel-in-progress: false

env:
  RUNS_BRANCH: org-chart-blind-tester-runs

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Check out the runs branch, or start it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin "$RUNS_BRANCH" > /dev/null; then
            git clone --quiet --depth 1 --branch "$RUNS_BRANCH" "$url" runs-branch
          else
            mkdir runs-branch
            git -C runs-branch init --quiet -b "$RUNS_BRANCH"
            git -C runs-branch remote add origin "$url"
            printf '# org-chart-blind-tester runs\n\nResponses written by the scheduled workflow `org-chart-blind-tester-run.yml`, one JSON line per model call. The code is in `org-chart-blind-tester/` on main.\n' > runs-branch/README.md
          fi
          mkdir -p runs-branch/org-chart-blind-tester/runs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: org-chart-blind-tester/requirements.txt

      - name: Install pinned dependencies
        working-directory: org-chart-blind-tester
        run: python -m pip install -r requirements.txt

      - name: Ask the models
        id: ask
        continue-on-error: true
        working-directory: org-chart-blind-tester
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODELS: ${{ inputs.models }}
        run: |
          python run.py \
            --runs-dir ../runs-branch/org-chart-blind-tester/runs \
            --status ../runs-branch/org-chart-blind-tester/status.json \
            ${MODELS:+--models $MODELS}

      - name: Commit the responses
        if: always()
        working-directory: runs-branch
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new responses."
          else
            git commit --quiet -m "org-chart-blind-tester responses ($(date -u +%Y-%m-%d))"
            git push --quiet origin "$RUNS_BRANCH"
          fi
          if [ -f org-chart-blind-tester/status.json ] && python -c "import json,sys; sys.exit(0 if json.load(open('org-chart-blind-tester/status.json'))['all_complete'] else 1)"; then
            echo "::notice::Every model has answered every question; the schedule can be disabled."
          fi

      - name: Fail if a model stopped on an error
        if: steps.ask.outcome == 'failure'
        run: exit 1

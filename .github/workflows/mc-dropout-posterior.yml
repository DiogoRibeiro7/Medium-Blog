name: Reproduce mc-dropout-posterior

on:
  pull_request:
    paths:
      - 'mc-dropout-posterior/**'
      - '.github/workflows/mc-dropout-posterior.yml'
  push:
    branches:
      - main
    paths:
      - 'mc-dropout-posterior/**'
      - '.github/workflows/mc-dropout-posterior.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mc-dropout-posterior-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mc-dropout-posterior
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: mc-dropout-posterior/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Check the implementation
        run: python check_mcd.py

      - name: Keep the committed exact results
        run: mkdir -p "$RUNNER_TEMP/committed" && cp results/01_linear_floor.txt "$RUNNER_TEMP/committed/"

      - name: Rerun the exact linear-model experiment
        run: python 01_linear_floor.py

      - name: Check its numbers match the committed run
        run: python check_reproduction.py "$RUNNER_TEMP/committed"

      - name: Smoke-run the network experiments (tiny settings, separate output)
        env:
          MCD_QUICK: '1'
          MCD_RESULTS: ${{ runner.temp }}/quick/results
          MCD_FIGURES: ${{ runner.temp }}/quick/figures
        run: |
          python 02_concentration.py
          python 03_uci_benchmark.py --sets yacht,energy --workers 2
          python 04_shift.py
          python figures.py
          for f in fig3_concentration fig4_benchmark_score fig5_shift fig6_risk_coverage; do
            test -s "$MCD_FIGURES/$f.png"
          done

      - name: Check every committed figure is present
        run: |
          for f in fig1_linear_floor fig2_effect_size fig3_concentration fig4_benchmark_score \
                   fig5_shift fig6_risk_coverage; do
            test -s "figures/$f.png"
          done

name: Build rent-or-buy-us results (branch only)

on:
  push:
    branches:
      - rent-or-buy-us
    paths:
      - 'rent-or-buy-us/*.py'
      - 'rent-or-buy-us/requirements.txt'
      - '.github/workflows/rent-or-buy-us-results.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: rent-or-buy-us
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: rent-or-buy-us/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python fetch.py
      - run: python rentbuy_numbers.py > output.txt && python figures.py
      - name: Commit the output and the figures
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add output.txt figures
          if git diff --cached --quiet; then echo "unchanged"; else
            git commit -m "Build rent-or-buy-us output and figures"
            git push
          fi

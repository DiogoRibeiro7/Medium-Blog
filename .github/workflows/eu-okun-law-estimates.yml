name: EU Okun empirical estimates
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "eu-okun-law/**"
      - ".github/workflows/eu-okun-law-estimates.yml"
permissions:
  contents: read
jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Install locked study environment (project-local .venv)
        working-directory: eu-okun-law
        run: |
          poetry check --lock
          poetry install --no-interaction --extras dev
      - name: Fetch real observations
        working-directory: eu-okun-law
        run: poetry run eu-okun fetch --start-quarter 2008-Q1 --end-quarter 2026-Q2 --output-dir data
      - name: Validate sources
        working-directory: eu-okun-law
        run: poetry run eu-okun audit --output-dir data
      - name: Estimate descriptive models
        working-directory: eu-okun-law
        run: poetry run eu-okun baseline --data-dir data --output results/ols_hac.json
      - name: Compare cumulative GDP coefficients on common quarters
        working-directory: eu-okun-law
        run: poetry run eu-okun compare --data-dir data --output-dir results/comparison
      - name: Run economic-regime sensitivity
        working-directory: eu-okun-law
        run: poetry run eu-okun regimes --data-dir data --output-dir results/regimes
      - name: Stability and dependence inference
        working-directory: eu-okun-law
        run: poetry run eu-okun infer --data-dir data --output-dir results/inference
      - name: Evaluate expanding-window forecasting
        working-directory: eu-okun-law
        run: poetry run eu-okun forecast --data-dir data --output-dir results/forecast
      - name: Review classical results (independent verification and sensitivity)
        working-directory: eu-okun-law
        run: >-
          poetry run eu-okun review --data-dir data --output-dir results/review
          --published-dir results
          --provenance "Outputs of the preceding steps in this workflow run"
      - name: Verify expected country models
        working-directory: eu-okun-law
        run: |
          poetry run python - <<'PY'
          import json
          from pathlib import Path
          models = json.loads(Path("results/ols_hac.json").read_text())["models"]
          coverage = {(m["geo"], m["lags"], m["participation"]) for m in models}
          if len(coverage) != 27 * 4 * 2:
              raise SystemExit(f"Unexpected number of models: {len(coverage)}")
          if any(m["n"] < 12 for m in models):
              raise SystemExit("Insufficient observations in regression output")
          print(f"Validated {len(models)} descriptive regressions.")
          comparison = json.loads(Path("results/comparison/comparison.json").read_text())
          if len(comparison["models"]) != 216:
              raise SystemExit("Missing comparison specifications")
          if len(comparison["sample_quarters"]) < 30:
              raise SystemExit("Common sample unexpectedly short")
          regimes = json.loads(Path("results/regimes/regimes.json").read_text())
          if regimes["windows"]["full"]["status"] != "estimated":
              raise SystemExit("Full-period regime comparison did not fit")
          print({key: val["status"] for key, val in regimes["windows"].items()})
          forecast = json.loads(Path("results/forecast/scores.json").read_text())
          if len(forecast["scores"]) != 162:
              raise SystemExit("Forecast country/model coverage missing")
          if forecast["forecast_count"] < 27 * 6 * 12:
              raise SystemExit("Insufficient held-out forecast origins")
          PY
      - name: Monthly identification on the frozen snapshots (MONTHLY_IDENTIFICATION_PROTOCOL.md)
        working-directory: eu-okun-law
        run: >-
          poetry run eu-okun monthly-identification
          --data-dir snapshots/eurostat-monthly-2026-10-18
          --shocks-dir snapshots/external-shocks-2026-10-16
          --quarterly-dir docs/identification
          --output-dir results/monthly-identification
          --report results/monthly-identification/MONTHLY_IDENTIFICATION_RESULTS.md
      - name: Committed monthly identification tables reproduce on Linux
        working-directory: eu-okun-law
        run: poetry run pytest tests/test_monthly_identification.py -q
      - name: Shift-share feasibility on the frozen snapshots (SHIFT_SHARE_PROTOCOL.md)
        working-directory: eu-okun-law
        run: >-
          poetry run eu-okun shift-share
          --data-dir snapshots/shift-share-2026-10-18
          --eurostat-dir snapshots/eurostat-2026-10-15
          --output-dir results/shift-share
          --report results/shift-share/SHIFT_SHARE_FEASIBILITY.md
      - name: Committed shift-share tables reproduce on Linux
        working-directory: eu-okun-law
        run: poetry run pytest tests/test_shift_share.py -q
      - name: Archive source data and regression output
        uses: actions/upload-artifact@v4
        with:
          name: eu-okun-empirical-baselines
          path: |
            eu-okun-law/data/
            eu-okun-law/results/
          retention-days: 30
          if-no-files-found: error

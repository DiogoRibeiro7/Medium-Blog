name: Reproduce france-repeat-sales-floor

on:
  pull_request:
    paths:
      - 'france-repeat-sales-floor/**'
      - '.github/workflows/france-repeat-sales-floor.yml'
  push:
    branches:
      - main
    paths:
      - 'france-repeat-sales-floor/**'
      - '.github/workflows/france-repeat-sales-floor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: france-repeat-sales-floor
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: france-repeat-sales-floor/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest -q tests

      - name: Rerun the analysis
        run: python analysis.py > /dev/null

      - name: Check the numbers match the committed run
        run: git diff --exit-code -- results/summary.txt

      - name: Draw the figures
        run: |
          python figures.py
          for f in fig1_market fig2_near_zero fig3_scan fig4_market_state fig5_worlds; do
            test -s "figures/$f.png"
          done

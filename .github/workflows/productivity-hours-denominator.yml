name: Reproduce productivity-hours-denominator

on:
  pull_request:
    paths:
      - 'productivity-hours-denominator/**'
      - '.github/workflows/productivity-hours-denominator.yml'
  push:
    branches:
      - main
    paths:
      - 'productivity-hours-denominator/**'
      - '.github/workflows/productivity-hours-denominator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: productivity-hours-denominator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: productivity-hours-denominator/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test the methods on cases with a known answer
        run: python -m unittest discover -s tests -v

      - name: Download from Eurostat and compare with the snapshot
        run: python fetch_data.py

      - name: Rerun the analysis and compare with the committed output
        run: |
          python hours_numbers.py > "$RUNNER_TEMP/output.txt"
          if ! diff -u output.txt "$RUNNER_TEMP/output.txt" > "$RUNNER_TEMP/diff.txt"; then
            cat "$RUNNER_TEMP/diff.txt"
            echo "::error file=productivity-hours-denominator/output.txt::output of hours_numbers.py differs from the committed output.txt"
            exit 1
          fi

      - name: Check every figure is drawn
        run: |
          python figures.py
          for f in fig1_eu27_two_denominators fig2_eu27_hours_drift fig3_countries_2019_2025 fig4_workers_or_hours fig5_absence_or_hours_at_work fig6_country_panels; do
            test -s "figures/$f.png"
          done

name: Reproduce rare-flags

on:
  pull_request:
    paths:
      - 'rare-flags/**'
      - '.github/workflows/rare-flags.yml'
  push:
    branches:
      - main
    paths:
      - 'rare-flags/**'
      - '.github/workflows/rare-flags.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: rare-flags
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: rare-flags/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test the methods on cases with a known answer
        run: python -m unittest discover -s tests -v

      - name: Download both data sources and check them against the pinned digests
        run: python fetch_data.py

      - name: Rerun the analysis and compare with the committed output
        run: |
          python flag_numbers.py > "$RUNNER_TEMP/output.txt"
          if ! diff -u output.txt "$RUNNER_TEMP/output.txt" > "$RUNNER_TEMP/diff.txt"; then
            cat "$RUNNER_TEMP/diff.txt"
            echo "::error file=rare-flags/output.txt::output of flag_numbers.py differs from the committed output.txt"
            exit 1
          fi

      - name: Check every figure is drawn
        run: |
          python figures.py
          for f in fig1_detectors fig2_thousand_essays fig3_ppv_curves fig4_fraud fig5_required; do
            test -s "figures/$f.png"
          done

name: Reproduce suffrage-public-health

on:
  pull_request:
    paths:
      - 'suffrage-public-health/**'
      - '.github/workflows/suffrage-public-health.yml'
  push:
    branches:
      - main
    paths:
      - 'suffrage-public-health/**'
      - '.github/workflows/suffrage-public-health.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: suffrage-public-health
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: suffrage-public-health/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Download the pinned source files and check their SHA-256
        run: python fetch.py

      - name: Run the tests
        run: python -m pytest -q tests

      - name: Rerun the analysis on the committed data snapshot
        run: python suffrage.py > /dev/null

      - name: Check the numbers match the committed run
        run: git diff --exit-code -- results/summary.txt

      - name: Draw the figures
        run: |
          python figures.py
          for f in fig1_estimate_by_last_year fig2_gap_around_1920 fig3_estimators_by_age fig4_event_study_clean; do
            test -s "figures/$f.png"
          done

name: Porto metropolitan housing article reproducibility

on:
  pull_request:
    paths:
      - "urban-affordability-cascade/**"
      - ".github/workflows/urban-affordability-cascade.yml"
  push:
    branches: [main]
    paths:
      - "urban-affordability-cascade/**"
      - ".github/workflows/urban-affordability-cascade.yml"

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: urban-affordability-cascade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: urban-affordability-cascade/requirements.txt
      - name: Install pinned scientific packages
        run: python -m pip install -r requirements.txt
      - name: Verify 140 tests for sources, OD, timing, forecasts, income and rental alternatives
        run: python -m unittest discover -s tests -v
      - name: Generate original figures into a clean output folder
        run: python analysis.py --output /tmp/porto-housing-reproduction
      - name: Regenerate observed commuting network diagnostics
        run: python commuting_network.py --output /tmp/porto-commuting-reproduction
      - name: Regenerate Census residential origin diagnostics
        run: python residential_mobility.py --output /tmp/porto-residential-reproduction
      - name: Regenerate sharp residential origin-destination bounds
        run: python residential_identifiability.py --output /tmp/porto-residential-identifiability
      - name: Regenerate observed timing and rolling network prediction diagnostics
        run: python sequential_pressure.py --output /tmp/porto-sequential-prediction --shuffles 999
      - name: Regenerate forecast negative controls and influence diagnostics
        run: python forecast_robustness.py --output /tmp/porto-forecast-robustness
      - name: Revalidate frozen Eurostat annual HICP source snapshot
        run: python extract_hicp.py --output /tmp/porto-hicp-extract
      - name: Regenerate nominal and HICP-deflated housing comparisons
        run: python real_housing_pressure.py --output /tmp/porto-real-housing
      - name: Regenerate matched gross fiscal-income and new-rent proxy checks
        run: python fiscal_income_pressure.py --output /tmp/porto-fiscal-income
      - name: Regenerate Porto-relative rent discounts and hypothetical real euro gaps
        run: python porto_rent_options.py --output /tmp/porto-rent-options
      - name: Regenerate Porto-link rent-gradient and rank sensitivity diagnostics
        run: python porto_network_gradient.py --output /tmp/porto-network-gradient --shuffles 9999
      - name: Verify manuscript length and figure references
        run: |
          python -c "from pathlib import Path; a=Path('article.md').read_text(encoding='utf-8'); assert len(a.split()) >= 8000, 'Long-form article below 8000 words'; assert all(f'figures/fig{i}_' in a for i in range(1,26)), 'Missing figure references'"

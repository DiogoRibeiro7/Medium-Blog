name: Porto metropolitan housing article reproducibility

on:
  pull_request:
    paths:
      - "urban-affordability-cascade/**"
      - ".github/workflows/urban-affordability-cascade.yml"
  push:
    branches: [main]
    paths:
      - "urban-affordability-cascade/**"
      - ".github/workflows/urban-affordability-cascade.yml"

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: urban-affordability-cascade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: urban-affordability-cascade/requirements.txt
      - name: Install pinned scientific packages
        run: python -m pip install -r requirements.txt
      - name: Verify source integrity, identification boundaries and reproducibility tests
        run: python -m unittest discover -s tests -v
      - name: Generate original figures into a clean output folder
        run: python analysis.py --output /tmp/porto-housing-reproduction
      - name: Regenerate observed commuting network diagnostics
        run: python commuting_network.py --output /tmp/porto-commuting-reproduction
      - name: Regenerate Census residential origin diagnostics
        run: python residential_mobility.py --output /tmp/porto-residential-reproduction
      - name: Regenerate sharp residential origin-destination bounds
        run: python residential_identifiability.py --output /tmp/porto-residential-identifiability
      - name: Regenerate observed timing and rolling network prediction diagnostics
        run: python sequential_pressure.py --output /tmp/porto-sequential-prediction --shuffles 999
      - name: Regenerate forecast negative controls and influence diagnostics
        run: python forecast_robustness.py --output /tmp/porto-forecast-robustness
      - name: Revalidate frozen Eurostat annual HICP source snapshot
        run: python extract_hicp.py --output /tmp/porto-hicp-extract
      - name: Regenerate nominal and HICP-deflated housing comparisons
        run: python real_housing_pressure.py --output /tmp/porto-real-housing
      - name: Regenerate matched gross fiscal-income and new-rent proxy checks
        run: python fiscal_income_pressure.py --output /tmp/porto-fiscal-income
      - name: Regenerate Porto-relative rent discounts and hypothetical real euro gaps
        run: python porto_rent_options.py --output /tmp/porto-rent-options
      - name: Regenerate Porto-link rent-gradient and rank sensitivity diagnostics
        run: python porto_network_gradient.py --output /tmp/porto-network-gradient --shuffles 9999
      - name: Regenerate official CAOP geography and Porto-distance sensitivity diagnostics
        run: python porto_distance_sensitivity.py --output /tmp/porto-distance-sensitivity
      - name: Regenerate new-dwelling construction-flow and rent-pressure screens
        run: python porto_supply_screen.py --output /tmp/porto-supply-screen
      - name: Regenerate synthetic rent-vs-incremental-commute break-even scenarios
        run: python porto_commute_break_even.py --output /tmp/porto-commute-break-even
      - name: Regenerate municipal rent-versus-centroid-distance Pareto frontiers
        run: python porto_rent_distance_frontier.py --output /tmp/porto-rent-distance-frontier
      - name: Regenerate all-reference commuting-link negative controls
        run: python municipal_reference_placebos.py --output /tmp/porto-reference-placebos
      - name: Regenerate overlapping rent-window reference-node negative controls
        run: python municipal_reference_window_sensitivity.py --output /tmp/porto-reference-window
      - name: Regenerate reference-node centroid-distance rank conditioning and influence controls
        run: python municipal_reference_geography_controls.py --output /tmp/porto-reference-geo
      - name: Reproduce matched reference contrasts under identical geographic controls
        run: python municipal_reference_common_geography.py --output /tmp/porto-common-geography
      - name: Verify private-manuscript notice and public figure archive
        run: |
          python - <<'PY'
          from pathlib import Path

          notice: str = Path("article.md").read_text(encoding="utf-8")
          private_path: str = "research-articles-medium/blob/main/urban-affordability-cascade/article.md"
          assert private_path in notice, "Missing link to private manuscript"
          assert "not** the manuscript" in notice.lower(), "Missing compatibility-notice warning"
          assert len(notice.split()) < 200, "Public manuscript body was not removed"

          figure_paths: list[Path] = sorted(Path("figures").glob("fig[0-9]*_*.png"))
          assert len(figure_paths) == 41, "Public 41-figure archive is incomplete"
          figure_numbers: set[int] = {int(path.name.split("_", 1)[0][3:]) for path in figure_paths}
          assert figure_numbers == set(range(1, 42)), "Missing or duplicate figure numbers"
          for figure in figure_paths:
              with figure.open("rb") as stream:
                  assert stream.read(8) == b"\\x89PNG\\r\\n\\x1a\\n", f"Invalid PNG: {figure}"
          PY

name: Great Recession and unequal recovery article reproducibility

on:
  pull_request:
    paths:
      - "great-recession-unequal-recovery/**"
      - ".github/workflows/great-recession-unequal-recovery.yml"
  push:
    paths:
      - "great-recession-unequal-recovery/**"
      - ".github/workflows/great-recession-unequal-recovery.yml"

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: great-recession-unequal-recovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: great-recession-unequal-recovery/requirements.txt
      - name: Install pinned analytical dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit source snapshots and derived historical tables
        run: python prepare_data.py --check
      - name: Run source, model and publication tests
        run: python -m unittest discover -s tests -v
      - name: Regenerate all figures and result tables
        run: python analysis.py
      - name: Check exact output counts
        run: python -c "from pathlib import Path; assert len(list(Path('figures').glob('figure_*.png'))) == 8; assert len(list(Path('results').glob('*.csv'))) == 3"

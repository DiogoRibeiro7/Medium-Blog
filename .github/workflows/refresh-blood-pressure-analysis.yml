name: Refresh blood-pressure analysis

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-blood-pressure-analysis
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install blood-pressure project
        run: python -m pip install -e Blood_Pressure_Missingness

      - name: Run blood-pressure regression tests
        run: >-
          python -m unittest discover
          -s Blood_Pressure_Missingness/tests
          -p 'test_*.py'
          -v

      - name: Resolve blood-pressure worksheet
        working-directory: Blood_Pressure_Missingness
        env:
          BLOOD_PRESSURE_SHEET_URL: ${{ secrets.BLOOD_PRESSURE_SHEET_URL }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          BLOOD_PRESSURE_WORKSHEET: ${{ secrets.BLOOD_PRESSURE_WORKSHEET }}
        run: >-
          python -m blood_pressure_missingness.data_sources.worksheet_selection
          --github-env "$GITHUB_ENV"

      - name: Refresh privacy-safe aggregates from Google Sheets
        working-directory: Blood_Pressure_Missingness
        env:
          BLOOD_PRESSURE_SHEET_URL: ${{ secrets.BLOOD_PRESSURE_SHEET_URL }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: >-
          python -m blood_pressure_missingness.data_sources.google_sheets
          --data-dir data

      - name: Generate pulse-oximeter diagnostics
        working-directory: Blood_Pressure_Missingness
        env:
          BLOOD_PRESSURE_SHEET_URL: ${{ secrets.BLOOD_PRESSURE_SHEET_URL }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: >-
          python -m blood_pressure_missingness.analyses.pulse_oximeter
          --output data/pulse_oximeter_diagnostics.json
          --daily-output data/pulse_oximeter_daily_snapshot.csv

      - name: Generate pulse-oximeter longitudinal diagnostics
        working-directory: Blood_Pressure_Missingness
        run: >-
          python -m blood_pressure_missingness.analyses.pulse_oximeter_longitudinal
          --pulse-data data/pulse_oximeter_daily_snapshot.csv
          --bp-data data/analysis_snapshot.csv
          --output data/pulse_oximeter_longitudinal_diagnostics.json

      - name: Fit time-matched Fiães temperature covariate
        working-directory: Blood_Pressure_Missingness
        env:
          BLOOD_PRESSURE_SHEET_URL: ${{ secrets.BLOOD_PRESSURE_SHEET_URL }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: >-
          python -m blood_pressure_missingness.analyses.temperature
          --output figures/temperature_covariate.json

      - name: Run temperature-covariate sensitivity analysis
        working-directory: Blood_Pressure_Missingness
        env:
          BLOOD_PRESSURE_SHEET_URL: ${{ secrets.BLOOD_PRESSURE_SHEET_URL }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: >-
          python -m blood_pressure_missingness.analyses.temperature_sensitivity
          --output figures/temperature_covariate_sensitivity.json

      - name: Regenerate primary statistical outputs
        working-directory: Blood_Pressure_Missingness
        run: >-
          python -m blood_pressure_missingness.public_analysis
          --data data/analysis_snapshot.csv
          --audit data/source_audit.json
          --output-dir figures

      - name: Regenerate observation-process sensitivity outputs
        working-directory: Blood_Pressure_Missingness
        run: >-
          python -m blood_pressure_missingness.analyses.observation_process
          --data data/analysis_snapshot.csv
          --output-json figures/observation_process_sensitivity.json
          --output-figure figures/observation_process_sensitivity.svg

      - name: Regenerate gap-aware trend decomposition outputs
        working-directory: Blood_Pressure_Missingness
        run: >-
          python -m blood_pressure_missingness.analyses.gap_aware
          --data data/analysis_snapshot.csv
          --output-json figures/gap_aware_trend_decomposition.json
          --output-figure figures/gap_aware_trend_decomposition.svg

      - name: Regenerate day-level influence outputs
        working-directory: Blood_Pressure_Missingness
        run: >-
          python -m blood_pressure_missingness.analyses.day_influence
          --data data/analysis_snapshot.csv
          --output-json figures/day_influence_sensitivity.json
          --output-figure figures/day_influence_sensitivity.svg

      - name: Regenerate episode observation-sensitivity outputs
        working-directory: Blood_Pressure_Missingness
        run: >-
          python -m blood_pressure_missingness.analyses.episode_observation
          --data data/analysis_snapshot.csv
          --output-json figures/episode_observation_sensitivity.json
          --output-figure figures/episode_observation_sensitivity.svg

      - name: Regenerate episode time-form sensitivity outputs
        working-directory: Blood_Pressure_Missingness
        run: >-
          python -m blood_pressure_missingness.analyses.episode_time_form
          --data data/analysis_snapshot.csv
          --output-json figures/episode_time_form_sensitivity.json
          --output-figure figures/episode_time_form_sensitivity.svg

      - name: Regenerate temporal-dependence diagnostics
        working-directory: Blood_Pressure_Missingness
        run: >-
          python -m blood_pressure_missingness.analyses.temporal_dependence
          --data data/analysis_snapshot.csv
          --output-json figures/temporal_dependence_diagnostics.json

      - name: Validate current influence findings
        working-directory: Blood_Pressure_Missingness
        run: >-
          python -m blood_pressure_missingness.validation.current_influence
          --data data/analysis_snapshot.csv

      - name: Validate generated public artifact contracts
        run: >-
          python -m unittest discover
          -s Blood_Pressure_Missingness/tests
          -p 'test_*contract.py'
          -v

      - name: Validate that no raw source file was written
        run: |
          if find Blood_Pressure_Missingness -type f \( -name '*.xlsx' -o -name '*.xls' \) | grep -q .; then
            echo 'Raw spreadsheet found in repository workspace.' >&2
            exit 1
          fi

      - name: Detect public-output changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- \
            Blood_Pressure_Missingness/data/analysis_snapshot.csv \
            Blood_Pressure_Missingness/data/source_audit.json \
            Blood_Pressure_Missingness/data/pulse_oximeter_diagnostics.json \
            Blood_Pressure_Missingness/data/pulse_oximeter_daily_snapshot.csv \
            Blood_Pressure_Missingness/data/pulse_oximeter_longitudinal_diagnostics.json \
            Blood_Pressure_Missingness/figures)" ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update refresh pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch='automation/blood-pressure-refresh'
          title='Refresh blood-pressure aggregate analysis'
          body='Refreshes only privacy-safe aggregate data and derived statistical outputs from the secret-backed Google Sheet source. Pulse-oximeter coverage-aware longitudinal diagnostics and temperature matching are computed from privacy-safe aggregates or private measurements in memory; no raw health rows or calendar-dated joins are committed.'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add \
            Blood_Pressure_Missingness/data/analysis_snapshot.csv \
            Blood_Pressure_Missingness/data/source_audit.json \
            Blood_Pressure_Missingness/data/pulse_oximeter_diagnostics.json \
            Blood_Pressure_Missingness/data/pulse_oximeter_daily_snapshot.csv \
            Blood_Pressure_Missingness/data/pulse_oximeter_longitudinal_diagnostics.json \
            Blood_Pressure_Missingness/figures
          git commit -m 'Refresh blood-pressure aggregate analysis'
          git push --force origin HEAD:"$branch"

          pr_number="$(gh pr list \
            --state open \
            --base main \
            --head "$branch" \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --title "$title" --body "$body"
            echo "Updated existing refresh PR #$pr_number"
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "$title" \
              --body "$body"
          fi

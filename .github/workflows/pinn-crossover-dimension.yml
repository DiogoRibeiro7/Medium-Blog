name: Test pinn-crossover-dimension experiments

on:
  pull_request:
    paths:
      - 'pinn-crossover-dimension/**'
      - '.github/workflows/pinn-crossover-dimension.yml'
  push:
    branches:
      - main
    paths:
      - 'pinn-crossover-dimension/**'
      - '.github/workflows/pinn-crossover-dimension.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pinn-crossover-dimension
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pinn-crossover-dimension/pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke-run every experiment (quick mode)
        working-directory: pinn-crossover-dimension/experiments
        run: |
          python e1_convergence.py --quick
          python e2_grids_by_dimension.py --quick --dims 2 3
          python e4_dmc.py --quick
          python e3_pinn.py --quick --dims 2 3
          python summarize.py --quick
          python make_figures.py --quick

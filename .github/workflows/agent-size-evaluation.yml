name: Reproduce agent-size-evaluation

on:
  pull_request:
    paths:
      - 'agent-size-evaluation/**'
      - '.github/workflows/agent-size-evaluation.yml'
  push:
    branches:
      - main
    paths:
      - 'agent-size-evaluation/**'
      - '.github/workflows/agent-size-evaluation.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-size-evaluation
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: agent-size-evaluation/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Rerun the simulations
        run: python agent_size_evaluation.py > results/output.txt

      - name: Check the numbers match the committed run
        run: git diff --exit-code -- results/output.txt

      - name: Check every figure was drawn
        run: |
          for f in fig1_estimators fig2_allocation fig3_zero_failures fig4_ablation fig5_selection; do
            test -s "figures/$f.png"
          done

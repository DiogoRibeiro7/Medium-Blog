name: Reproduce bayes-problem-first

on:
  pull_request:
    paths:
      - 'bayes-problem-first/**'
      - '.github/workflows/bayes-problem-first.yml'
  push:
    branches:
      - main
    paths:
      - 'bayes-problem-first/**'
      - '.github/workflows/bayes-problem-first.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: bayes-problem-first
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: bayes-problem-first/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Download the O-ring data at the pinned commit and check its digest
        run: python fetch_data.py

      - name: Test the methods on cases with a known answer
        run: python -m unittest discover -s tests -v

      - name: Rerun the analysis and compare with the committed output
        run: |
          python bayes_numbers.py > "$RUNNER_TEMP/output.txt"
          if ! diff -u output.txt "$RUNNER_TEMP/output.txt" > "$RUNNER_TEMP/diff.txt"; then
            cat "$RUNNER_TEMP/diff.txt"
            echo "::error file=bayes-problem-first/output.txt::output of bayes_numbers.py differs from the committed output.txt"
            exit 1
          fi

      - name: Check every figure is drawn
        run: |
          python figures.py
          for f in fig1_prior_posterior fig2_accumulation fig3_prior_sensitivity fig4_oring_prior_predictive fig5_oring_posterior fig6_calibration; do
            test -s "figures/$f.png"
          done

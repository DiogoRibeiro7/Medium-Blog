name: Reproduce org-chart-task-fit

on:
  pull_request:
    paths:
      - 'org-chart-task-fit/**'
      - '.github/workflows/org-chart-task-fit.yml'
  push:
    branches:
      - main
    paths:
      - 'org-chart-task-fit/**'
      - '.github/workflows/org-chart-task-fit.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: org-chart-task-fit
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: org-chart-task-fit/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Rebuild the tables from the pinned MAST and GSM-Plus commits
        run: python fetch_traces.py --check

      - name: Rerun the analysis
        run: python org_task_fit.py > results/output.txt

      - name: Check the numbers match the committed run
        run: git diff --exit-code -- results/output.txt

      - name: Check every figure was drawn
        run: |
          for f in fig1_chatdev_two_tasks fig2_ag2_by_type fig3_ag2_paired; do
            test -s "figures/$f.png"
          done

name: Test europe-industrial-regions

on:
  pull_request:
    paths:
      - 'europe-industrial-regions/**'
      - 'data_sources/roses-wolf-regional-gdp-v7.json'
      - '.github/workflows/europe-industrial-regions.yml'
  push:
    branches:
      - main
    paths:
      - 'europe-industrial-regions/**'
      - 'data_sources/roses-wolf-regional-gdp-v7.json'
      - '.github/workflows/europe-industrial-regions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: europe-industrial-regions
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: europe-industrial-regions/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      # The Rosés-Wolf files cannot be downloaded automatically (the host refuses it), so CI
      # checks the estimators on synthetic maps; the data tests skip without the files.
      - name: Run the tests
        run: python -m pytest -q tests

      - name: Check that the analysis refuses to run without the registered files
        run: |
          if python check_data.py; then exit 1; fi
          if python regions.py; then exit 1; fi

name: Reproduce food-vat-shares

on:
  pull_request:
    paths:
      - 'food-vat-shares/**'
      - 'data_sources/eurostat-food-vat-incidence.json'
      - '.github/workflows/food-vat-shares.yml'
  push:
    branches:
      - main
    paths:
      - 'food-vat-shares/**'
      - 'data_sources/eurostat-food-vat-incidence.json'
      - '.github/workflows/food-vat-shares.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      # One BLAS thread, so floating-point reductions run in a fixed order.
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: food-vat-shares
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: food-vat-shares/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test the core functions
        run: python -m unittest discover -s tests -v

      - name: Fetch the registry snapshot
        run: python fetch.py

      - name: Rerun the analysis and compare with the committed output
        run: |
          python vat_numbers.py > "$RUNNER_TEMP/output.txt"
          if ! diff -u output.txt "$RUNNER_TEMP/output.txt" > "$RUNNER_TEMP/diff.txt"; then
            cat "$RUNNER_TEMP/diff.txt"
            echo "::error file=food-vat-shares/output.txt::output of vat_numbers.py differs from the committed output.txt"
            exit 1
          fi

      - name: Check every figure is drawn
        run: |
          python figures.py
          for f in fig1_food_shares fig2_euros_and_shares fig3_where_the_money_goes fig4_portugal_three_yardsticks fig5_who_is_rich; do
            test -s "figures/$f.png"
          done

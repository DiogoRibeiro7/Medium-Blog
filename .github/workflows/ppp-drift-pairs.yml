name: Reproduce ppp-drift-pairs

on:
  pull_request:
    paths:
      - 'ppp-drift-pairs/**'
      - '.github/workflows/ppp-drift-pairs.yml'
  push:
    branches:
      - main
    paths:
      - 'ppp-drift-pairs/**'
      - '.github/workflows/ppp-drift-pairs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ppp-drift-pairs
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ppp-drift-pairs/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest -q tests

      - name: Rerun the analysis
        run: python analysis.py > /dev/null

      - name: Check the numbers match the committed run
        run: git diff --exit-code -- results/analysis_summary.txt

      - name: Draw the figures
        run: |
          python figures.py
          for f in fig1_pair_matrix fig2_drift_by_group_and_price_level fig3_construction_signature \
                   fig4_group_gap_over_time; do
            test -s "figures/$f.png"
          done

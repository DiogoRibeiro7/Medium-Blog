name: Reproduce coach-change-decision

on:
  pull_request:
    paths:
      - 'coach-change-decision/**'
      - '.github/workflows/coach-change-decision.yml'
  push:
    branches:
      - main
    paths:
      - 'coach-change-decision/**'
      - '.github/workflows/coach-change-decision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      # One BLAS thread, so floating-point reductions run in a fixed order.
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: coach-change-decision
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: coach-change-decision/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test the design on synthetic leagues
        run: python -m unittest discover -s tests -v

      - name: Rebuild the committed tables from the pinned sources
        # the transfermarkt files live on the project's own host; if it is down or the files are
        # replaced, this step warns instead of blocking: the analysis reads the committed tables
        continue-on-error: true
        run: |
          python fetch_data.py
          python build_panel.py
          git diff --exit-code -- data

      - name: Rerun the analysis and compare with the committed output
        run: |
          python coach_numbers.py > "$RUNNER_TEMP/output.txt"
          if ! diff -u output.txt "$RUNNER_TEMP/output.txt" > "$RUNNER_TEMP/diff.txt"; then
            cat "$RUNNER_TEMP/diff.txt"
            echo "::error file=coach-change-decision/output.txt::output of coach_numbers.py differs from the committed output.txt"
            exit 1
          fi

      - name: Check every figure is drawn
        run: |
          python figures.py
          for f in fig1_the_bounce fig2_the_shared_bounce fig3_who_gets_changed fig4_three_yardsticks fig5_where_it_differs fig6_checks; do
            test -s "figures/$f.png"
          done

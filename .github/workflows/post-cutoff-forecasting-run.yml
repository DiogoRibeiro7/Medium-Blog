name: Post-cutoff forecasting run

# Downloads the load series and the three models, runs the full experiment on CPU and
# opens a pull request with the snapshot, the scores, the tables and the figures.
# Full quantile forecasts are attached to the run as an artifact.

on:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Download a fresh snapshot from Energy-Charts (otherwise use the committed one)"
        type: boolean
        default: true
      force:
        description: "Recompute every forecast"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: post-cutoff-forecasting-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: post-cutoff-forecasting

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyTorch (CPU build)
        run: python -m pip install "torch==2.14.1" --index-url https://download.pytorch.org/whl/cpu

      - name: Install project with the model packages
        # The constraint keeps the CPU build of torch installed above.
        run: |
          echo "torch==2.14.1" > "$RUNNER_TEMP/constraints.txt"
          python -m pip install -e ".[models,dev]" -c "$RUNNER_TEMP/constraints.txt"
          python -c "import torch; assert '+cpu' in torch.__version__, torch.__version__; print('torch', torch.__version__)"

      - name: Use a Hugging Face token if one is configured
        env:
          HF_TOKEN_SECRET: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN_SECRET" ]; then
            echo "HF_TOKEN=$HF_TOKEN_SECRET" >> "$GITHUB_ENV"
            echo "Using the HF_TOKEN secret."
          else
            echo "No HF_TOKEN secret; downloading models anonymously."
          fi

      - name: Download the load series
        if: ${{ inputs.refresh_data }}
        run: postcutoff fetch

      - name: Validate the snapshot
        run: postcutoff validate-data

      - name: Smoke test every model on three origins
        run: postcutoff smoke

      - name: Run the experiment
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            postcutoff run --force
          else
            postcutoff run
          fi

      - name: Tables, figures and consistency checks
        run: |
          postcutoff summarize
          postcutoff figures
          postcutoff check

      - name: Record the exact environment
        run: python -m pip freeze --exclude-editable > results/pip-freeze.txt

      - name: Keep the full forecasts as an artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: post-cutoff-forecasts-${{ github.run_id }}
          path: post-cutoff-forecasting/forecasts/
          retention-days: 90
          if-no-files-found: ignore

      - name: Open or update the results pull request
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          paths="post-cutoff-forecasting/data post-cutoff-forecasting/results post-cutoff-forecasting/figures"
          if [ -z "$(git status --porcelain --untracked-files=all -- $paths)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          branch='automation/post-cutoff-forecasting-run'
          title='Post-cutoff forecasting: results of run ${{ github.run_id }}'
          body='Snapshot, scores, tables and figures from workflow run ${{ github.run_id }}. Full forecasts are in that run'"'"'s artifacts.'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add $paths
          git commit -m "Post-cutoff forecasting results (run ${{ github.run_id }})"
          git push --force origin HEAD:"$branch"
          base='${{ github.ref_name }}'
          pr_number="$(gh pr list --state open --base "$base" --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$title" --body "$body"
          else
            gh pr create --base "$base" --head "$branch" --title "$title" --body "$body"
          fi

name: One-time Online Retail II consumer migration

on:
  push:
    branches:
      - chore/migrate-online-retail-consumers
    paths:
      - ".github/workflows/migrate-online-retail-consumers.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v7
        with:
          ref: chore/migrate-online-retail-consumers
          fetch-depth: 0
          lfs: false

      - name: Migrate large segmentation notebook
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("customer_segmentation/customer segmentation.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))

          old = "tx_data = pd.read_csv('customer_segmentation.csv', encoding='cp1252')"
          replacement = [
              "from pathlib import Path\n",
              "import subprocess\n",
              "import sys\n",
              "\n",
              'retail_file = Path("../.cache/online-retail-ii/online_retail_II.xlsx")\n',
              'subprocess.run([sys.executable, "../scripts/fetch_online_retail_ii.py", "--output", str(retail_file)], check=True)\n',
              'tx_data = pd.read_excel(retail_file, sheet_name="Year 2010-2011")\n',
              'tx_data = tx_data.rename(columns={"Invoice": "InvoiceNo", "Price": "UnitPrice", "Customer ID": "CustomerID"})',
          ]

          replaced = False
          for cell in notebook.get("cells", []):
              if cell.get("cell_type") != "code":
                  continue
              source = cell.get("source", [])
              text = "".join(source)
              if old in text:
                  cell["source"] = replacement
                  replaced = True
                  break

          if not replaced:
              raise SystemExit("segmentation notebook CSV read was not found")

          path.write_text(
              json.dumps(notebook, ensure_ascii=False, indent=1) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Remove obsolete duplicated retail data
        run: |
          rm -f             "customer_life_value/Year 2009-2010.csv"             "customer_life_value/Year 2010-2011.csv"             "customer_life_value/data.csv"             "customer_life_value/online_retail_II.xlsx"             "customer_segmentation/customer_segmentation.csv"             "R_code/customer_segmentation/data.csv"

      - name: Validate migration
        run: python scripts/validate_online_retail_consumers.py

      - name: Commit migration and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail

          rm -f .github/workflows/migrate-online-retail-consumers.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "data: migrate retail consumers to canonical registry snapshot"
          git push origin HEAD:chore/migrate-online-retail-consumers

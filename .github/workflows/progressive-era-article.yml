name: Progressive Era article reproducibility

on:
  pull_request:
    paths:
      - "progressive-era-reform-gap/**"
      - ".github/workflows/progressive-era-article.yml"
  push:
    paths:
      - "progressive-era-reform-gap/**"
      - ".github/workflows/progressive-era-article.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: progressive-era-reform-gap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: progressive-era-reform-gap/requirements.txt
      - name: Install numeric dependencies
        run: python -m pip install -r requirements.txt
      - name: Run historical transcription and mathematical contract tests
        run: python -m unittest discover -s tests -v
      - name: Regenerate all figures and tables from local data
        run: python analysis.py
      - name: Check output count
        run: python -c "from pathlib import Path; assert len(list(Path('figures').glob('figure_*.png'))) == 8; assert len(list(Path('results').glob('*.csv'))) == 3"

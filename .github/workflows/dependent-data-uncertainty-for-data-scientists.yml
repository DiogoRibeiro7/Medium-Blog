name: Dependent data article evidence

on:
  pull_request:
    paths:
      - "dependent-data-uncertainty-for-data-scientists/**"
      - ".github/workflows/dependent-data-uncertainty-for-data-scientists.yml"
  push:
    branches: [main]
    paths:
      - "dependent-data-uncertainty-for-data-scientists/**"
      - ".github/workflows/dependent-data-uncertainty-for-data-scientists.yml"

jobs:
  verify-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dependent-data-uncertainty-for-data-scientists
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dependent-data-uncertainty-for-data-scientists/requirements.txt
      - name: Install reproducibility dependencies
        run: python -m pip install -r requirements.txt
      - name: Mathematical tests and executable notebook
        run: python -m unittest discover -s tests -v
      - name: Reproduce the quick simulation
        run: python analysis.py --quick

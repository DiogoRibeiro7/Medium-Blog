name: Reproduce hotel-cancellation-replay

# Runs the unit tests, verifies the committed data against its published
# checksum, replays every system variant and checks that the numbers match the
# committed run.

on:
  pull_request:
    paths:
      - 'hotel-cancellation-replay/**'
      - '.github/workflows/hotel-cancellation-replay.yml'
  push:
    branches:
      - main
    paths:
      - 'hotel-cancellation-replay/**'
      - '.github/workflows/hotel-cancellation-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: hotel-cancellation-replay
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: hotel-cancellation-replay/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Check the committed data against the source checksum
        run: python -m cancelreplay check

      - name: Replay every variant
        run: python -m cancelreplay run

      - name: Check the numbers match the committed run
        run: git diff --exit-code -- results/summary.txt

      - name: Keep the figures from this run
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hotel-cancellation-replay-figures-${{ github.run_id }}
          path: hotel-cancellation-replay/figures/
          retention-days: 14
          if-no-files-found: ignore

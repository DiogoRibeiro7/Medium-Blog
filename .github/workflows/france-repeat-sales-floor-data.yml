name: Run france-repeat-sales-floor on the DVF files

on:
  push:
    branches:
      - france-repeat-sales-floor
    paths:
      - 'france-repeat-sales-floor/fetch.py'
      - 'france-repeat-sales-floor/build.py'
      - '.github/workflows/france-repeat-sales-floor-data.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: france-repeat-sales-floor-data
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: france-repeat-sales-floor
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: france-repeat-sales-floor/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Disk, memory and processors available
        run: df -h . "$RUNNER_TEMP" && free -g && nproc

      - name: Download French CPI and the geolocated DVF files (not committed)
        run: python fetch.py --out data --dvf "$RUNNER_TEMP/dvf"

      - name: Build the repeat-sale aggregates (committed) from the sales (not committed)
        run: |
          mkdir -p "$RUNNER_TEMP/duck"
          python build.py --dvf "$RUNNER_TEMP/dvf" --cpi data/fr_cpi_monthly.csv --out data \
            --memory-limit 12GB --temp "$RUNNER_TEMP/duck"
          rm -rf "$RUNNER_TEMP/dvf" "$RUNNER_TEMP/duck"
          cat data/build_log.txt

      - name: Summary and figures from the aggregates
        continue-on-error: true
        run: |
          if [ -f analysis.py ]; then python analysis.py > /dev/null; fi
          if [ -f figures.py ]; then python figures.py; fi

      - name: Keep the aggregates as a run artifact (no transactions in them)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: france-repeat-sales-floor-results
          path: |
            france-repeat-sales-floor/data
            france-repeat-sales-floor/results
          retention-days: 14

      - name: Commit the aggregates, results and figures if they changed
        if: always()
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          for d in data results figures; do if [ -d "$d" ]; then git add "$d"; fi; done
          if git diff --cached --quiet; then
            echo "Nothing changed; nothing to commit."
          else
            git commit -m "france-repeat-sales-floor: aggregates from the DVF files ($(date -u +%Y-%m-%d))"
            git push
          fi

name: Reproduce fixed-or-variable

on:
  pull_request:
    paths:
      - 'fixed-or-variable/**'
      - '.github/workflows/fixed-or-variable.yml'
  push:
    branches:
      - main
    paths:
      - 'fixed-or-variable/**'
      - '.github/workflows/fixed-or-variable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: fixed-or-variable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: fixed-or-variable/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test the methods on cases with a known answer
        run: python -m unittest discover -s tests -v

      - name: Download Euribor, check it against the pinned digest, and compare the snapshot with Eurostat
        run: python fetch_data.py

      - name: Rerun the analysis and compare with the committed output
        run: |
          python mortgage_numbers.py > "$RUNNER_TEMP/output.txt"
          if ! diff -u output.txt "$RUNNER_TEMP/output.txt" > "$RUNNER_TEMP/diff.txt"; then
            cat "$RUNNER_TEMP/diff.txt"
            echo "::error file=fixed-or-variable/output.txt::output of mortgage_numbers.py differs from the committed output.txt"
            exit 1
          fi

      - name: Check every figure is drawn
        run: |
          python figures.py
          for f in fig1_rates fig2_cost fig3_forecast fig4_paths fig5_premium_payout fig6_new_loan; do
            test -s "figures/$f.png"
          done

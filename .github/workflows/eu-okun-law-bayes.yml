name: EU Okun hierarchical Bayes

# Expensive MCMC sampling, kept out of the ordinary pull-request checks. It runs only
# when started by hand or when a pull request touching the study is labelled
# `bayesian-sampling`.
on:
  workflow_dispatch:
    inputs:
      specs:
        description: "Comma-separated specification names, or 'all'"
        default: all
  pull_request:
    types: [labeled]
    paths:
      - "eu-okun-law/**"
      - ".github/workflows/eu-okun-law-bayes.yml"

permissions:
  contents: read

jobs:
  sample:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'bayesian-sampling'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Install locked study environment (project-local .venv)
        working-directory: eu-okun-law
        run: |
          poetry check --lock
          poetry install --no-interaction --extras "bayes report"
      - name: Fit the registered specifications on the frozen snapshot
        working-directory: eu-okun-law
        env:
          SPECS: ${{ github.event.inputs.specs || 'all' }}
        # Each fit also writes posterior.nc (ArviZ NetCDF: posterior, sample_stats, prior,
        # prior_predictive, observed/constant data, log_likelihood).
        run: >-
          poetry run eu-okun bayes-fit --data-dir snapshots/eurostat-2026-10-15
          --output-dir results/bayes --specs "$SPECS" --retry-warmup 3000
      - name: Report from the posterior draws
        working-directory: eu-okun-law
        run: >-
          poetry run eu-okun bayes-report --fits-dir results/bayes
          --output-dir results/bayes-report --data-dir snapshots/eurostat-2026-10-15
      - name: Posterior recovery on synthetic data (amendment 1)
        working-directory: eu-okun-law
        run: >-
          poetry run eu-okun bayes-recovery --data-dir snapshots/eurostat-2026-10-15
          --output-dir results/bayes-recovery
      - name: Quarter effects, LOO, prior predictive and recovery report
        if: ${{ (github.event.inputs.specs || 'all') == 'all' }}
        working-directory: eu-okun-law
        run: >-
          poetry run eu-okun bayes-checks --fits-dir results/bayes
          --data-dir snapshots/eurostat-2026-10-15 --output-dir results/bayes-checks
          --recovery-dir results/bayes-recovery
      - name: Robustness of country differences and ranks (amendment 2)
        if: ${{ (github.event.inputs.specs || 'all') == 'all' }}
        working-directory: eu-okun-law
        run: >-
          poetry run eu-okun bayes-robustness --fits-dir results/bayes
          --output-dir results/bayes-robustness --pairs-csv docs/review/pairs_review.csv
      - name: Dynamics that address the misfits (amendment 3)
        if: >-
          ${{ (github.event.inputs.specs || 'all') == 'all'
          || contains(github.event.inputs.specs, 'ardl_dynamic_factor') }}
        working-directory: eu-okun-law
        run: >-
          poetry run eu-okun bayes-dynamics --fits-dir results/bayes
          --data-dir snapshots/eurostat-2026-10-15 --output-dir results/bayes-dynamics
      - name: Archive posterior draws, NetCDF artifacts, diagnostics and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-okun-hierarchical-bayes
          path: |
            eu-okun-law/results/bayes/
            eu-okun-law/results/bayes-first-attempt/
            eu-okun-law/results/bayes-report/
            eu-okun-law/results/bayes-recovery/
            eu-okun-law/results/bayes-checks/
            eu-okun-law/results/bayes-robustness/
            eu-okun-law/results/bayes-dynamics/
          retention-days: 30
          if-no-files-found: error
      # The report tables alone (small), for comparing runs without the posterior draws.
      - name: Archive the report tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-okun-bayes-reports
          path: |
            eu-okun-law/results/bayes-report/
            eu-okun-law/results/bayes-checks/
            eu-okun-law/results/bayes-robustness/
            eu-okun-law/results/bayes-dynamics/
          retention-days: 30
          if-no-files-found: warn

name: Reproduce prescribing-individuals

# Runs the unit tests and recomputes every number and figure from the committed
# data extracts (no downloads), then checks the numbers match the committed run.

on:
  pull_request:
    paths:
      - 'prescribing-individuals/**'
      - '.github/workflows/prescribing-individuals.yml'
  push:
    branches:
      - main
    paths:
      - 'prescribing-individuals/**'
      - '.github/workflows/prescribing-individuals.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prescribing-individuals
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: prescribing-individuals/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Recompute from the committed extracts
        run: python -m prescribing analyse

      - name: Check the numbers match the committed run
        run: git diff --exit-code -- results/summary.txt

name: Repository artifact hygiene

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-tracked-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Test the artifact classification rules
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Check tracked files for disposable artifacts
        run: python scripts/check_tracked_artifacts.py

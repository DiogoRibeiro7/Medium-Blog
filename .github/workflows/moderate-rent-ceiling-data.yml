name: Refresh moderate-rent-ceiling data

on:
  push:
    branches:
      - moderate-rent-ceiling
    paths:
      - 'moderate-rent-ceiling/fetch.py'
      - '.github/workflows/moderate-rent-ceiling-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: moderate-rent-ceiling
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: moderate-rent-ceiling/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Check that INE answers from the runner
        id: probe
        run: |
          url='https://www.ine.pt/ine/json_indicador/pindica.jsp?op=2&varcd=0014711&Dim1=S7A2025&Dim2=PT&lang=PT'
          for i in 1 2 3; do
            if [ "$(curl -sS -m 60 -o /dev/null -w '%{http_code}' "$url" || true)" = "200" ]; then
              echo "up=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 30
          done
          echo "up=false" >> "$GITHUB_OUTPUT"
          echo "::warning::INE did not answer from the runner; the committed snapshot was kept. Run this workflow again later."

      - name: Download the INE series
        id: fetch
        if: steps.probe.outputs.up == 'true'
        continue-on-error: true
        run: python fetch.py --out data

      - name: Commit the snapshot and its log if every request succeeded
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add data
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "Refresh INE snapshot for moderate-rent-ceiling ($(date -u +%Y-%m-%d))"
            # Other folders show line-ending changes right after checkout, so no rebase here: if the
            # branch moved during the run, the push is rejected and the workflow can be run again.
            git push || { echo "::error::The branch moved during the run; run this workflow again."; exit 1; }
          fi

      - name: Fail if any request failed
        if: steps.fetch.outcome == 'failure'
        run: |
          cat data/fetch_log.txt || true
          exit 1

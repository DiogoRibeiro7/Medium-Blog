name: Refresh moderate-rent-ceiling data

on:
  push:
    branches:
      - moderate-rent-ceiling
    paths:
      - 'moderate-rent-ceiling/fetch.py'
      - '.github/workflows/moderate-rent-ceiling-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: moderate-rent-ceiling
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: moderate-rent-ceiling/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Download the INE series
        id: fetch
        continue-on-error: true
        run: python fetch.py --out data

      - name: Commit the snapshot and its log if every request succeeded
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add data
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "Refresh INE snapshot for moderate-rent-ceiling ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Fail if any request failed
        if: steps.fetch.outcome == 'failure'
        run: |
          cat data/fetch_log.txt || true
          exit 1

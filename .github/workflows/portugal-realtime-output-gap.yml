name: Reproduce portugal-realtime-output-gap

on:
  pull_request:
    paths:
      - 'portugal-realtime-output-gap/**'
      - 'data_sources/ec-ameco-autumn-2026.json'
      - 'data_sources/ec-ameco-vintages-2011-2021.json'
      - '.github/workflows/portugal-realtime-output-gap.yml'
  push:
    branches:
      - main
    paths:
      - 'portugal-realtime-output-gap/**'
      - 'data_sources/ec-ameco-autumn-2026.json'
      - 'data_sources/ec-ameco-vintages-2011-2021.json'
      - '.github/workflows/portugal-realtime-output-gap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: portugal-realtime-output-gap
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: portugal-realtime-output-gap/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Cache the AMECO releases
        uses: actions/cache@v4
        with:
          path: portugal-realtime-output-gap/raw
          key: ameco-${{ hashFiles('data_sources/ec-ameco-autumn-2026.json', 'data_sources/ec-ameco-vintages-2011-2021.json') }}

      - name: Download the AMECO releases and check them against the pinned digests
        run: python fetch_data.py

      - name: Rebuild the vintage panel and Portugal's series
        run: python build_data.py

      - name: Test the reader, the revision statistics and the rules
        run: python -m unittest discover -s tests -v

      - name: Rerun the analysis and compare with the committed summary
        run: |
          cp results/summary.txt "$RUNNER_TEMP/summary.txt"
          python run_analysis.py > /dev/null
          if ! diff -u "$RUNNER_TEMP/summary.txt" results/summary.txt > "$RUNNER_TEMP/diff.txt"; then
            cat "$RUNNER_TEMP/diff.txt"
            echo "::error file=portugal-realtime-output-gap/results/summary.txt::run_analysis.py output differs from the committed summary.txt"
            exit 1
          fi

      - name: Check every figure is drawn
        run: |
          for f in fig1_portugal_vintages fig2_errors_by_age fig3_compression fig4_effort_verdicts fig5_rules_by_measurement fig6_unknown_bias; do
            test -s "figures/$f.png"
          done

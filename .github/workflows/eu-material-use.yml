name: Reproduce eu-material-use

on:
  pull_request:
    paths:
      - 'eu-material-use/**'
      - 'data_sources/eurostat-material-use.json'
      - '.github/workflows/eu-material-use.yml'
  push:
    branches:
      - main
    paths:
      - 'eu-material-use/**'
      - 'data_sources/eurostat-material-use.json'
      - '.github/workflows/eu-material-use.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      # One BLAS thread, so floating-point reductions run in a fixed order.
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: eu-material-use
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: eu-material-use/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test the core functions
        run: python -m unittest discover -s tests -v

      - name: Fetch the registry snapshot
        run: python fetch.py

      - name: Rerun the analysis and compare with the committed output
        run: |
          python materials_numbers.py > "$RUNNER_TEMP/output.txt"
          if ! diff -u output.txt "$RUNNER_TEMP/output.txt" > "$RUNNER_TEMP/diff.txt"; then
            cat "$RUNNER_TEMP/diff.txt"
            echo "::error file=eu-material-use/output.txt::output of materials_numbers.py differs from the committed output.txt"
            exit 1
          fi

      - name: Check every figure is drawn
        run: |
          python figures.py
          for f in fig1_index fig2_drift fig3_footprint fig4_fates fig5_targets; do
            test -s "figures/$f.png"
          done

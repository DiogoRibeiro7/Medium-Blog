name: Validation article reproducibility

on:
  pull_request:
    paths:
      - 'the-test-set-is-not-an-oracle/**'
      - '.github/workflows/the-test-set-is-not-an-oracle.yml'
  push:
    branches:
      - main
    paths:
      - 'the-test-set-is-not-an-oracle/**'
      - '.github/workflows/the-test-set-is-not-an-oracle.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: the-test-set-is-not-an-oracle
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/mpl-validation-ci
      RUN_NOTEBOOK_EXECUTION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: the-test-set-is-not-an-oracle/requirements.txt
      - name: Install scientific and notebook dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate source contracts, evidence, and fresh notebooks
        run: python -m unittest discover -s tests -v
      - name: Regenerate isolated quick evidence
        run: python analysis.py --quick

name: Reproduce ranking-extremes

on:
  pull_request:
    paths:
      - 'ranking-extremes/**'
      - '.github/workflows/ranking-extremes.yml'
  push:
    branches:
      - main
    paths:
      - 'ranking-extremes/**'
      - '.github/workflows/ranking-extremes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: ranking-extremes
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ranking-extremes/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test the methods and the snapshot digest
        run: python -m unittest discover -s tests -v

      - name: Download the OECD table and check it against the pinned digest
        run: python fetch_data.py

      - name: Rerun the analysis and compare with the committed output
        run: |
          python ranking_numbers.py > "$RUNNER_TEMP/output.txt"
          if ! diff -u output.txt "$RUNNER_TEMP/output.txt" > "$RUNNER_TEMP/diff.txt"; then
            cat "$RUNNER_TEMP/diff.txt"
            echo "::error file=ranking-extremes/output.txt::output of ranking_numbers.py differs from the committed output.txt"
            exit 1
          fi

      - name: Check every figure is drawn
        run: |
          python figures.py
          for f in fig1_funnel fig2_shrinkage fig3_rank_intervals fig4_extremes_simulation fig5_oecd; do
            test -s "figures/$f.png"
          done

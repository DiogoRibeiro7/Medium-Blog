name: Test routing-on-real-roads

on:
  pull_request:
    paths:
      - 'routing-on-real-roads/**'
      - '.github/workflows/routing-on-real-roads.yml'
  push:
    branches:
      - main
    paths:
      - 'routing-on-real-roads/**'
      - '.github/workflows/routing-on-real-roads.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: routing-on-real-roads
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: routing-on-real-roads/pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint and type-check
        run: |
          ruff check src tests
          mypy src

      # The pinned extract is not in the repository; the tests run offline from the
      # committed derived tables (data/derived) and check their provenance.
      - name: Run tests
        run: python -m pytest -q

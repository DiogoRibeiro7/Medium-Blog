name: Reproduce portugal-labour-share

on:
  pull_request:
    paths:
      - 'portugal-labour-share/**'
      - '.github/workflows/portugal-labour-share.yml'
  push:
    branches:
      - main
    paths:
      - 'portugal-labour-share/**'
      - '.github/workflows/portugal-labour-share.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portugal-labour-share
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: portugal-labour-share/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest -q tests

      - name: Rerun the analysis on the committed snapshot
        run: python labour_share.py > /dev/null

      - name: Check the numbers match the committed run
        run: git diff --exit-code -- results/summary.txt

      - name: Draw the figures
        run: |
          python figures.py
          for f in fig1_labour_share_definitions fig2_break_even_fraction fig3_government_2012 fig4_break_scan; do
            test -s "figures/$f.png"
          done

  live-eurostat:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portugal-labour-share
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: portugal-labour-share/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Download the current Eurostat vintage and report revisions against the snapshot
        run: python fetch.py --out live --compare

      - name: Rerun the analysis on the current vintage
        run: |
          cp live/*.csv data/
          python labour_share.py > /dev/null
          git diff --stat -- results/summary.txt
          git diff -- results/summary.txt || true

      - name: Keep the current vintage
        uses: actions/upload-artifact@v4
        with:
          name: portugal-labour-share-live
          path: |
            portugal-labour-share/live/
            portugal-labour-share/results/
          retention-days: 30

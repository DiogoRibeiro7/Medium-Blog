name: Test blood-pressure analysis

on:
  pull_request:
    paths:
      - 'Blood_Pressure_Missingness/README.md'
      - 'Blood_Pressure_Missingness/blood-pressure-missingness.ipynb'
      - 'Blood_Pressure_Missingness/refresh_from_google_sheets.py'
      - 'Blood_Pressure_Missingness/observation_process_sensitivity.py'
      - 'Blood_Pressure_Missingness/gap_aware_trend_decomposition.py'
      - 'Blood_Pressure_Missingness/day_influence_sensitivity.py'
      - 'Blood_Pressure_Missingness/episode_observation_sensitivity.py'
      - 'Blood_Pressure_Missingness/episode_time_form_sensitivity.py'
      - 'Blood_Pressure_Missingness/temporal_dependence_diagnostics.py'
      - 'Blood_Pressure_Missingness/validate_current_influence_findings.py'
      - 'Blood_Pressure_Missingness/validate_current_narrative.py'
      - 'Blood_Pressure_Missingness/data/analysis_snapshot.csv'
      - 'Blood_Pressure_Missingness/data/source_audit.json'
      - 'Blood_Pressure_Missingness/tests/**'
      - 'Blood_Pressure_Missingness/requirements.txt'
      - '.github/workflows/refresh-blood-pressure-analysis.yml'
      - '.github/workflows/test-blood-pressure-analysis.yml'
  push:
    branches:
      - main
    paths:
      - 'Blood_Pressure_Missingness/README.md'
      - 'Blood_Pressure_Missingness/blood-pressure-missingness.ipynb'
      - 'Blood_Pressure_Missingness/refresh_from_google_sheets.py'
      - 'Blood_Pressure_Missingness/observation_process_sensitivity.py'
      - 'Blood_Pressure_Missingness/gap_aware_trend_decomposition.py'
      - 'Blood_Pressure_Missingness/day_influence_sensitivity.py'
      - 'Blood_Pressure_Missingness/episode_observation_sensitivity.py'
      - 'Blood_Pressure_Missingness/episode_time_form_sensitivity.py'
      - 'Blood_Pressure_Missingness/temporal_dependence_diagnostics.py'
      - 'Blood_Pressure_Missingness/validate_current_influence_findings.py'
      - 'Blood_Pressure_Missingness/validate_current_narrative.py'
      - 'Blood_Pressure_Missingness/data/analysis_snapshot.csv'
      - 'Blood_Pressure_Missingness/data/source_audit.json'
      - 'Blood_Pressure_Missingness/tests/**'
      - 'Blood_Pressure_Missingness/requirements.txt'
      - '.github/workflows/refresh-blood-pressure-analysis.yml'
      - '.github/workflows/test-blood-pressure-analysis.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install analysis dependencies
        run: python -m pip install -r Blood_Pressure_Missingness/requirements.txt

      - name: Run refresh-sensitive findings gate
        working-directory: Blood_Pressure_Missingness
        run: >-
          python validate_current_influence_findings.py
          --data data/analysis_snapshot.csv

      - name: Check public narrative against current snapshot
        working-directory: Blood_Pressure_Missingness
        run: python validate_current_narrative.py --root .

      - name: Run blood-pressure regression and notebook tests
        run: >-
          python -m unittest discover
          -s Blood_Pressure_Missingness/tests
          -p 'test_*.py'
          -v

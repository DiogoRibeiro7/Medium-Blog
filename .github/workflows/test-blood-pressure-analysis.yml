name: Test blood-pressure analysis

on:
  pull_request:
    paths:
      - 'Blood_Pressure_Missingness/README.md'
      - 'Blood_Pressure_Missingness/DATA_PRIVACY.md'
      - 'Blood_Pressure_Missingness/SOURCE_REFRESH.md'
      - 'Blood_Pressure_Missingness/TEMPERATURE_COVARIATE.md'
      - 'Blood_Pressure_Missingness/blood-pressure-missingness.ipynb'
      - 'Blood_Pressure_Missingness/blood_pressure_missingness/**'
      - 'Blood_Pressure_Missingness/docs/**'
      - 'Blood_Pressure_Missingness/data/analysis_snapshot.csv'
      - 'Blood_Pressure_Missingness/data/source_audit.json'
      - 'Blood_Pressure_Missingness/tests/**'
      - 'Blood_Pressure_Missingness/requirements.txt'
      - 'Blood_Pressure_Missingness/pyproject.toml'
      - '.github/workflows/refresh-blood-pressure-analysis.yml'
      - '.github/workflows/test-blood-pressure-analysis.yml'
  push:
    branches:
      - main
    paths:
      - 'Blood_Pressure_Missingness/README.md'
      - 'Blood_Pressure_Missingness/DATA_PRIVACY.md'
      - 'Blood_Pressure_Missingness/SOURCE_REFRESH.md'
      - 'Blood_Pressure_Missingness/TEMPERATURE_COVARIATE.md'
      - 'Blood_Pressure_Missingness/blood-pressure-missingness.ipynb'
      - 'Blood_Pressure_Missingness/blood_pressure_missingness/**'
      - 'Blood_Pressure_Missingness/docs/**'
      - 'Blood_Pressure_Missingness/data/analysis_snapshot.csv'
      - 'Blood_Pressure_Missingness/data/source_audit.json'
      - 'Blood_Pressure_Missingness/tests/**'
      - 'Blood_Pressure_Missingness/requirements.txt'
      - 'Blood_Pressure_Missingness/pyproject.toml'
      - '.github/workflows/refresh-blood-pressure-analysis.yml'
      - '.github/workflows/test-blood-pressure-analysis.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install blood-pressure project
        run: python -m pip install -e Blood_Pressure_Missingness

      - name: Run refresh-sensitive findings gate
        working-directory: Blood_Pressure_Missingness
        run: >-
          python -m blood_pressure_missingness.validation.current_influence
          --data data/analysis_snapshot.csv

      - name: Check public narrative against current snapshot
        working-directory: Blood_Pressure_Missingness
        run: >-
          python -m blood_pressure_missingness.validation.current_narrative
          --root .

      - name: Run blood-pressure regression and notebook tests
        run: >-
          python -m unittest discover
          -s Blood_Pressure_Missingness/tests
          -p 'test_*.py'
          -v

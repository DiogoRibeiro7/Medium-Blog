name: Government spending and GDP accounting

on:
  pull_request:
    paths:
      - government-spending-gdp-accounting/**
      - .github/workflows/government-spending-gdp-accounting.yml
  push:
    branches: [main]
    paths:
      - government-spending-gdp-accounting/**
      - .github/workflows/government-spending-gdp-accounting.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: government-spending-gdp-accounting
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q analyse.py tests
      - name: Known-answer tests
        run: python -m unittest discover -s tests -v

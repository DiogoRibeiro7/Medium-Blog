name: Reproduce pipeline-time-correctness series

on:
  pull_request:
    paths:
      - 'pipeline-time-correctness/**'
      - '.github/workflows/pipeline-time-correctness.yml'
  push:
    branches:
      - main
    paths:
      - 'pipeline-time-correctness/**'
      - '.github/workflows/pipeline-time-correctness.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
    defaults:
      run:
        working-directory: pipeline-time-correctness
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline-time-correctness/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch the forecast hub's forecasts (Part 8; not redistributed in this repository)
        run: python part8/fetch_hub.py --forecasts-only

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Rerun each part and compare with the committed output
        run: |
          status=0
          for part in part*/; do
            main=$(ls "$part"*_numbers.py)
            echo "== $main"
            (cd "$part" && python "$(basename "$main")" > "$RUNNER_TEMP/output.txt")
            if ! diff -u "$part/output.txt" "$RUNNER_TEMP/output.txt" > "$RUNNER_TEMP/diff.txt"; then
              cat "$RUNNER_TEMP/diff.txt"
              detail=$(head -c 30000 "$RUNNER_TEMP/diff.txt" | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
              echo "::error file=${part}output.txt::output of $main differs from the committed output.txt%0A$detail"
              status=1
            fi
          done
          exit $status

      - name: Check that the figures script runs
        run: |
          for part in part*/; do
            (cd "$part" && python figures.py)
          done

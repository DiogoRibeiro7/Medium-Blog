name: Historic tax-cut source availability

on:
  pull_request:
    paths:
      - "neoliberalism-evidence-synthesis/causal_tax_cuts/**"
      - ".github/workflows/causal-tax-source-probe.yml"

permissions:
  contents: read

jobs:
  fetch-official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: neoliberalism-evidence-synthesis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned numerical dependency for matching
        run: python -m pip install numpy==2.3.5
      - name: Probe original Hope-Limberg public CSV
        run: python -m causal_tax_cuts.event_source --output-dir "$RUNNER_TEMP/tax-events"
      - name: Publish author source metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: author-event-availability
          path: ${{ runner.temp }}/tax-events/author_event_probe.json
          retention-days: 7
          if-no-files-found: warn
      - name: Fetch WID original 18-country CSVs and verify top 1% series
        id: wid_probe
        continue-on-error: true
        run: python -m causal_tax_cuts.wid --output-dir "$RUNNER_TEMP/wid-source"
      - name: Join published policy treatments and official top-income observations
        id: build_panel
        if: steps.wid_probe.outcome == 'success'
        run: |
          python -m causal_tax_cuts.prepare \
            --events "$RUNNER_TEMP/tax-events/hope_limberg_reforms_11_2020.csv" \
            --outcomes "$RUNNER_TEMP/wid-source/wid_top1_pretax.csv" \
            --event-mode binary-panel \
            --event-country iso3 \
            --event-year year \
            --event-treatment taxcut_2SD \
            --fields top1_share_pct \
            --output "$RUNNER_TEMP/tax-study/panel.csv"
      - name: Fetch official WDI macro controls and audit outcome-panel coverage
        id: wdi_probe
        if: steps.build_panel.outcome == 'success'
        run: |
          python -m causal_tax_cuts.world_bank \
            --panel "$RUNNER_TEMP/tax-study/panel.csv" \
            --output-dir "$RUNNER_TEMP/wdi-source"
      - name: Publish WDI country-year series and coverage audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-bank-macro-coverage
          path: |
            ${{ runner.temp }}/wdi-source/world_bank_controls.csv
            ${{ runner.temp }}/wdi-source/world_bank_provenance.json
            ${{ runner.temp }}/wdi-source/outcome_panel_with_macro.csv
            ${{ runner.temp }}/wdi-source/macro_overlap_audit.json
          retention-days: 7
          if-no-files-found: warn
      - name: Audit pre-reform macro matching eligibility and balance
        id: macro_balance
        if: steps.wdi_probe.outcome == 'success'
        run: |
          python -m causal_tax_cuts.macro_matching \
            --panel "$RUNNER_TEMP/wdi-source/outcome_panel_with_macro.csv" \
            --provenance "$RUNNER_TEMP/wdi-source/world_bank_provenance.json" \
            --lags 5 --max-horizon 5 --max-donors 5 \
            --output-dir "$RUNNER_TEMP/tax-study/macro-balance"
      - name: Publish macro matching attrition and balance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-reform-macro-balance
          path: |
            ${{ runner.temp }}/tax-study/macro-balance/macro_event_eligibility.csv
            ${{ runner.temp }}/tax-study/macro-balance/macro_pretrend_balance.csv
            ${{ runner.temp }}/tax-study/macro-balance/macro_balance_audit.json
          retention-days: 7
          if-no-files-found: warn
      - name: Audit sensitivity to pre-reform history length and donor cap
        id: macro_sensitivity
        if: steps.macro_balance.outcome == 'success'
        run: |
          python -m causal_tax_cuts.macro_sensitivity \
            --panel "$RUNNER_TEMP/wdi-source/outcome_panel_with_macro.csv" \
            --provenance "$RUNNER_TEMP/wdi-source/world_bank_provenance.json" \
            --frozen-reference causal_tax_cuts/results/macro_balance_2026-11-14.json \
            --lags 3 5 7 --donor-caps 3 5 7 --max-horizon 5 \
            --output-dir "$RUNNER_TEMP/tax-study/macro-sensitivity"
      - name: Publish pre-reform matching sensitivity grid
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-reform-macro-sensitivity
          path: |
            ${{ runner.temp }}/tax-study/macro-sensitivity/macro_sensitivity_grid.csv
            ${{ runner.temp }}/tax-study/macro-sensitivity/macro_sensitivity_events.csv
            ${{ runner.temp }}/tax-study/macro-sensitivity/macro_sensitivity_audit.json
          retention-days: 7
          if-no-files-found: warn
      - name: Audit future donor reforms and marginal macro support
        id: donor_support
        if: steps.macro_sensitivity.outcome == 'success'
        run: |
          python -m causal_tax_cuts.donor_support \
            --panel "$RUNNER_TEMP/wdi-source/outcome_panel_with_macro.csv" \
            --provenance "$RUNNER_TEMP/wdi-source/world_bank_provenance.json" \
            --output-dir "$RUNNER_TEMP/tax-study/donor-support"
      - name: Publish future donor exposure and support audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tax-cut-donor-support
          path: |
            ${{ runner.temp }}/tax-study/donor-support/support_reform_eligibility.csv
            ${{ runner.temp }}/tax-study/donor-support/future_donor_exposure.csv
            ${{ runner.temp }}/tax-study/donor-support/support_by_horizon.csv
            ${{ runner.temp }}/tax-study/donor-support/donor_support_audit.json
          retention-days: 7
          if-no-files-found: warn
      - name: Audit dynamic tax-cut pathways and sequential WDI coverage
        id: dynamic_exposure
        if: steps.donor_support.outcome == 'success'
        run: |
          python -m causal_tax_cuts.dynamic_exposure \
            --panel "$RUNNER_TEMP/wdi-source/outcome_panel_with_macro.csv" \
            --provenance "$RUNNER_TEMP/wdi-source/world_bank_provenance.json" \
            --frozen-reference causal_tax_cuts/results/donor_support_2026-11-15.json \
            --output-dir "$RUNNER_TEMP/tax-study/dynamic-exposure"
      - name: Publish dynamic policy paths and adherence audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tax-cut-dynamic-exposure
          path: |
            ${{ runner.temp }}/tax-study/dynamic-exposure/dynamic_policy_paths.csv
            ${{ runner.temp }}/tax-study/dynamic-exposure/dynamic_reform_recurrence.csv
            ${{ runner.temp }}/tax-study/dynamic-exposure/dynamic_event_horizons.csv
            ${{ runner.temp }}/tax-study/dynamic-exposure/dynamic_exposure_audit.json
          retention-days: 7
          if-no-files-found: warn
      - name: Audit joint three-variable pre-reform donor support
        id: joint_support
        if: steps.dynamic_exposure.outcome == 'success'
        run: |
          python -m causal_tax_cuts.joint_support \
            --panel "$RUNNER_TEMP/wdi-source/outcome_panel_with_macro.csv" \
            --provenance "$RUNNER_TEMP/wdi-source/world_bank_provenance.json" \
            --frozen-reference causal_tax_cuts/results/donor_support_2026-11-15.json \
            --output-dir "$RUNNER_TEMP/tax-study/joint-support"
      - name: Publish three-variable donor hull certificates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tax-cut-joint-macro-support
          path: |
            ${{ runner.temp }}/tax-study/joint-support/joint_support_event_horizons.csv
            ${{ runner.temp }}/tax-study/joint-support/joint_support_audit.json
          retention-days: 7
          if-no-files-found: warn
      - name: Audit official DPI2023 pre-reform political-institutional coverage
        id: political_institutions
        if: steps.joint_support.outcome == 'success'
        run: |
          python -m causal_tax_cuts.political_institutions \
            --panel "$RUNNER_TEMP/wdi-source/outcome_panel_with_macro.csv" \
            --frozen-reference causal_tax_cuts/results/donor_support_2026-11-15.json \
            --output-dir "$RUNNER_TEMP/tax-study/political-institutions"
      - name: Publish DPI2023 controls, coverage, and source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tax-cut-political-institutions
          path: |
            ${{ runner.temp }}/tax-study/political-institutions/dpi_political_controls.csv
            ${{ runner.temp }}/tax-study/political-institutions/political_reform_coverage.csv
            ${{ runner.temp }}/tax-study/political-institutions/political_donor_coverage.csv
            ${{ runner.temp }}/tax-study/political-institutions/political_coverage_audit.json
          retention-days: 7
          if-no-files-found: warn
      - name: Audit DPI executive orientation and institutional donor comparability
        id: political_comparability
        if: steps.political_institutions.outcome == 'success'
        run: |
          python -m causal_tax_cuts.political_comparability \
            --controls "$RUNNER_TEMP/tax-study/political-institutions/dpi_political_controls.csv" \
            --donors "$RUNNER_TEMP/tax-study/political-institutions/political_donor_coverage.csv" \
            --source-audit "$RUNNER_TEMP/tax-study/political-institutions/political_coverage_audit.json" \
            --output-dir "$RUNNER_TEMP/tax-study/political-comparability"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          actual = json.loads((root / "tax-study/political-comparability/political_comparability_audit.json").read_text())
          frozen = json.loads(Path("causal_tax_cuts/results/political_comparability_2026-11-21.json").read_text())
          keys = ("political_controls_sha256", "donor_exposures_sha256", "source_audit_sha256")
          if all(actual[key] == frozen[key] for key in keys):
              if actual != frozen:
                  raise ValueError("Same-source political comparability does not reproduce frozen results")
              print("Verified exact political comparability snapshot")
          else:
              print("Source vintage changed: report new hashes, do not claim reproduction")
          PY
      - name: Publish source-verifiable political donor comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tax-cut-political-comparability
          path: |
            ${{ runner.temp }}/tax-study/political-comparability/political_comparability_pairs.csv
            ${{ runner.temp }}/tax-study/political-comparability/political_comparability_event_horizons.csv
            ${{ runner.temp }}/tax-study/political-comparability/political_comparability_audit.json
          retention-days: 7
          if-no-files-found: warn
      - name: Audit annual author tax-cut flags versus statutory dates
        id: tax_timing
        if: steps.wdi_probe.outcome == 'success'
        run: |
          python -m causal_tax_cuts.tax_timing \
            --author-csv "$RUNNER_TEMP/tax-events/hope_limberg_reforms_11_2020.csv" \
            --joined-panel "$RUNNER_TEMP/wdi-source/outcome_panel_with_macro.csv" \
            --statute-ledger causal_tax_cuts/statute_context.csv \
            --frozen-reference causal_tax_cuts/results/dynamic_exposure_2026-11-16.json \
            --output-dir "$RUNNER_TEMP/tax-study/timing"
      - name: Publish author flag-year and statutory timing audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tax-cut-annual-timing
          path: |
            ${{ runner.temp }}/tax-study/timing/author_flag_years.csv
            ${{ runner.temp }}/tax-study/timing/author_consecutive_flag_runs.csv
            ${{ runner.temp }}/tax-study/timing/author_timing_audit.json
          retention-days: 7
          if-no-files-found: warn
      - name: Reconcile tax-cut run onsets and sourced statutory period rules
        id: onset_phasein
        if: steps.tax_timing.outcome == 'success' && steps.donor_support.outcome == 'success'
        run: |
          python -m causal_tax_cuts.onset_phasein \
            --flags "$RUNNER_TEMP/tax-study/timing/author_flag_years.csv" \
            --support "$RUNNER_TEMP/tax-study/donor-support/support_reform_eligibility.csv" \
            --provisions causal_tax_cuts/provision_periods.csv \
            --timing-audit "$RUNNER_TEMP/tax-study/timing/author_timing_audit.json" \
            --donor-audit "$RUNNER_TEMP/tax-study/donor-support/donor_support_audit.json" \
            --output-dir "$RUNNER_TEMP/tax-study/onset-phasein"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          generated = Path(os.environ["RUNNER_TEMP"]) / "tax-study/onset-phasein/tax_cut_onset_audit.json"
          frozen = Path("causal_tax_cuts/results/onset_phasein_2026-11-23.json")
          actual, baseline = (json.loads(path.read_text(encoding="utf-8")) for path in (generated, frozen))
          if actual["source_sha256"] == baseline["source_sha256"]:
              if actual != baseline:
                  raise ValueError("Same-source onset and phase-in audit drifted")
              print("Exact tax-cut onset and legal-period source snapshot verified")
          else:
              print("Upstream source vintage changed: do not claim frozen reproduction")
          PY
      - name: Publish onset eligibility and statute-period audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tax-cut-onset-phasein
          path: |
            ${{ runner.temp }}/tax-study/onset-phasein/tax_cut_onset_eligibility.csv
            ${{ runner.temp }}/tax-study/onset-phasein/tax_provision_periods.csv
            ${{ runner.temp }}/tax-study/onset-phasein/tax_cut_onset_audit.json
          retention-days: 7
          if-no-files-found: warn
      - name: Audit four additional historical primary-law provision contexts
        id: legislative_expansion
        if: steps.onset_phasein.outcome == 'success'
        run: |
          python -m causal_tax_cuts.legislative_expansion \
            --flags "$RUNNER_TEMP/tax-study/timing/author_flag_years.csv" \
            --onsets "$RUNNER_TEMP/tax-study/onset-phasein/tax_cut_onset_eligibility.csv" \
            --legacy causal_tax_cuts/provision_periods.csv \
            --expansion causal_tax_cuts/legislative_expansion.csv \
            --previous "$RUNNER_TEMP/tax-study/onset-phasein/tax_cut_onset_audit.json" \
            --output-dir "$RUNNER_TEMP/tax-study/legislative-expansion"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"]) / "tax-study/legislative-expansion/legislative_coverage_audit.json"
          frozen = Path("causal_tax_cuts/results/legislative_coverage_2026-11-23.json")
          actual, reference = (json.loads(path.read_text(encoding="utf-8")) for path in (output, frozen))
          if actual["source_sha256"] == reference["source_sha256"]:
              if actual != reference:
                  raise ValueError("Same-source legal coverage did not reproduce the frozen result")
              print("Verified exact documentary-coverage snapshot")
          else:
              print("Source vintage changed: no claim of exact snapshot reproduction")
          PY
      - name: Publish four-case primary-law evidence expansion and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tax-cut-legislative-expansion
          path: |
            ${{ runner.temp }}/tax-study/legislative-expansion/legislative_review_all_flag_years.csv
            ${{ runner.temp }}/tax-study/legislative-expansion/legislative_coverage_audit.json
          retention-days: 7
          if-no-files-found: warn
      - name: Assess documented policies against identification support gates
        id: identification_feasibility
        if: steps.legislative_expansion.outcome == 'success'
        run: |
          python -m causal_tax_cuts.identification_feasibility \
            --legal "$RUNNER_TEMP/tax-study/legislative-expansion/legislative_review_all_flag_years.csv" \
            --hull "$RUNNER_TEMP/tax-study/joint-support/joint_support_event_horizons.csv" \
            --dynamic "$RUNNER_TEMP/tax-study/dynamic-exposure/dynamic_event_horizons.csv" \
            --political "$RUNNER_TEMP/tax-study/political-institutions/political_reform_coverage.csv" \
            --macro "$RUNNER_TEMP/tax-study/macro-balance/macro_event_eligibility.csv" \
            --legal-audit "$RUNNER_TEMP/tax-study/legislative-expansion/legislative_coverage_audit.json" \
            --hull-audit "$RUNNER_TEMP/tax-study/joint-support/joint_support_audit.json" \
            --dynamic-audit "$RUNNER_TEMP/tax-study/dynamic-exposure/dynamic_exposure_audit.json" \
            --political-audit "$RUNNER_TEMP/tax-study/political-institutions/political_coverage_audit.json" \
            --macro-audit "$RUNNER_TEMP/tax-study/macro-balance/macro_balance_audit.json" \
            --output-dir "$RUNNER_TEMP/tax-study/identification-feasibility"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from causal_tax_cuts.identification_feasibility import verify_frozen_reference

          root = Path(os.environ["RUNNER_TEMP"])
          actual = json.loads(
              (root / "tax-study/identification-feasibility/policy_identification_audit.json").read_text()
          )
          frozen = json.loads(
              Path("causal_tax_cuts/results/identification_feasibility_2026-11-23.json").read_text()
          )
          result = verify_frozen_reference(actual, frozen)
          if result == "exact_raw_input_reproduction":
              print("Verified byte-level input-hash and substantive result reproduction")
          elif result == "same_original_data_and_scientific_inputs_derived_roundoff_only":
              print("Same WID/WDI panel and scientific results; permitted derived numerical roundoff differences")
          else:
              print("Original study source vintage changed; no exact reproduction claimed")
          PY
      - name: Publish per-policy identification gates and source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tax-cut-identification-feasibility
          path: |
            ${{ runner.temp }}/tax-study/identification-feasibility/policy_identification_events.csv
            ${{ runner.temp }}/tax-study/identification-feasibility/policy_identification_event_horizons.csv
            ${{ runner.temp }}/tax-study/identification-feasibility/policy_identification_audit.json
          retention-days: 7
          if-no-files-found: warn
      - name: Audit Finnish 1986 and German 2008 official tax components
        id: policy_component_candidates
        if: steps.identification_feasibility.outcome == 'success'
        run: |
          python -m causal_tax_cuts.policy_component_candidates \
            --components causal_tax_cuts/policy_component_sources.csv \
            --prior-events "$RUNNER_TEMP/tax-study/identification-feasibility/policy_identification_events.csv" \
            --prior-audit "$RUNNER_TEMP/tax-study/identification-feasibility/policy_identification_audit.json" \
            --output-dir "$RUNNER_TEMP/tax-study/policy-component-candidates"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          actual = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "tax-study/policy-component-candidates/policy_component_audit.json").read_text()
          )
          frozen_path = Path("causal_tax_cuts/results/policy_components_2026-11-23.json")
          if frozen_path.exists():
              reference = json.loads(frozen_path.read_text(encoding="utf-8"))
              if actual["source_sha256"] == reference["source_sha256"]:
                  if actual != reference:
                      raise ValueError("Same-source Finnish/German tax-component audit drifted")
                  print("Verified exact Finland/Germany component evidence snapshot")
              elif (
                  actual["joined_panel_sha256"] == reference["joined_panel_sha256"]
                  and actual["source_sha256"]["official_component_ledger"]
                  == reference["source_sha256"]["official_component_ledger"]
              ):
                  scientific_actual = {k: v for k, v in actual.items() if k != "source_sha256"}
                  scientific_reference = {k: v for k, v in reference.items() if k != "source_sha256"}
                  if scientific_actual != scientific_reference:
                      raise ValueError("Original panel unchanged but component evidence or event gates drifted")
                  print("Original data and component results agree; upstream derived audit bytes differ")
              else:
                  print("Official source vintage changed: do not claim frozen reproduction")
          else:
              print("Initial live component audit; frozen source snapshot not yet published")
          PY
      - name: Publish Finnish/German component source and case gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tax-cut-finland-germany-components
          path: |
            ${{ runner.temp }}/tax-study/policy-component-candidates/policy_component_evidence.csv
            ${{ runner.temp }}/tax-study/policy-component-candidates/supported_reform_candidate_gates.csv
            ${{ runner.temp }}/tax-study/policy-component-candidates/policy_component_audit.json
          retention-days: 7
          if-no-files-found: warn
      - name: Audit outcome-augmented donor hulls for two documented cases
        if: steps.policy_component_candidates.outcome == 'success'
        run: |
          python -m unittest causal_tax_cuts.tests.test_outcome_hull -v
          python -m causal_tax_cuts.outcome_hull --panel "$RUNNER_TEMP/wdi-source/outcome_panel_with_macro.csv" --output-dir "$RUNNER_TEMP/tax-study/outcome-hull"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          actual = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "tax-study/outcome-hull/outcome_hull.json").read_text()
          )
          reference = json.loads(
              Path("causal_tax_cuts/results/outcome_hull_2026-11-24.json").read_text()
          )
          if actual["panel_sha256"] == reference["panel_sha256"]:
              if actual != reference:
                  raise ValueError("Same-panel outcome hull diagnostic drifted")
              print("Verified exact outcome hull snapshot")
          else:
              print("Panel vintage changed; do not claim exact reproduction")
          PY
      - name: Publish outcome-augmented support diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tax-cut-outcome-hull
          path: ${{ runner.temp }}/tax-study/outcome-hull/
          retention-days: 7
          if-no-files-found: warn
      - name: Measure minimum pre-reform convex approximation error
        if: steps.policy_component_candidates.outcome == 'success'
        run: |
          python -m unittest causal_tax_cuts.tests.test_convex_approximation -v
          python -m causal_tax_cuts.convex_approximation --panel "$RUNNER_TEMP/wdi-source/outcome_panel_with_macro.csv" --output-dir "$RUNNER_TEMP/tax-study/convex-approximation"
      - name: Publish pre-fit approximation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tax-cut-convex-approximation
          path: ${{ runner.temp }}/tax-study/convex-approximation/
          retention-days: 7
          if-no-files-found: warn
      - name: Validate chronological held-out pre-reform prediction
        if: steps.policy_component_candidates.outcome == 'success'
        run: |
          python -m unittest causal_tax_cuts.tests.test_heldout_prefit -v
          python -m causal_tax_cuts.heldout_prefit --panel "$RUNNER_TEMP/wdi-source/outcome_panel_with_macro.csv" --output-dir "$RUNNER_TEMP/tax-study/heldout-prefit"
      - name: Publish held-out pre-reform prediction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tax-cut-heldout-prefit
          path: ${{ runner.temp }}/tax-study/heldout-prefit/
          retention-days: 7
          if-no-files-found: warn
      - name: Run exploratory treatment-history-only matching
        id: estimate
        if: steps.build_panel.outcome == 'success'
        run: |
          python -m causal_tax_cuts.analysis \
            --panel "$RUNNER_TEMP/tax-study/panel.csv" \
            --outcome top1_share_pct \
            --lags 5 --horizon 5 --min-events 5 \
            --output "$RUNNER_TEMP/tax-study/results"
      - name: Run balanced pre-reform placebo event study
        id: placebo
        if: steps.estimate.outcome == 'success'
        run: |
          python -m causal_tax_cuts.event_study \
            --panel "$RUNNER_TEMP/tax-study/panel.csv" \
            --outcome top1_share_pct \
            --lags 5 --horizon 5 --min-events 5 \
            --output "$RUNNER_TEMP/tax-study/placebo"
      - name: Audit whole-country deletion influence
        id: country_influence
        if: steps.placebo.outcome == 'success'
        run: |
          python -m causal_tax_cuts.country_influence \
            --panel "$RUNNER_TEMP/tax-study/panel.csv" \
            --outcome top1_share_pct \
            --lags 5 --horizon 5 --min-events 5 \
            --output "$RUNNER_TEMP/tax-study/country-influence"
      - name: Publish WID values and SHA-256 source manifest
        if: always()
        uses: actions/upload-artifact@v4

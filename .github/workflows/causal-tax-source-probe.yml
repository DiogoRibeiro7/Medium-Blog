name: Historic tax-cut source availability

on:
  pull_request:
    paths:
      - "neoliberalism-evidence-synthesis/causal_tax_cuts/**"
      - ".github/workflows/causal-tax-source-probe.yml"

permissions:
  contents: read

jobs:
  fetch-official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: neoliberalism-evidence-synthesis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned numerical dependency for matching
        run: python -m pip install numpy==2.3.5
      - name: Probe original Hope-Limberg public CSV
        run: python -m causal_tax_cuts.event_source --output-dir "$RUNNER_TEMP/tax-events"
      - name: Publish author source metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: author-event-availability
          path: ${{ runner.temp }}/tax-events/author_event_probe.json
          retention-days: 7
          if-no-files-found: warn
      - name: Fetch WID original 18-country CSVs and verify top 1% series
        id: wid_probe
        continue-on-error: true
        run: python -m causal_tax_cuts.wid --output-dir "$RUNNER_TEMP/wid-source"
      - name: Join published policy treatments and official top-income observations
        id: build_panel
        if: steps.wid_probe.outcome == 'success'
        run: |
          python -m causal_tax_cuts.prepare \
            --events "$RUNNER_TEMP/tax-events/hope_limberg_reforms_11_2020.csv" \
            --outcomes "$RUNNER_TEMP/wid-source/wid_top1_pretax.csv" \
            --event-mode binary-panel \
            --event-country iso3 \
            --event-year year \
            --event-treatment taxcut_2SD \
            --fields top1_share_pct \
            --output "$RUNNER_TEMP/tax-study/panel.csv"
      - name: Fetch official WDI macro controls and audit outcome-panel coverage
        id: wdi_probe
        if: steps.build_panel.outcome == 'success'
        run: |
          python -m causal_tax_cuts.world_bank \
            --panel "$RUNNER_TEMP/tax-study/panel.csv" \
            --output-dir "$RUNNER_TEMP/wdi-source"
      - name: Publish WDI country-year series and coverage audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-bank-macro-coverage
          path: |
            ${{ runner.temp }}/wdi-source/world_bank_controls.csv
            ${{ runner.temp }}/wdi-source/world_bank_provenance.json
            ${{ runner.temp }}/wdi-source/outcome_panel_with_macro.csv
            ${{ runner.temp }}/wdi-source/macro_overlap_audit.json
          retention-days: 7
          if-no-files-found: warn
      - name: Audit pre-reform macro matching eligibility and balance
        id: macro_balance
        if: steps.wdi_probe.outcome == 'success'
        run: |
          python -m causal_tax_cuts.macro_matching \
            --panel "$RUNNER_TEMP/wdi-source/outcome_panel_with_macro.csv" \
            --provenance "$RUNNER_TEMP/wdi-source/world_bank_provenance.json" \
            --lags 5 --max-horizon 5 --max-donors 5 \
            --output-dir "$RUNNER_TEMP/tax-study/macro-balance"
      - name: Publish macro matching attrition and balance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-reform-macro-balance
          path: |
            ${{ runner.temp }}/tax-study/macro-balance/macro_event_eligibility.csv
            ${{ runner.temp }}/tax-study/macro-balance/macro_pretrend_balance.csv
            ${{ runner.temp }}/tax-study/macro-balance/macro_balance_audit.json
          retention-days: 7
          if-no-files-found: warn
      - name: Run exploratory treatment-history-only matching
        id: estimate
        if: steps.build_panel.outcome == 'success'
        run: |
          python -m causal_tax_cuts.analysis \
            --panel "$RUNNER_TEMP/tax-study/panel.csv" \
            --outcome top1_share_pct \
            --lags 5 --horizon 5 --min-events 5 \
            --output "$RUNNER_TEMP/tax-study/results"
      - name: Run balanced pre-reform placebo event study
        id: placebo
        if: steps.estimate.outcome == 'success'
        run: |
          python -m causal_tax_cuts.event_study \
            --panel "$RUNNER_TEMP/tax-study/panel.csv" \
            --outcome top1_share_pct \
            --lags 5 --horizon 5 --min-events 5 \
            --output "$RUNNER_TEMP/tax-study/placebo"
      - name: Audit whole-country deletion influence
        id: country_influence
        if: steps.placebo.outcome == 'success'
        run: |
          python -m causal_tax_cuts.country_influence \
            --panel "$RUNNER_TEMP/tax-study/panel.csv" \
            --outcome top1_share_pct \
            --lags 5 --horizon 5 --min-events 5 \
            --output "$RUNNER_TEMP/tax-study/country-influence"
      - name: Publish WID values and SHA-256 source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wid-source-availability
          path: |
            ${{ runner.temp }}/wid-source/wid_top1_pretax.csv
            ${{ runner.temp }}/wid-source/wid_top1_provenance.json
          retention-days: 7
          if-no-files-found: warn
      - name: Publish joined panel and exploratory matching audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tax-cut-real-data-study
          path: |
            ${{ runner.temp }}/tax-study/panel.csv
            ${{ runner.temp }}/tax-study/panel.audit.json
            ${{ runner.temp }}/tax-study/results/event_effects.csv
            ${{ runner.temp }}/tax-study/results/att_by_horizon.csv
            ${{ runner.temp }}/tax-study/results/run_metadata.json
            ${{ runner.temp }}/tax-study/placebo/event_time_contrasts.csv
            ${{ runner.temp }}/tax-study/placebo/event_time_summary.csv
            ${{ runner.temp }}/tax-study/placebo/event_study_audit.json
            ${{ runner.temp }}/tax-study/country-influence/country_deletions.csv
            ${{ runner.temp }}/tax-study/country-influence/country_influence_summary.csv
            ${{ runner.temp }}/tax-study/country-influence/country_influence_audit.json
          retention-days: 7
          if-no-files-found: warn

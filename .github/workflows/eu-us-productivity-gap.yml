name: Reproduce eu-us-productivity-gap

on:
  pull_request:
    paths:
      - 'eu-us-productivity-gap/**'
      - '.github/workflows/eu-us-productivity-gap.yml'
  push:
    branches:
      - main
    paths:
      - 'eu-us-productivity-gap/**'
      - '.github/workflows/eu-us-productivity-gap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: eu-us-productivity-gap
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: eu-us-productivity-gap/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest -q tests

      - name: Rerun the analysis
        run: python analysis.py > /dev/null

      - name: Check the numbers match the committed run
        run: git diff --exit-code -- results/analysis_summary.txt

      - name: Draw the figures
        run: |
          python figures.py
          for f in fig1_one_gap_ten_numbers fig2_countries_gdp_gni fig3_per_capita_decomposition \
                   fig4_two_price_bases fig5_growth_accounting fig6_income_side; do
            test -s "figures/$f.png"
          done

name: Queueing theory article evidence

on:
  pull_request:
    paths:
      - "queueing-theory-for-data-scientists/**"
      - ".github/workflows/queueing-theory-for-data-scientists.yml"
  push:
    branches: [main]
    paths:
      - "queueing-theory-for-data-scientists/**"
      - ".github/workflows/queueing-theory-for-data-scientists.yml"

jobs:
  reproducibility-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: queueing-theory-for-data-scientists
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: queueing-theory-for-data-scientists/requirements.txt
      - name: Install project-only dependencies
        run: python -m pip install -r requirements.txt
      - name: Scientific tests and fresh-kernel notebook execution
        run: python -m unittest discover -s tests -v
      - name: Smoke-run analysis without overwriting full evidence
        run: python analysis.py --quick

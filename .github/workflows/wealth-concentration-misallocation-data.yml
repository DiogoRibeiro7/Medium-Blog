name: Refresh wealth-concentration-misallocation data

on:
  push:
    branches:
      - wealth-concentration-misallocation
    paths:
      - 'wealth-concentration-misallocation/fetch.py'
      - '.github/workflows/wealth-concentration-misallocation-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: wealth-concentration-misallocation
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: wealth-concentration-misallocation/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Download WID, Penn World Table 11.0, WDI and the billionaire database
        id: fetch
        continue-on-error: true
        run: python fetch.py --out data

      - name: Commit the snapshot and its log if they changed
        if: always()
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add data
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "Refresh data snapshot for wealth-concentration-misallocation ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Fail if a required request failed
        if: steps.fetch.outcome == 'failure'
        run: |
          cat data/fetch_log.txt
          exit 1

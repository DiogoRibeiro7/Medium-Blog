name: Reproduce ml-pipeline-tests

on:
  pull_request:
    paths:
      - 'ml-pipeline-tests/**'
      - '.github/workflows/ml-pipeline-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'ml-pipeline-tests/**'
      - '.github/workflows/ml-pipeline-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-pipeline-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml-pipeline-tests/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Test suite of the reviewed pipeline
        run: python -m pytest -q

  reproduce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-pipeline-tests
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml-pipeline-tests/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Rerun the analysis (variants, test layers, behaviour, thresholds)
        run: python analysis.py > fresh_output.txt

      - name: Check the numbers match the committed run
        run: python compare_output.py results/output.txt fresh_output.txt

      - name: Redraw the figures
        run: python figures.py

      - name: Check every figure was drawn
        run: |
          for f in fig1_reported_realized fig2_leak_predictions fig3_split fig4_detection fig5_slices; do
            test -s "figures/$f.png"
          done

name: Reproduce backward-evaluation-pooling

on:
  pull_request:
    paths:
      - 'backward-evaluation-pooling/**'
      - 'backward-evaluation/backward_eval.py'
      - 'backward-evaluation/schemes.py'
      - '.github/workflows/backward-evaluation-pooling.yml'
  push:
    branches:
      - main
    paths:
      - 'backward-evaluation-pooling/**'
      - 'backward-evaluation/backward_eval.py'
      - 'backward-evaluation/schemes.py'
      - '.github/workflows/backward-evaluation-pooling.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backward-evaluation-pooling
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backward-evaluation-pooling/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q tests

      - name: Simulations
        run: python sims.py --reps 300 --workers 4

      - name: Premise test
        run: python premise.py

      - name: Forward test
        run: python forward.py --workers 4

      - name: Figures
        run: python figures.py

      - name: Summaries unchanged within tolerance
        run: |
          git diff --stat -- results || true
          python check_results.py results/sims_summary.txt results/premise_summary.txt results/forward_summary.txt

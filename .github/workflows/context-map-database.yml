name: Reproduce context-map-database

on:
  pull_request:
    paths:
      - 'context-map-database/**'
      - '.github/workflows/context-map-database.yml'
  push:
    branches:
      - main
    paths:
      - 'context-map-database/**'
      - '.github/workflows/context-map-database.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: context-map-database
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: context-map-database/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest -q tests

      - name: Rerun the analysis
        run: python context_map_database.py > results/output.txt

      - name: Check the numbers match the committed run
        run: git diff --exit-code -- results/output.txt results/summary.json

      - name: Check every figure was drawn
        run: |
          for f in fig1_schema fig2_learned_loops fig3_grounding; do
            test -s "figures/$f.png"
          done

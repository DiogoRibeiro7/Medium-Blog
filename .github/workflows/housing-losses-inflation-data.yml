name: Refresh housing-losses-inflation data

on:
  push:
    branches:
      - housing-losses-inflation
    paths:
      - 'housing-losses-inflation/fetch.py'
      - '.github/workflows/housing-losses-inflation-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: housing-losses-inflation
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: housing-losses-inflation/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Download JST R6 from macrohistory.net and the OECD house price indicators
        id: fetch
        continue-on-error: true
        run: python fetch.py --out data

      - name: Rerun the analysis and the figures on the new snapshot
        if: steps.fetch.outcome == 'success'
        run: |
          python analysis.py > /dev/null
          python figures.py

      - name: Commit the snapshot, results and figures if they changed
        if: always()
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add data results figures
          if git diff --cached --quiet -- data/jst_housing.csv data/oecd_house_prices.csv results figures; then
            echo "Data unchanged; nothing to commit."
          else
            git commit -m "Refresh data snapshot and results for housing-losses-inflation ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Fail if the OECD request failed
        if: steps.fetch.outcome == 'failure'
        run: |
          cat data/fetch_log.txt
          exit 1

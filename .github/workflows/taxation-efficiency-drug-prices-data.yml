name: Refresh taxation-efficiency-drug-prices data

on:
  push:
    branches:
      - taxation-efficiency-drug-prices-part2
    paths:
      - 'taxation-efficiency-drug-prices/part2/fetch.py'
      - '.github/workflows/taxation-efficiency-drug-prices-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: taxation-efficiency-drug-prices/part2
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: taxation-efficiency-drug-prices/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r ../requirements.txt

      - name: Download and reduce the public files
        id: fetch
        continue-on-error: true
        run: python fetch.py --out data

      - name: Commit the snapshot and its log if they changed
        if: always()
        run: |
          set +e
          du -sh data/* | sort -h | tail -20
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add data
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git commit -q -m "Refresh drug-price data for taxation-efficiency-drug-prices part 2 ($(date -u +%Y-%m-%d))"
          out=$(git push origin "HEAD:${GITHUB_REF_NAME}" 2>&1)
          status=$?
          echo "$out"
          if [ $status -ne 0 ]; then
            msg=$(echo "$out" | tail -c 3000 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error::git push failed%0A$msg"
            exit 1
          fi

      - name: Fail if a download failed
        if: steps.fetch.outcome == 'failure'
        run: |
          cat data/fetch_log.txt || true
          exit 1

name: Reproduce cure-fraction-identifiability

on:
  pull_request:
    paths:
      - 'cure-fraction-identifiability/**'
      - 'recovery-after-busts/results/episodes_all.csv'
      - '.github/workflows/cure-fraction-identifiability.yml'
  push:
    branches:
      - main
    paths:
      - 'cure-fraction-identifiability/**'
      - 'recovery-after-busts/results/episodes_all.csv'
      - '.github/workflows/cure-fraction-identifiability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cure-fraction-identifiability
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: cure-fraction-identifiability/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q tests

      - name: Simulation study
        run: python simulate.py --workers 4

      - name: No-cure negative control
        run: python no_cure_audit.py --reps 100 --workers 4

      - name: EU application
        run: python application.py

      - name: Figures
        run: |
          python figures.py
          python plot_no_cure.py

      - name: Summaries unchanged within tolerance
        run: |
          git diff -- results/sim_summary.txt results/application_summary.txt results/no_cure_summary.txt || true
          python check_results.py results/sim_summary.txt results/application_summary.txt results/no_cure_summary.txt

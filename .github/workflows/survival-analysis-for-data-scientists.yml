name: Reproduce survival analysis series

on:
  pull_request:
    paths:
      - 'survival-analysis-for-data-scientists/**'
      - '.github/workflows/survival-analysis-for-data-scientists.yml'
  push:
    branches:
      - main
    paths:
      - 'survival-analysis-for-data-scientists/**'
      - '.github/workflows/survival-analysis-for-data-scientists.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: survival-analysis-for-data-scientists
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: survival-analysis-for-data-scientists/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rerun each part and compare with the committed output
        run: |
          status=0
          for part in part*/; do
            main=$(ls "$part"*.py | grep -v figures.py)
            echo "== $main"
            (cd "$part" && python "$(basename "$main")" > "$RUNNER_TEMP/output.txt")
            if ! diff -u "$part/output.txt" "$RUNNER_TEMP/output.txt"; then
              echo "::error file=${part}output.txt::output of $main differs from the committed output.txt"
              status=1
            fi
          done
          exit $status

name: Midterm forecast - historical and predictive validation

on:
  pull_request:
    paths:
      - "midterm-forecast-fit-vs-prediction/**"
      - ".github/workflows/midterm-forecast-fit-vs-prediction.yml"
  push:
    branches: [main]
    paths:
      - "midterm-forecast-fit-vs-prediction/**"
      - ".github/workflows/midterm-forecast-fit-vs-prediction.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      MPLCONFIGDIR: /tmp/mpl-midterm-forecast
    defaults:
      run:
        working-directory: midterm-forecast-fit-vs-prediction
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: midterm-forecast-fit-vs-prediction/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source and tests
        run: python -m compileall -q analysis.py model_extensions.py comparison_uncertainty.py forecast_lock.py score_after_election.py figures.py prepare_medium_publication.py tests
      - name: Run scientific tests and fresh-kernel notebook
        run: python -m unittest discover -s tests -v
      - name: Verify final Medium manuscript and equation artwork
        run: python prepare_medium_publication.py --check
      - name: Recompute all numerical tables
        run: python analysis.py --output /tmp/midterm-reproduction
      - name: Recompute alternative-model comparisons
        run: python model_extensions.py --output /tmp/midterm-reproduction
      - name: Recompute paired model-comparison uncertainty
        run: python comparison_uncertainty.py --output /tmp/midterm-reproduction
      - name: Reproduce the pre-election forecast lock
        run: python forecast_lock.py --output /tmp/midterm-reproduction
      - name: Recompute all original figures
        run: python figures.py --output /tmp/midterm-reproduction
      - name: Verify canonical numerical snapshot is current
        run: |
          python - <<'PY'
          import csv
          import json
          import math
          from pathlib import Path

          # BLAS/LAPACK and Python builds can differ at the last few bits.
          # Compare numerical evidence tightly, while checking metadata and
          # schemas exactly, rather than requiring bitwise-float identity.
          def equivalent(expected, actual, label, tolerance=1e-9):
              if isinstance(expected, dict):
                  assert isinstance(actual, dict) and expected.keys() == actual.keys(), f'{label}: schema mismatch'
                  for key in expected:
                      equivalent(expected[key], actual[key], f'{label}.{key}', tolerance)
              elif isinstance(expected, list):
                  assert isinstance(actual, list) and len(expected) == len(actual), f'{label}: shape mismatch'
                  for i, (left, right) in enumerate(zip(expected, actual, strict=True)):
                      equivalent(left, right, f'{label}[{i}]', tolerance)
              elif isinstance(expected, (int, float)) and not isinstance(expected, bool):
                  assert isinstance(actual, (int, float)) and not isinstance(actual, bool), f'{label}: type mismatch'
                  assert math.isclose(expected, actual, rel_tol=tolerance, abs_tol=tolerance), f'{label}: {expected} != {actual}'
              else:
                  assert expected == actual, f'{label}: {expected!r} != {actual!r}'

          primary = json.loads(Path('results/summary.json').read_text())
          duplicate = json.loads(Path('/tmp/midterm-reproduction/results/summary.json').read_text())
          equivalent(primary, duplicate, 'summary')
          extension = json.loads(Path('results/alternative_models_summary.json').read_text())
          regenerated_extension = json.loads(Path('/tmp/midterm-reproduction/results/alternative_models_summary.json').read_text())
          for field in ('as_of', 'observations', 'forward_count', 'forward_elections',
                        'student_t_df_fixed', 'ridge_alpha_fixed', 'recency_half_life_years_fixed'):
              assert extension[field] == regenerated_extension[field], f'{field}: alternative-model design changed'
          equivalent(extension, regenerated_extension, 'alternative_models', tolerance=1e-5)
          paired = json.loads(Path('results/paired_uncertainty_summary.json').read_text())
          regenerated_paired = json.loads(Path('/tmp/midterm-reproduction/results/paired_uncertainty_summary.json').read_text())
          for field in ('as_of', 'method', 'bootstrap_seed', 'bootstrap_draws',
                        'bootstrap_quantiles', 'historical_forward_years', 'forward_count',
                        'candidate_names', 'source_names', 'interpretation'):
              assert paired[field] == regenerated_paired[field], f'{field}: paired design changed'
          equivalent(paired, regenerated_paired, 'paired_uncertainty', tolerance=1e-5)
          locked = json.loads(Path('results/forecast_lock.json').read_text())
          reconstructed_lock = json.loads(Path('/tmp/midterm-reproduction/results/forecast_lock.json').read_text())
          assert locked == reconstructed_lock, 'Pre-election registration, source hashes, or frozen forecast changed'
          tables = (
              ('forward_model_comparison.csv', 1e-9),
              ('source_sensitivity.csv', 1e-9),
              ('alternative_model_forward.csv', 1e-5),
              ('alternative_model_forward_gallup.csv', 1e-5),
              ('alternative_model_path.csv', 1e-5),
              ('paired_loss_differences.csv', 1e-5),
              ('paired_model_comparisons.csv', 1e-5),
              ('paired_leave_one_year_out.csv', 1e-5),
          )
          for filename, tolerance in tables:
              with (Path('results') / filename).open(newline='') as source:
                  reader = csv.DictReader(source)
                  columns = reader.fieldnames
                  committed = list(reader)
              with (Path('/tmp/midterm-reproduction/results') / filename).open(newline='') as source:
                  reader = csv.DictReader(source)
                  assert columns == reader.fieldnames, f'{filename}: columns differ'
                  regenerated = list(reader)
              assert len(committed) == len(regenerated), f'{filename}: row count differs'
              for i, (left, right) in enumerate(zip(committed, regenerated, strict=True)):
                  for field in columns:
                      try:
                          equivalent(float(left[field]), float(right[field]), f'{filename}[{i}].{field}', tolerance)
                      except ValueError:
                          equivalent(left[field], right[field], f'{filename}[{i}].{field}')
          assert len(list(Path('/tmp/midterm-reproduction/figures').glob('fig*.png'))) == 13
          print('Canonical metrics, paired uncertainty, sealed forecast, and thirteen figures verified')
          PY

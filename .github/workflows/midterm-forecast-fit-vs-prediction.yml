name: Midterm forecast - historical and predictive validation

on:
  pull_request:
    paths:
      - "midterm-forecast-fit-vs-prediction/**"
      - ".github/workflows/midterm-forecast-fit-vs-prediction.yml"
  push:
    branches: [main]
    paths:
      - "midterm-forecast-fit-vs-prediction/**"
      - ".github/workflows/midterm-forecast-fit-vs-prediction.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      MPLCONFIGDIR: /tmp/mpl-midterm-forecast
    defaults:
      run:
        working-directory: midterm-forecast-fit-vs-prediction
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: midterm-forecast-fit-vs-prediction/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source and tests
        run: python -m compileall -q analysis.py figures.py tests
      - name: Run scientific tests and fresh-kernel notebook
        run: python -m unittest discover -s tests -v
      - name: Recompute all numerical tables
        run: python analysis.py --output /tmp/midterm-reproduction
      - name: Recompute all original figures
        run: python figures.py --output /tmp/midterm-reproduction
      - name: Verify canonical numerical snapshot is current
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          primary = json.loads(Path('results/summary.json').read_text())
          duplicate = json.loads(Path('/tmp/midterm-reproduction/results/summary.json').read_text())
          assert primary == duplicate, 'Scientific metrics do not match regenerated evidence'
          assert len(list(Path('/tmp/midterm-reproduction/figures').glob('fig*.png'))) == 9
          print('Canonical metrics and nine publication figures verified')
          PY

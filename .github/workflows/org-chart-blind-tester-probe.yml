name: Probe org-chart-blind-tester

# One request per model: checks the GitHub Models catalog, the MMLU download and that each model
# returns a parseable answer, then commits results/probe.json to the branch.

on:
  push:
    branches:
      - org-chart-blind-tester
    paths:
      - 'org-chart-blind-tester/common.py'
      - 'org-chart-blind-tester/probe.py'
      - 'org-chart-blind-tester/config.json'
      - '.github/workflows/org-chart-blind-tester-probe.yml'
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: org-chart-blind-tester
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: org-chart-blind-tester/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Test the runner and the analysis against simulated models
        run: python -m unittest discover -s tests -v

      - name: Diagnose the connection to GitHub Models
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          env | grep -i -E '^(https?|no|all)_proxy=' | sed 's/=.*@/=***@/' || echo "no proxy variables"
          getent hosts models.github.ai || true
          getent hosts models.inference.ai.azure.com || true
          for url in https://models.github.ai/catalog/models; do
            curl -sS -D /tmp/h.txt -o /tmp/b.txt -w "GET $url -> %{http_code} from %{remote_ip}, %{size_download} bytes\n" \
              -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" "$url" || true
            cat /tmp/h.txt; head -c 300 /tmp/b.txt; echo
          done
          body='{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Reply with the word ready."}],"max_tokens":5}'
          for url in https://models.github.ai/inference/chat/completions https://models.inference.ai.azure.com/chat/completions; do
            curl -sS -D /tmp/h.txt -o /tmp/b.txt -w "POST $url -> %{http_code} from %{remote_ip}, %{size_download} bytes\n" \
              -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" -H "Content-Type: application/json" -d "$body" "$url" || true
            cat /tmp/h.txt; head -c 300 /tmp/b.txt; echo
          done

      - name: Probe the catalog, MMLU and one call per model
        id: probe
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python probe.py --out results/probe.json

      - name: Commit the probe report
        if: always()
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add results/probe.json
          if git diff --cached --quiet; then
            echo "Probe report unchanged."
          else
            git commit -m "Probe GitHub Models and MMLU for org-chart-blind-tester ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Fail if the probe failed
        if: steps.probe.outcome == 'failure'
        run: |
          cat results/probe.json || true
          exit 1

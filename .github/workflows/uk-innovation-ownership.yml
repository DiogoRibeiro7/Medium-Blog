name: Reproduce uk-innovation-ownership

on:
  pull_request:
    paths:
      - 'uk-innovation-ownership/**'
      - '.github/workflows/uk-innovation-ownership.yml'
  push:
    branches:
      - main
    paths:
      - 'uk-innovation-ownership/**'
      - '.github/workflows/uk-innovation-ownership.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: uk-innovation-ownership
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: uk-innovation-ownership/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test the estimators and the source pins
        run: python -m unittest discover -s tests -v

      - name: Download the OECD and Eurostat tables and check them against the pinned digests
        run: python fetch_data.py

      - name: Rerun the analysis and compare with the committed output
        run: |
          python ownership_numbers.py > "$RUNNER_TEMP/output.txt"
          if ! diff -u output.txt "$RUNNER_TEMP/output.txt" > "$RUNNER_TEMP/diff.txt"; then
            cat "$RUNNER_TEMP/diff.txt"
            echo "::error file=uk-innovation-ownership/output.txt::output of ownership_numbers.py differs from the committed output.txt"
            exit 1
          fi

      - name: Check every figure is drawn
        run: |
          python figures.py
          for f in fig1_growth_and_funding fig2_pensions_and_ownership fig3_ownership_trend fig4_holdout fig5_ict_jobs; do
            test -s "figures/$f.png"
          done

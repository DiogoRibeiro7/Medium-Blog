name: Gaussian graphical models article evidence

on:
  pull_request:
    paths:
      - "gaussian-graphical-models-for-data-scientists/**"
      - ".github/workflows/gaussian-graphical-models.yml"
  push:
    branches: [main]
    paths:
      - "gaussian-graphical-models-for-data-scientists/**"
      - ".github/workflows/gaussian-graphical-models.yml"

jobs:
  verify-article:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gaussian-graphical-models-for-data-scientists
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gaussian-graphical-models-for-data-scientists/requirements.txt
      - name: Install scientific and notebook dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify mathematical invariants and run a fresh notebook kernel
        run: python -m unittest discover -s tests -v
      - name: Verify quick evidence separately
        run: python analysis.py --quick

name: EU Okun live Eurostat validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "eu-okun-law/**"
      - ".github/workflows/eu-okun-law-live.yml"

permissions:
  contents: read

jobs:
  live-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Install locked study package (project-local .venv)
        working-directory: eu-okun-law
        run: |
          poetry check --lock
          poetry install --no-interaction
      - name: Fetch actual quarterly Eurostat responses
        working-directory: eu-okun-law
        run: poetry run eu-okun fetch --start-quarter 2008-Q1 --end-quarter 2026-Q2 --output-dir data
      - name: Audit coverage and provenance
        working-directory: eu-okun-law
        run: poetry run eu-okun audit --output-dir data
      - name: Show source coverage by country
        working-directory: eu-okun-law
        run: |
          poetry run python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/coverage_audit.json").read_text())
          for row in report["by_country"]:
              missing = {key: value["missing"] for key, value in row["series"].items()}
              print(row["geo"], "missing:", missing,
                    "usable Okun pairs:", row["basic_okun_pairs"],
                    "with participation:", row["with_participation_pairs"])
          PY
      - name: Fetch actual monthly Eurostat responses (unemployment, industrial production)
        working-directory: eu-okun-law
        run: poetry run eu-okun fetch-monthly --start-month 2000-01 --output-dir data/monthly
      - name: Audit the monthly snapshot and show its coverage
        working-directory: eu-okun-law
        run: |
          poetry run python - <<'PY'
          from pathlib import Path
          from eu_okun.monthly_data import audit_monthly_snapshot
          manifest = audit_monthly_snapshot(Path("data/monthly"))
          print("period:", manifest["period"])
          for name, entry in manifest["series"].items():
              print(name, entry["dataset"], "updated", entry["updated"],
                    "missing", entry["missing_cells"], "flags", entry["flags"])
          PY
      - name: Keep public source snapshot and audit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eu-okun-eurostat-snapshot
          path: eu-okun-law/data/
          if-no-files-found: error
          retention-days: 30

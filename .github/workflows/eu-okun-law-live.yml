name: EU Okun live Eurostat validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "eu-okun-law/**"
      - ".github/workflows/eu-okun-law-live.yml"

permissions:
  contents: read

jobs:
  live-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install study package
        working-directory: eu-okun-law
        run: python -m pip install -e .
      - name: Fetch actual quarterly Eurostat responses
        working-directory: eu-okun-law
        run: eu-okun fetch --start-quarter 2008-Q1 --end-quarter 2026-Q2 --output-dir data
      - name: Audit coverage and provenance
        working-directory: eu-okun-law
        run: eu-okun audit --output-dir data
      - name: Show source coverage by country
        working-directory: eu-okun-law
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/coverage_audit.json").read_text())
          for row in report["by_country"]:
              missing = {key: value["missing"] for key, value in row["series"].items()}
              print(row["geo"], "missing:", missing,
                    "usable Okun pairs:", row["basic_okun_pairs"],
                    "with participation:", row["with_participation_pairs"])
          PY
      - name: Keep public source snapshot and audit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eu-okun-eurostat-snapshot
          path: eu-okun-law/data/
          if-no-files-found: error
          retention-days: 30

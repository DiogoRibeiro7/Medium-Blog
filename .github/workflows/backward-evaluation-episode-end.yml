name: Reproduce backward-evaluation-episode-end

on:
  pull_request:
    paths:
      - 'backward-evaluation-episode-end/**'
      - 'backward-evaluation/backward_eval.py'
      - 'backward-evaluation/schemes.py'
      - 'backward-evaluation-pooling/pooling.py'
      - 'backward-evaluation-pooling/sims.py'
      - '.github/workflows/backward-evaluation-episode-end.yml'
  push:
    branches:
      - main
    paths:
      - 'backward-evaluation-episode-end/**'
      - 'backward-evaluation/backward_eval.py'
      - 'backward-evaluation/schemes.py'
      - 'backward-evaluation-pooling/pooling.py'
      - 'backward-evaluation-pooling/sims.py'
      - '.github/workflows/backward-evaluation-episode-end.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backward-evaluation-episode-end
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backward-evaluation-episode-end/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q tests

      - name: Forward test
        run: python forward.py --workers 4

      - name: Premise split (S2)
        run: python premise.py

      - name: Simulations, Gaussian models
        run: python sims.py --model gaussian --reps 300 --workers 4

      - name: Simulations, Student-t models
        run: python sims.py --model t --reps 300 --workers 4

      - name: Derived summaries
        run: python post.py

      - name: Figures
        run: python figures.py

      - name: Summaries unchanged within tolerance
        run: |
          git diff --stat -- results || true
          python ../backward-evaluation-pooling/check_results.py results/forward_summary.txt results/premise_summary.txt results/sims_gaussian_summary.txt results/sims_t_summary.txt results/post_summary.txt

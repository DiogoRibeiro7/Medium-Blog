name: EU Okun law CI

on:
  pull_request:
    paths:
      - "eu-okun-law/**"
      - ".github/workflows/eu-okun-law-ci.yml"
  push:
    branches: [main]
    paths:
      - "eu-okun-law/**"
      - ".github/workflows/eu-okun-law-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Install locked study environment (project-local .venv)
        working-directory: eu-okun-law
        run: |
          poetry check --lock
          poetry install --no-interaction --extras dev
      - name: Lint
        working-directory: eu-okun-law
        run: poetry run ruff check src tests
      - name: Types
        working-directory: eu-okun-law
        run: poetry run mypy src
      - name: Offline tests
        working-directory: eu-okun-law
        run: poetry run pytest

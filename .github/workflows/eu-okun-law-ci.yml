name: EU Okun law CI

on:
  pull_request:
    paths:
      - "eu-okun-law/**"
      - ".github/workflows/eu-okun-law-ci.yml"
  push:
    branches: [main]
    paths:
      - "eu-okun-law/**"
      - ".github/workflows/eu-okun-law-ci.yml"
permissions:
  contents: read

jobs:
  validate:
    # Three parallel jobs: lint, types and the fast unit tests (`validate`); the tests that
    # regenerate committed results (`reproduction`); and the end-to-end model fits and
    # report pipelines (`integration`). Markers are defined in eu-okun-law/pyproject.toml.
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: validate
            marker: "not reproduction and not integration"
            static: true
          - name: reproduction
            marker: reproduction
            static: false
          - name: integration
            marker: integration
            static: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Install locked study environment (project-local .venv)
        working-directory: eu-okun-law
        run: |
          poetry check --lock
          poetry install --no-interaction --extras dev
      - name: Lint
        if: matrix.static
        working-directory: eu-okun-law
        run: poetry run ruff check src tests
      - name: Types
        if: matrix.static
        working-directory: eu-okun-law
        run: poetry run mypy src
      - name: Offline tests (${{ matrix.name }})
        working-directory: eu-okun-law
        run: poetry run pytest -m "${{ matrix.marker }}"

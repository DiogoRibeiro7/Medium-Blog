name: Profile data-tests-limits

# Part 4 of Code Quality for Data Work (settings in data-tests-limits/PLAN.md).
# - sources (pushes only): the data dictionaries (where nyc.gov serves them to the runner) and the TLC monthly
#   report from NYC Open Data;
# - profile: every monthly file of yellow, FHV and high-volume FHV, 2019 to 2026-09, reduced to the counts
#   the dictionary rules need, and of green to its row count and schema (one job per feed and year);
# - evaluate: both experiments; commits sources, profiles, results and figures on pushes, and on pull
#   requests compares the regenerated summary with the committed one (using the committed sources).
# Until PLAN.md exists, only the dictionaries and the report's columns are fetched.

on:
  push:
    branches:
      - data-tests-limits
    paths:
      - 'data-tests-limits/feed/**'
      - 'data-tests-limits/evaluate.py'
      - 'data-tests-limits/details.py'
      - 'data-tests-limits/figures.py'
      - 'data-tests-limits/PLAN.md'
      - 'data-tests-limits/requirements.txt'
      - '.github/workflows/data-tests-limits.yml'
  pull_request:
    paths:
      - 'data-tests-limits/**'
      - '.github/workflows/data-tests-limits.yml'
  workflow_dispatch:

concurrency:
  group: data-tests-limits-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-tests-limits
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: data-tests-limits/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit tests
        run: python -m pytest -q

  sources:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: data-tests-limits
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: data-tests-limits/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Snapshot the sources
        run: |
          if [ -f PLAN.md ]; then
            python -m feed.sources --out sources
          else
            echo "No PLAN.md yet: dictionaries and report columns only."
            python -m feed.sources --out sources --metadata-only
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sources
          path: data-tests-limits/sources
          retention-days: 7

  profile:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        feed: [yellow, green, fhv, fhvhv]
        months: ['2019-01:2019-12', '2020-01:2020-12', '2021-01:2021-12', '2022-01:2022-12',
                 '2023-01:2023-12', '2024-01:2024-12', '2025-01:2025-12', '2026-01:2026-09']
    defaults:
      run:
        working-directory: data-tests-limits
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: data-tests-limits/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Name the artifact
        id: name
        run: echo "slug=$(echo '${{ matrix.feed }}-${{ matrix.months }}' | tr ':' '_')" >> "$GITHUB_OUTPUT"
      - name: Restore profiles from earlier runs
        uses: actions/cache/restore@v4
        with:
          path: data-tests-limits/profiles
          key: profiles-${{ steps.name.outputs.slug }}-${{ hashFiles('data-tests-limits/feed/profile.py', 'data-tests-limits/feed/contracts.py') }}-${{ github.run_id }}
          restore-keys: profiles-${{ steps.name.outputs.slug }}-${{ hashFiles('data-tests-limits/feed/profile.py', 'data-tests-limits/feed/contracts.py') }}-
      - name: Profile ${{ matrix.feed }} ${{ matrix.months }}
        run: python -m feed.run --feed ${{ matrix.feed }} --months ${{ matrix.months }} --out profiles --cache /tmp/tlc
      - name: Keep what was profiled, even if some months failed
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data-tests-limits/profiles
          key: profiles-${{ steps.name.outputs.slug }}-${{ hashFiles('data-tests-limits/feed/profile.py', 'data-tests-limits/feed/contracts.py') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: profiles-${{ steps.name.outputs.slug }}
          path: data-tests-limits/profiles
          retention-days: 7

  evaluate:
    needs: [sources, profile]
    if: always() && needs.profile.result == 'success' && needs.sources.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: data-tests-limits
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: data-tests-limits/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Replace the committed profiles with the new ones
        run: rm -rf profiles
      - uses: actions/download-artifact@v4
        with:
          pattern: profiles-*
          path: data-tests-limits/profiles
          merge-multiple: true
      - name: Take the new sources (pushes)
        if: github.event_name != 'pull_request'
        run: rm -rf sources
      - uses: actions/download-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: sources
          path: data-tests-limits/sources
      - name: Run both experiments
        run: python evaluate.py --bundle --profiles profiles --sources sources --out results
      - name: Descriptive numbers quoted in the article
        run: python details.py --profiles profiles --sources sources --results results --out results
      - name: Figures
        run: if [ -f figures.py ]; then python figures.py || echo "figures failed"; fi
      - name: Compare with the committed summary (pull requests)
        if: github.event_name == 'pull_request'
        run: python ../backward-evaluation-pooling/check_results.py results/summary.txt
      - name: Commit sources, profiles and results (pushes to the branch)
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add sources profiles results
          if [ -d figures ]; then git add figures; fi
          if git diff --cached --quiet; then
            echo "Results unchanged."
          else
            git commit -m "data-tests-limits: sources, profiles and results from the workflow ($(date -u +%Y-%m-%d))"
            git push || (git pull --rebase --autostash && git push)
          fi

name: Reproduce taxation-efficiency-drug-prices series

on:
  pull_request:
    paths:
      - 'taxation-efficiency-drug-prices/**'
      - '.github/workflows/taxation-efficiency-drug-prices.yml'
  push:
    branches:
      - main
    paths:
      - 'taxation-efficiency-drug-prices/**'
      - '.github/workflows/taxation-efficiency-drug-prices.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      # One BLAS thread, so floating-point reductions run in a fixed order.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    defaults:
      run:
        working-directory: taxation-efficiency-drug-prices
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: taxation-efficiency-drug-prices/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test the shared tools
        run: python -m unittest discover -s tests -v

      - name: Rerun each part and compare with the committed output
        run: |
          status=0
          for part in part*/ followup*/; do
            [ -d "$part" ] || continue
            # each part has one script that prints the numbers (*_numbers.py); fetch.py and
            # figures.py are not compared
            main=$(ls "$part"*_numbers.py)
            echo "== $main"
            (cd "$part" && python "$(basename "$main")" > "$RUNNER_TEMP/output.txt")
            if ! diff -u "$part/output.txt" "$RUNNER_TEMP/output.txt" > "$RUNNER_TEMP/diff.txt"; then
              cat "$RUNNER_TEMP/diff.txt"
              detail=$(head -c 30000 "$RUNNER_TEMP/diff.txt" | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
              echo "::error file=${part}output.txt::output of $main differs from the committed output.txt%0A$detail"
              status=1
            fi
          done
          exit $status

      - name: Check that the figures script runs
        run: |
          for part in part*/ followup*/; do
            [ -d "$part" ] || continue
            (cd "$part" && python figures.py)
          done

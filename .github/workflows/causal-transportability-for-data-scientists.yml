name: Causal transportability article evidence

on:
  pull_request:
    paths:
      - "causal-transportability-for-data-scientists/**"
      - ".github/workflows/causal-transportability-for-data-scientists.yml"
  push:
    branches: [main]
    paths:
      - "causal-transportability-for-data-scientists/**"
      - ".github/workflows/causal-transportability-for-data-scientists.yml"

jobs:
  verify-article:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: causal-transportability-for-data-scientists
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: causal-transportability-for-data-scientists/requirements.txt
      - name: Install scientific and notebook dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify mathematical identities and notebook from a clean kernel
        run: python -m unittest discover -s tests -v
      - name: Independently regenerate quick evidence
        run: python analysis.py --quick

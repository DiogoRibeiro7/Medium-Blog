name: Refresh europe-deindustrialisation data

on:
  push:
    branches:
      - europe-deindustrialisation
    paths:
      - 'europe-deindustrialisation/fetch.py'
      - 'europe-deindustrialisation/fetch_long.py'
      - 'europe-deindustrialisation/fetch_comext.py'
      - 'europe-deindustrialisation/fetch_hs6.py'
      - 'europe-deindustrialisation/fetch_labels.py'
      - '.github/workflows/europe-deindustrialisation-data.yml'
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only one fetcher (eurostat, ameco, comext, hs6, labels); empty runs all'
        required: false
        default: ''
      hs6_limit:
        description: 'Only the first N HS6 products (testing); empty for all'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: europe-deindustrialisation
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: europe-deindustrialisation/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Download the Eurostat series
        if: inputs.only == '' || inputs.only == null || inputs.only == 'eurostat'
        id: fetch
        continue-on-error: true
        run: python fetch.py --out data

      - name: Download the long AMECO series (DBnomics)
        if: inputs.only == '' || inputs.only == null || inputs.only == 'ameco'
        id: fetch_long
        continue-on-error: true
        run: python fetch_long.py --out data

      - name: Download EU imports by supplier (Comext)
        if: inputs.only == '' || inputs.only == null || inputs.only == 'comext'
        id: fetch_comext
        continue-on-error: true
        run: python fetch_comext.py --out data

      - name: Download the dependency screen inputs by HS 6-digit product (Comext)
        if: inputs.only == '' || inputs.only == null || inputs.only == 'hs6'
        id: fetch_hs6
        continue-on-error: true
        run: python fetch_hs6.py --out data ${{ inputs.hs6_limit && format('--limit {0}', inputs.hs6_limit) || '' }}

      - name: Download the names of HS products (Comext)
        id: fetch_labels
        if: inputs.only == '' || inputs.only == null || inputs.only == 'labels'
        continue-on-error: true
        run: python fetch_labels.py --out data

      - name: Commit the snapshot and its log if they changed
        if: always()
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add data
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "Refresh data snapshot for europe-deindustrialisation ($(date -u +%Y-%m-%d))"
            # files outside data/ can show line-ending changes in the checkout, so no rebase: push, and
            # if the branch moved meanwhile, merge it (it never touches those files) and push again
            pushed=no
            for i in 1 2 3; do
              if git push; then pushed=yes; break; fi
              git pull --no-rebase --no-edit origin "${GITHUB_REF_NAME}" || true
              sleep 5
            done
            test "$pushed" = yes
          fi

      - name: Fail if any request failed
        if: steps.fetch.outcome == 'failure' || steps.fetch_long.outcome == 'failure' || steps.fetch_comext.outcome == 'failure' || steps.fetch_hs6.outcome == 'failure' || steps.fetch_labels.outcome == 'failure'
        run: |
          cat data/fetch_log.txt
          exit 1

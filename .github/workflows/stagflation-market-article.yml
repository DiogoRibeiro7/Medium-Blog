name: Stagflation and market turn article reproducibility

on:
  pull_request:
    paths:
      - "stagflation-market-turn/**"
      - ".github/workflows/stagflation-market-article.yml"
  push:
    paths:
      - "stagflation-market-turn/**"
      - ".github/workflows/stagflation-market-article.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stagflation-market-turn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stagflation-market-turn/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check sources, model contracts, notebook and manuscript
        run: python -m unittest discover -s tests -v
      - name: Regenerate eight publication figures and result tables
        run: python analysis.py
      - name: Verify output counts
        run: python -c "from pathlib import Path; assert len(list(Path('figures').glob('figure_*.png'))) == 8; assert len(list(Path('results').glob('*.csv'))) == 3"

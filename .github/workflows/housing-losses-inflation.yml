name: Reproduce housing-losses-inflation

on:
  pull_request:
    paths:
      - 'housing-losses-inflation/**'
      - '.github/workflows/housing-losses-inflation.yml'
  push:
    branches:
      - main
    paths:
      - 'housing-losses-inflation/**'
      - '.github/workflows/housing-losses-inflation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: housing-losses-inflation
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: housing-losses-inflation/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest -q tests

      - name: Rerun the analysis
        run: python analysis.py > /dev/null

      - name: Check the numbers match the committed run
        run: git diff --exit-code -- results/summary.txt

      - name: Draw the figures
        run: |
          python figures.py
          for f in fig1_three_lenses fig2_holding_losses fig3_hidden_vs_inflation fig4_two_busts fig5_portugal; do
            test -s "figures/$f.png"
          done

name: Test anonymous-bank-redials

on:
  pull_request:
    paths:
      - 'anonymous-bank-redials/**'
      - 'mechanistic-vs-data-driven-generators/src/**'
      - '.github/workflows/anonymous-bank-redials.yml'
  push:
    branches:
      - main
    paths:
      - 'anonymous-bank-redials/**'
      - 'mechanistic-vs-data-driven-generators/src/**'
      - '.github/workflows/anonymous-bank-redials.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anonymous-bank-redials
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: anonymous-bank-redials/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest -q tests

      - name: Smoke-run the experiments on the committed table (quick mode)
        working-directory: anonymous-bank-redials/experiments
        run: |
          python run_all.py --quick
          python make_figures.py
          for f in fig1_caller_ids fig2_lag_lead_slopes fig3_simulation_check fig4_real_estimates; do
            test -s "../figures/$f.png"
          done

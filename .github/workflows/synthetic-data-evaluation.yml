name: Reproduce synthetic-data-evaluation

on:
  pull_request:
    paths:
      - 'synthetic-data-evaluation/**'
      - '.github/workflows/synthetic-data-evaluation.yml'
  push:
    branches:
      - main
    paths:
      - 'synthetic-data-evaluation/**'
      - '.github/workflows/synthetic-data-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: synthetic-data-evaluation
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: synthetic-data-evaluation/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Keep the committed summary
        run: cp results/summary.txt "$RUNNER_TEMP/summary_committed.txt"

      - name: Rerun the evaluation, the coverage studies and the figures
        run: python run_all.py

      - name: Check the numbers match the committed run
        run: python check_reproduction.py "$RUNNER_TEMP/summary_committed.txt" results/summary.txt

      - name: Check every figure was drawn
        run: |
          for f in fig1_coefficients fig2_dcr fig3_three_axes fig4_coverage_mechanism fig5_coverage_adult; do
            test -s "figures/$f.png"
          done

name: INE 0012340 next municipality PR source probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/ine-0012340-pr-bounded-source-probe.yml"

permissions:
  contents: read

jobs:
  next-municipality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CAPTURE_START_INDEX: "10"
      CAPTURE_COUNT: "3"
      CAPTURE_DIMENSION: "Dim2"
      CAPTURE_TIMEOUT_SECONDS: "75"
      EXPECTED_CODES: "1312,1313,1314"
    defaults:
      run:
        working-directory: urban-affordability-cascade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: urban-affordability-cascade/requirements.txt
      - name: Install pinned scientific packages
        run: python -m pip install -r requirements.txt
      - name: Validate geographic bounds and metadata offline
        run: python -m unittest discover -s tests -p 'test_ine_commuting_partitioned_capture.py' -v
      - name: Capture Porto Póvoa de Varzim and Santo Tirso 2021 Dim2 slices
        id: capture
        shell: bash
        run: |
          set +e
          python ine_commuting_partitioned_capture.py \
            --output candidate-capture \
            --start-index "$CAPTURE_START_INDEX" \
            --count "$CAPTURE_COUNT" \
            --dimension "$CAPTURE_DIMENSION" \
            --timeout-seconds "$CAPTURE_TIMEOUT_SECONDS"
          code=$?
          echo "capture_exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Summarise scientific limits
        if: always()
        shell: bash
        run: |
          {
            echo "## INE 0012340 next municipality probe: DICO ${EXPECTED_CODES}"
            echo "Each captured municipality filter must be validated against official metadata and the frozen pairs."
            echo "No observed residential migration or causal price transmission is inferred."
            echo "Inspect the raw responses and partition_manifest.json before broader queries."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve source bytes and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ine-0012340-dim2-1312-1313-1314-candidates
          path: urban-affordability-cascade/candidate-capture/
          if-no-files-found: error
          retention-days: 30
      - name: Classify external network failures after artifact upload
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          path = Path("candidate-capture/partition_manifest.json")
          if not path.is_file():
              sys.exit("Missing partition manifest: capture did not produce auditable evidence")

          manifest = json.loads(path.read_text(encoding="utf-8"))
          rows = manifest.get("items")
          expected_codes = os.environ["EXPECTED_CODES"].split(",")
          expected_count = len(expected_codes)
          if (manifest.get("capture_protocol") != "ine_0012340_2021_dico_partition_candidate_v1"
                  or manifest.get("requested_codes") != expected_codes
                  or manifest.get("capture_count") != expected_count
                  or manifest.get("dimension") != os.environ["CAPTURE_DIMENSION"]
                  or not isinstance(rows, list) or len(rows) != expected_count
                  or any(not isinstance(row, dict) for row in rows)):
              sys.exit("Unexpected partition manifest schema or municipality scope")

          captured = sum(row.get("status") == "captured_unverified" for row in rows)
          failed = [row for row in rows if row.get("status") == "failed"]
          if (captured + len(failed) != expected_count
                  or captured != manifest.get("completed_json_captures")
                  or any(row.get("code") != code
                         for code, row in zip(manifest["requested_codes"], rows))):
              sys.exit("Partition manifest counts or requested identities are inconsistent")

          summary = (f"INE capture outcome: {captured}/{expected_count} "
                     "candidate municipality slices saved.")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write(f"\n### {summary}\n")
              for row in failed:
                  stream.write(
                      f"- {row['code']} {row.get('municipality')}: "
                      f"{row.get('error_type')} ({row.get('error')})\n"
                  )

          transient_http_codes = ("HTTP Error 429:", "HTTP Error 500:",
                                  "HTTP Error 502:", "HTTP Error 503:",
                                  "HTTP Error 504:")
          if any(not (row.get("error_type") in {"URLError", "TimeoutError"}
                      or (row.get("error_type") == "HTTPError"
                          and str(row.get("error", "")).startswith(transient_http_codes)))
                 for row in failed):
              sys.exit("Capture failed for a reason other than external network availability")
          if failed:
              print(f"::warning title=INE source unavailable::{summary} "
                    "See the uploaded partition manifest for the network timeout(s).")
          else:
              print(summary)
          PY

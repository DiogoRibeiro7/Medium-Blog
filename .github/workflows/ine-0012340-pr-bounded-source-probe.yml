name: INE 0012340 two-municipality PR source probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/ine-0012340-pr-bounded-source-probe.yml"

permissions:
  contents: read

jobs:
  first-two:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: urban-affordability-cascade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: urban-affordability-cascade/requirements.txt
      - name: Install pinned scientific packages
        run: python -m pip install -r requirements.txt
      - name: Validate geographic bounds and metadata offline
        run: python -m unittest discover -s tests -p 'test_ine_commuting_partitioned_capture.py' -v
      - name: Capture two candidate 2021 Dim2 municipality slices
        id: capture
        shell: bash
        run: |
          set +e
          python ine_commuting_partitioned_capture.py \
            --output candidate-capture \
            --start-index 0 \
            --count 2 \
            --dimension Dim2
          code=$?
          echo "capture_exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Summarise scientific limits
        if: always()
        shell: bash
        run: |
          {
            echo "## INE 0012340 first two-municipality probe"
            echo "The capture is exploratory. Dim2 filter effectiveness is not established."
            echo "No observed residential migration or causal price transmission is inferred."
            echo "Inspect the raw responses and partition_manifest.json before broader queries."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve source bytes and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ine-0012340-first-two-dim2-candidate
          path: urban-affordability-cascade/candidate-capture/
          if-no-files-found: error
          retention-days: 30
      - name: Report capture failure after artifact upload
        if: always() && steps.capture.outputs.capture_exit_code != '0'
        run: exit 1

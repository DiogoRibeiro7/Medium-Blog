name: Reproduce lump-sum-vs-spreading

on:
  pull_request:
    paths:
      - 'lump-sum-vs-spreading/**'
      - '.github/workflows/lump-sum-vs-spreading.yml'
  push:
    branches:
      - main
    paths:
      - 'lump-sum-vs-spreading/**'
      - '.github/workflows/lump-sum-vs-spreading.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: lump-sum-vs-spreading
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: lump-sum-vs-spreading/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test the methods on cases with a known answer
        run: python -m unittest discover -s tests -v

      - name: Download Shiller's data, check its digest, and compare the snapshot with the OECD
        run: python fetch_data.py

      - name: Rerun the analysis and compare with the committed output
        run: |
          python lump_numbers.py > "$RUNNER_TEMP/output.txt"
          if ! diff -u output.txt "$RUNNER_TEMP/output.txt" > "$RUNNER_TEMP/diff.txt"; then
            cat "$RUNNER_TEMP/diff.txt"
            echo "::error file=lump-sum-vs-spreading/output.txt::output of lump_numbers.py differs from the committed output.txt"
            exit 1
          fi

      - name: Check every figure is drawn
        run: |
          python figures.py
          for f in fig1_countries fig2_advantage fig3_outcomes fig4_lengths fig5_conditions fig6_us; do
            test -s "figures/$f.png"
          done

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

[project]
name = "eu-okun-law"
version = "0.1.0"
description = "Reproducible EU-27 Okun's-law study"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
keywords = ["econometrics", "okun-law", "eurostat", "panel-data"]
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
report = ["matplotlib>=3.9,<4"]
# Hierarchical Bayesian models: NumPyro's NUTS on JAX, ArviZ diagnostics. Minor versions
# are bounded because sampler output can change between releases; poetry.lock pins them.
# h5netcdf: the NetCDF4 engine ArviZ needs to write posterior artifacts.
bayes = ["numpyro>=0.22,<0.23", "jax>=0.11,<0.12", "arviz>=1.3,<1.4", "scipy>=1.14,<2",
         "h5netcdf[h5py]>=1.4,<2"]
# Structural identification: reading the published oil supply news shock workbook.
structural = ["openpyxl>=3.1,<4"]
dev = [
    "pytest>=8,<10", "ruff>=0.13,<1", "mypy>=1.16,<2", "matplotlib>=3.9,<4",
    "numpyro>=0.22,<0.23", "jax>=0.11,<0.12", "arviz>=1.3,<1.4", "scipy>=1.14,<2",
    "h5netcdf[h5py]>=1.4,<2", "openpyxl>=3.1,<4",
]

[project.scripts]
eu-okun = "eu_okun.cli:main"

[tool.poetry]
packages = [{ include = "eu_okun", from = "src" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# `pytest` runs everything. `pytest -m "not reproduction and not integration"` runs the
# fast unit tests only; CI runs the three groups as parallel jobs.
markers = [
    "reproduction: regenerates or reproduces committed results from the frozen snapshots",
    "integration: fits or scores models end to end, or runs a whole report pipeline",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src"]
strict = true

# NumPyro, ArviZ and SciPy ship no type information; everything else stays strictly
# checked.
[[tool.mypy.overrides]]
module = ["numpyro", "numpyro.*", "arviz", "arviz.*", "arviz_base.*", "arviz_stats.*",
          "scipy", "scipy.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

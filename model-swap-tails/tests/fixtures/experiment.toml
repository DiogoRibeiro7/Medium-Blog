# Experiment definition. Every number in results/ comes from this file, the data the
# fetch step downloads, and the code in src/swaptails.
#
# One pipeline, two model slots:
#   1. a language model reads a calendar note for each day and labels the day
#      (workday, saturday_like, sunday_like);
#   2. a time-series foundation model forecasts tomorrow's load, optionally with that label
#      (and the temperature forecast) as known future covariates.
# Each slot is filled in turn by European, US and Chinese models, and the result is scored
# on average and on the days that carry the risk.

[data]
load_endpoint = "https://api.energy-charts.info/public_power"
load_series = "Load"
tso_endpoint = "https://api.energy-charts.info/public_power_forecast"
weather_endpoint = "https://previous-runs-api.open-meteo.com/v1/forecast"
# Forecast made two days earlier: for every hour from the 18:00 cutoff to the end of the
# target day, the run that produced it started before the cutoff.
weather_variable = "temperature_2m_previous_day2"
first_day = "2024-09-01"
last_day = "2025-03-31"
# Energy-Charts allows 2 requests per minute.
pause_seconds = 0
cache_dir = "data/cache"
manifest = "data/manifest.json"
attribution_load = "Load and day-ahead load forecasts: energy-charts.info (Fraunhofer ISE), CC BY 4.0"
attribution_weather = "Temperature forecasts: Open-Meteo.com, CC BY 4.0"
# More missing hours than this in a country's evaluation year stops the run.
max_missing_hours = 336

# Hours that are not a forecasting problem. Never scored; inside a context window they are
# replaced by the same hour one week earlier.
[[data.masks]]
name = "iberian-blackout-pt"
countries = ["pt"]
start = "2025-04-28T10:00:00Z"
end = "2025-04-28T22:00:00Z"
reason = "Iberian blackout at 12:33 CEST; Portuguese load near zero until the evening"

[[data.masks]]
name = "iberian-blackout-es"
countries = ["es"]
start = "2025-04-28T10:00:00Z"
end = "2025-04-29T06:00:00Z"
reason = "Iberian blackout at 12:33 CEST; Spanish load restored overnight"

[design]
forecast_first_day = "2025-01-01"
forecast_last_day = "2025-03-31"
# Years in which the language models' labels are scored. 2024 is also needed for the
# covariates inside the forecasting context windows.
label_years = [2024, 2025]
# Forecasts are issued at this local hour on the day before; the last observed hour is the
# one that ends at the cutoff.
cutoff_local_hour = 18
# Longest context any model gets, in hours. Each model may cap it lower (max_context).
context_hours = 2016
quantiles = [0.1, 0.5, 0.9]
seed = 20261122

[labels]
# Ex-post day type: a day's mean load is compared with ordinary days in this many days on
# either side.
truth_window_days = 28
# Days within this many days of a holiday are sent to the language model (one catches every
# bridge day: Friday after a Thursday holiday, Monday before a Tuesday one).
candidate_margin_days = 1
# The year-end period is sent to the language model whether or not it holds a holiday.
year_end_from = "12-20"
year_end_to = "01-06"
# Ordinary days per country and year also sent to the language model, as controls.
control_days_per_year = 12
# Subdivisions with more holidays than this are listed by count only in the note.
max_regions_named = 8
prompt_version = "v1"

[evaluation]
# A day is in the tail when its daily WAPE is at or above this quantile.
tail_quantile = 0.95
# A day has extreme temperature when its mean forecast temperature is outside these
# quantiles of the country's evaluation year.
extreme_temperature_quantiles = [0.05, 0.95]
bootstrap_replications = 200
bootstrap_block_days = 7
# The variant that stands for a model with covariates in the headline comparison: the
# national holiday flag plus temperature, the set-up of the LinkedIn benchmark. Models
# without covariates are always run on the load history alone.
headline_variant = "flag"
# The operator's forecast enters comparisons only in countries where it covers at least
# this share of the scored days.
reference_min_coverage = 0.9
# Weeks drawn in the example figure: [country, first day].
examples = [["de", "2025-01-06"], ["pt", "2025-02-24"]]

# ------------------------------------------------------------------------------ countries
# ec: Energy-Charts country code; holidays: code in the `holidays` package;
# exclude_subdivisions: subdivisions outside the grid the load series covers (islands,
# overseas territories) or below regional level; include_subdivisions, when given, keeps only
# those; subdivision_term: what the note calls them. Cities: equal-weight temperature proxy.

[countries.pt]
name = "Portugal"
tz = "Europe/Lisbon"
ec = "pt"
holidays = "PT"
exclude_subdivisions = ["20", "30"]
subdivision_term = "districts, holiday of the district capital"
cities = [["Lisboa", 38.72, -9.14], ["Porto", 41.15, -8.61], ["Coimbra", 40.21, -8.43]]

[countries.de]
name = "Germany"
tz = "Europe/Berlin"
ec = "de"
holidays = "DE"
exclude_subdivisions = ["Augsburg"]
subdivision_term = "states"
cities = [["Berlin", 52.52, 13.40], ["Hamburg", 53.55, 9.99], ["München", 48.14, 11.58], ["Köln", 50.94, 6.96], ["Frankfurt", 50.11, 8.68], ["Stuttgart", 48.78, 9.18]]
# ------------------------------------------------------------------------------ language models

[llms.rule_eu]
label = "Rule stand-in A"
bloc = "Europe"
developer = "test"
licence = "-"
backend = "rule"
model = "rule-a"

[llms.rule_cn]
label = "Rule stand-in B"
bloc = "China"
developer = "test"
licence = "-"
backend = "rule"
model = "rule-b"

[forecasters.seasonal_naive]
label = "Seasonal naive (week)"
bloc = "Reference"
developer = "-"
kind = "seasonal_naive"
covariates = false
max_context = 336

[forecasters.similar_day]
label = "Similar day"
bloc = "Europe"
developer = "-"
kind = "similar_day"
covariates = true
max_context = 2016
batch_size = 64

[variants]
names = ["none", "temp", "flag", "llm", "oracle"]

holidays = "FR"
exclude_subdivisions = ["971", "972", "973", "974", "976", "BL", "MF", "NC", "PF", "PM", "TF", "WF"]
subdivision_term = "departments"
cities = [["Paris", 48.86, 2.35], ["Lyon", 45.76, 4.84], ["Marseille", 43.30, 5.37], ["Lille", 50.63, 3.06], ["Toulouse", 43.60, 1.44]]

[countries.be]

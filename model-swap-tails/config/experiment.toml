bloc = "United States"
developer = "Amazon"
kind = "chronos2"
repo = "amazon/chronos-2"
revision = ""
covariates = true
max_context = 8192
batch_size = 32

[forecasters.timesfm25]
label = "TimesFM 2.5"
bloc = "United States"
developer = "Google"
kind = "timesfm25"
repo = "google/timesfm-2.5-200m-pytorch"
revision = ""
covariates = false
max_context = 8760
batch_size = 32

[forecasters.sundial]
label = "Sundial"
bloc = "China"
developer = "Tsinghua University"
kind = "sundial"
repo = "thuml/sundial-base-128m"
revision = ""

bloc = "Reference"
developer = "-"
kind = "seasonal_naive"
covariates = false
max_context = 336

[forecasters.similar_day]
label = "Similar day"
bloc = "Reference"
developer = "-"
kind = "similar_day"
covariates = true
max_context = 8760

# Covariate variants run for every model with covariates = true. "llm" expands to one
# variant per language model above.
[variants]
names = ["none", "temp", "flag", "llm", "oracle"]

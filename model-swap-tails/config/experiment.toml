# ------------------------------------------------------------------------------ language models
# Served locally by Ollama, quantised to 4 bits, on CPU. `think = false` switches off the
# reasoning trace of models that have one. Any OpenAI-compatible server can be used instead
# with backend = "openai" and base_url.

[llms.ministral3_8b]
label = "Ministral 3 8B"
bloc = "Europe"
developer = "Mistral AI (France)"
licence = "Apache-2.0"
backend = "ollama"
model = "ministral-3:8b"

[llms.eurollm_9b]
label = "EuroLLM 9B Instruct"
bloc = "Europe"
developer = "EuroLLM consortium (EU research universities and companies)"
licence = "Apache-2.0"
backend = "ollama"
model = "hf.co/bartowski/EuroLLM-9B-Instruct-GGUF:Q4_K_M"

[llms.gemma4_12b]
label = "Gemma 4 12B"
bloc = "United States"
developer = "Google"
licence = "see model card (recorded from Ollama in labels/*.provenance.json)"
backend = "ollama"
model = "gemma4:12b"
think = false

[llms.llama31_8b]
label = "Llama 3.1 8B"
bloc = "United States"
developer = "Meta"
licence = "Llama 3.1 Community License"
backend = "ollama"
model = "llama3.1:8b"

[llms.qwen35_9b]
label = "Qwen3.5 9B"
bloc = "China"
developer = "Alibaba (Qwen team)"
licence = "see model card (recorded from Ollama in labels/*.provenance.json)"
backend = "ollama"
model = "qwen3.5:9b"
think = false

[llms.qwen3_8b]
label = "Qwen3 8B"
bloc = "China"
developer = "Alibaba (Qwen team)"
licence = "Apache-2.0"
backend = "ollama"
model = "qwen3:8b"
think = false

# ------------------------------------------------------------------------------ forecasters
# covariates = true: the model takes known future covariates, so it is run with each
# covariate variant; otherwise it is run on the load history alone.

[forecasters.timestral_209m]
label = "Timestral 209M"
bloc = "Europe"
developer = "Mistral AI (France)"
kind = "timestral"
repo = "mistralai/Timestral-209M"
revision = ""
covariates = true
max_context = 32768
batch_size = 32

[forecasters.t0_gamma]
label = "t0-gamma"
bloc = "Europe"
developer = "The Forecasting Company (Paris; Y Combinator-backed)"
kind = "t0"
repo = "theforecastingcompany/t0-gamma"
revision = ""
covariates = true
max_context = 8760
batch_size = 16

[forecasters.tirex]

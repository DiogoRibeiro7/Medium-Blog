# Parties in government, [start, end). The 2010-15 coalition counts both partners.
[[government]]
start = 1979-05-04
end = 1997-05-02
parties = ["Conservative"]

[[government]]
start = 1997-05-02
end = 2010-05-11
parties = ["Labour"]

[[government]]
start = 2010-05-11
end = 2015-05-08
parties = ["Conservative", "Liberal Democrat"]

[[government]]
start = 2015-05-08
end = 2021-12-31
parties = ["Conservative"]

[sample]
# Validation sample of Chair speeches, stratified by era x dictionary tag x side of the
# Member who last had the floor. Sizes are per stratum; a stratum smaller than its
# target is taken whole. The sample is drawn once: `sample` refuses to overwrite it.
seed = 20261016
tagged_government = 30
tagged_opposition = 30
tagged_other = 10
untagged_government = 25
untagged_opposition = 25
untagged_other = 10
context_chars = 700                        # how much of the neighbouring speeches to show

[estimate]
draws = 20000                              # Monte Carlo draws from the stratum posteriors
prior = 0.5                                # Beta(prior, prior) per stratum: Jeffreys
reference_era = "Weatherill"               # decomposition baseline: the most policed era
seed = 7

[transfer]
seed = 11
min_df = 2
ngram_max = 2
c = 1.0
class_weight = "balanced"                 # positives are about one in five labelled items
cv_folds = 5
cv_repeats = 5
bootstrap = 2000

[lexical]
min_count = 50                             # a term must occur this often across all eras
top_n = 20
prior_strength = 1000.0                    # alpha_0 of the informative Dirichlet prior

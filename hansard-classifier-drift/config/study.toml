# Study configuration. Every number the article reports is produced from this file,
# the dictionary in src/hansard_drift/dictionary.py and the hand labels in labels/.

[data]
repo_id = "biglam/hansard_speech"          # Odell, Hansard Speeches 1979-2021 v3.1.0, CC BY 4.0
revision = "refs/convert/parquet"          # the parquet conversion on the Hugging Face hub
pattern = "default/train/*.parquet"
cache_dir = ".cache/hansard"               # downloaded parquet files (not committed)
build_dir = ".cache/build"                 # intermediate tables (not committed)

# Eras are Speakerships. An era runs from the day a Speaker was elected to the day the
# next one was; Deputy Speakers and committee chairs count in the era of the Speaker.
# The corpus starts on 9 May 1979 and ends on 29 April 2021.
[[eras]]
name = "Thomas"
speaker = "George Thomas"
start = 1979-05-09
end = 1983-06-15

[[eras]]
name = "Weatherill"
speaker = "Bernard Weatherill"
start = 1983-06-15
end = 1992-04-27

[[eras]]
name = "Boothroyd"
speaker = "Betty Boothroyd"
start = 1992-04-27
end = 2000-10-23

[[eras]]
name = "Martin"
speaker = "Michael Martin"
start = 2000-10-23
end = 2009-06-22

[[eras]]
name = "Bercow"
speaker = "John Bercow"
start = 2009-06-22
end = 2019-11-04

[[eras]]
name = "Hoyle"
speaker = "Lindsay Hoyle"
start = 2019-11-04
end = 2021-04-30
partial = true                             # 18 months, most of them in the hybrid Covid Parliament

# Deputy Speakers who appear in the record under their own names, with no title and no
# post, from 1997 on. A row by one of them inside their term counts as the Chair. Terms are
# [start, end] as given in each member's Wikipedia infobox (checked 16 October 2026);
# earlier Deputy Speakers are printed with their titles and need no roster.
[[roster]]
name = "Alan Haselhurst"
office = "Chairman of Ways and Means"
start = 1997-05-14
end = 2010-06-08

[[roster]]

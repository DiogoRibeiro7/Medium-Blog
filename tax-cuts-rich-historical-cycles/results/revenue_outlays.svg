<text x="86" y="258.20" text-anchor="end" font-family="sans-serif" font-size="13">21%</text>
<line x1="100.0" x2="1010.0" y1="181.60" y2="181.60" stroke="#ddd"/>
<text x="86" y="186.60" text-anchor="end" font-family="sans-serif" font-size="13">24%</text>
<line x1="100.0" x2="1010.0" y1="110.00" y2="110.00" stroke="#ddd"/>
<text x="86" y="115.00" text-anchor="end" font-family="sans-serif" font-size="13">27%</text>

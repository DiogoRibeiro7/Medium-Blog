[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

[project]
name = "eu-wheat-weather"
version = "0.1.0"
description = "Reproducible study of heat, drought and wheat yields in EU NUTS-2 regions"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
keywords = ["agriculture", "wheat", "climate", "eurostat", "e-obs", "panel-data"]
# numpy for the arrays, shapely for the cell-region intersections, netCDF4 to read E-OBS.
dependencies = ["numpy>=2.0,<3", "shapely>=2.0,<3", "netCDF4>=1.7,<2"]

[project.optional-dependencies]
# Reading Eurostat's official NUTS change tables (.xls and .xlsx).
nuts = ["openpyxl>=3.1,<4", "xlrd>=2.0,<3"]
dev = ["pytest>=8,<10", "ruff>=0.13,<1", "mypy>=1.16,<2", "types-shapely>=2.0,<3",
       "types-openpyxl>=3.1,<4", "openpyxl>=3.1,<4", "xlrd>=2.0,<3"]

[project.scripts]
eu-wheat = "eu_wheat_weather.cli:main"

[tool.poetry]
packages = [{ include = "eu_wheat_weather", from = "src" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
# xlrd ships no type information.
module = ["xlrd"]
ignore_missing_imports = true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-label="Modelled annual IMI bills for VPT EUR 150000 and tax rate 0.35 percent"><rect width="960" height="510" fill="#fff"/><text x="44" y="50" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#192331">What the statutory IMI multipliers imply</text><text x="44" y="89" font-size="15" font-family="Arial" fill="#455262">Illustrative taxable value (VPT) €150,000 · municipal rate 0.35%</text><rect x="100" y="391.8" width="114" height="13.200000000000001" fill="#2f6291"/><text x="157" y="378.8" font-family="Arial" font-size="22" text-anchor="middle" font-weight="700" fill="#202c39">€525</text><text x="157" y="433" font-family="Arial" font-size="16" text-anchor="middle">1× ordinary</text><rect x="308" y="365.4" width="114" height="39.6" fill="#2f6291"/><text x="365" y="352.4" font-family="Arial" font-size="22" text-anchor="middle" font-weight="700" fill="#202c39">€1,575</text><text x="365" y="433" font-family="Arial" font-size="16" text-anchor="middle">3× ordinary</text><rect x="516" y="273" width="114" height="132" fill="#c58b42"/><text x="573" y="260" font-family="Arial" font-size="22" text-anchor="middle" font-weight="700" fill="#202c39">€5,250</text><text x="573" y="433" font-family="Arial" font-size="16" text-anchor="middle">10× ordinary</text><rect x="724" y="141" width="114" height="264" fill="#c58b42"/><text x="781" y="128" font-family="Arial" font-size="22" text-anchor="middle" font-weight="700" fill="#202c39">€10,500</text><text x="781" y="433" font-family="Arial" font-size="16" text-anchor="middle">20× ordinary</text><line x1="50" y1="406" x2="910" y2="406" stroke="#283849"/><line x1="44" y1="463" x2="920" y2="463" stroke="#b8bdc4"/><text x="44" y="487" font-size="13" font-family="Arial" fill="#626870">Tax arithmetic only. Actual assessed values, eligibility and municipal rules differ.</text></svg>
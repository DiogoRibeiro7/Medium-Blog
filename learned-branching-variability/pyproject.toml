[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learned-branching-variability"
version = "0.1.0"
description = "Imitation of strong branching in SCIP, evaluated against solver performance variability and instance-size shift."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyscipopt>=5.0",
    "joblib>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gd-edge-of-stability"
version = "0.1.0"
description = "Experiments on gradient descent at the edge of stability: an exactly solvable two-parameter model, a period-doubling route to chaos, and a small network on real data."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "jax>=0.4.30",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
